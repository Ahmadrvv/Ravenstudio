                </div>
            );
        }
        // Pemutar lagu bergaya glass dengan tombol Download yang selalu terlihat.
        function SongPlayer({ src, audioRef, knownDuration, onPlay, onPause, onEnded, onSeeked, onDownload, dlBusy, dlDisabled }) {
            const ownRef = useRef(null);
            const ref = audioRef || ownRef;
            const barRef = useRef(null);
            const dragRef = useRef(false);
            const [playing, setPlaying] = useState(false);
            const [loading, setLoading] = useState(false);
            const [cur, setCur] = useState(0);
            const [dur, setDur] = useState(0);
            const total = dur || Number(knownDuration) || 0;
            const pct = total ? Math.min(100, Math.max(0, (cur / total) * 100)) : 0;
            const toggle = () => {
                const a = ref.current;
                if (!a) return;
                if (a.paused) {
                    document.querySelectorAll('audio').forEach(el => { if (el !== a && !el.paused) { try { el.pause(); } catch (e) {} } });
                    setLoading(true);
                    const p = a.play();
                    if (p && p.catch) p.catch(() => { setLoading(false); showToast('Audio tidak dapat diputar.', 'error'); });
                } else a.pause();
            };
            const seekAt = (x) => {
                const a = ref.current, el = barRef.current;
                if (!a || !el || !total) return;
                const r = el.getBoundingClientRect();
                const p = Math.min(1, Math.max(0, (x - r.left) / r.width));
                try { a.currentTime = p * total; } catch (e) {}
                setCur(p * total);
            };
            const setD = (e) => { const d = e.currentTarget.duration; if (isFinite(d) && d > 0) setDur(d); };
            return (
                <div className="flex items-center gap-3 p-2 pr-2.5 rounded-xl bg-black/40 border border-white/10 shadow-inner">
                    <audio ref={ref} preload="none" src={src} className="hidden"
                        onPlay={(e) => { setPlaying(true); if (onPlay) onPlay(e); }}
                        onPlaying={() => setLoading(false)}
                        onWaiting={() => setLoading(true)}
                        onPause={(e) => { setPlaying(false); setLoading(false); if (onPause) onPause(e); }}
                        onEnded={(e) => { setPlaying(false); setLoading(false); if (onEnded) onEnded(e); }}
                        onLoadedMetadata={setD} onDurationChange={setD}
                        onTimeUpdate={(e) => { if (!dragRef.current) setCur(e.currentTarget.currentTime); }}
                        onSeeked={(e) => { setCur(e.currentTarget.currentTime); if (onSeeked) onSeeked(e); }}
                        onError={() => { setLoading(false); setPlaying(false); }}></audio>
                    <button type="button" onClick={toggle} aria-label={playing ? 'Jeda' : 'Putar'} className="w-10 h-10 shrink-0 rounded-full bg-white text-black flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition-transform">
                        <i className={`fa-solid ${playing && loading ? 'fa-circle-notch fa-spin' : playing ? 'fa-pause' : 'fa-play ml-0.5'} text-sm`}></i>
                    </button>
                    <div className="flex-1 min-w-0 flex flex-col gap-1">
                        <div ref={barRef} role="slider" aria-label="Posisi lagu" aria-valuemin={0} aria-valuemax={Math.round(total)} aria-valuenow={Math.round(cur)}
                            className="relative h-4 flex items-center cursor-pointer touch-none group/bar"
                            onPointerDown={(e) => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {} dragRef.current = true; seekAt(e.clientX); }}
                            onPointerMove={(e) => { if (dragRef.current) seekAt(e.clientX); }}
                            onPointerUp={() => { dragRef.current = false; }}
                            onPointerCancel={() => { dragRef.current = false; }}>
                            <div className="w-full h-1 rounded-full bg-white/15 overflow-hidden"><div className="h-full bg-white rounded-full" style={{ width: pct + '%' }}></div></div>
                            <span className={`absolute top-1/2 w-3 h-3 -mt-1.5 -ml-1.5 rounded-full bg-white shadow-[0_0_0_3px_rgba(0,0,0,0.45)] transition-opacity ${playing ? 'opacity-100' : 'opacity-0 group-hover/bar:opacity-100'}`} style={{ left: pct + '%' }}></span>
                        </div>
                        <div className="flex justify-between text-[10px] font-mono text-zinc-500 leading-none">
                            <span className={playing ? 'text-zinc-300' : ''}>{formatTime(cur)}</span>
                            <span>{total ? formatTime(total) : '--:--'}</span>
                        </div>
                    </div>
                    {onDownload && (
                        <button type="button" onClick={onDownload} disabled={dlDisabled || dlBusy} title="Unduh MP3" aria-label="Unduh lagu" className="h-10 px-3 sm:px-3.5 shrink-0 rounded-lg glass-btn text-zinc-200 hover:text-white disabled:opacity-50 flex items-center justify-center gap-2 text-[10px] font-semibold uppercase tracking-wider">
                            {dlBusy ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-download"></i>}<span className="hidden sm:inline">Unduh</span>
                        </button>
                    )}
                </div>
            );
        }

        // --- Durasi: menerima lagu + lirik bertimestamp dari Music Labs (belum ada pemecahan scene) ---
        const KIE_TS_V1 = 'https://api.kie.ai/api/v1/generate/get-timestamped-lyrics';
        const KIE_TS_MARKET = 'https://api.kie.ai/api/v1/jobs/createTask';
        const KIE_JOB_INFO = 'https://api.kie.ai/api/v1/jobs/recordInfo';
        const TS_CACHE = 'raven_ts_v1';
        const TS_CACHE_MAX = 40;
        const tsSleep = (ms) => new Promise(r => setTimeout(r, ms));
        const tsIsNum = (v) => v !== null && v !== '' && v !== undefined && isFinite(Number(v));
        const loadTsCache = () => { try { const c = JSON.parse(localStorage.getItem(TS_CACHE) || '{}'); return c && typeof c === 'object' ? c : {}; } catch (e) { return {}; } };
        const saveTsEntry = (id, entry) => {
            const c = { ...loadTsCache(), [id]: entry };
            const ids = Object.keys(c).sort((a, b) => (c[b].fetchedAt || 0) - (c[a].fetchedAt || 0));
            ids.slice(TS_CACHE_MAX).forEach(k => delete c[k]);
            try { localStorage.setItem(TS_CACHE, JSON.stringify(c)); } catch (e) {}
        };
        const fmtTs = (s) => {
            if (!tsIsNum(s)) return '--:--.-';
            const v = Math.max(0, Number(s));
            return `${String(Math.floor(v / 60)).padStart(2, '0')}:${(v % 60).toFixed(1).padStart(4, '0')}`;
        };

        async function tsPost(url, key, body, ms = 60000) {
            const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
            try {
                const r = await fetch(url, { method: 'POST', signal: ctl.signal, headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                return { r, j: await r.json().catch(() => ({})) };
            } finally { clearTimeout(tm); }
        }
        const tsAuthFail = (r, j) => [401, 402, 403].includes(r.status) || [401, 402, 403].includes(Number(j && j.code));
        const tsErr = (r, j) => Object.assign(new Error((j && (j.msg || j.message)) || ('HTTP ' + r.status)), { auth: tsAuthFail(r, j) });
        function tsPick(o, depth = 0) {
            if (!o || typeof o !== 'object' || depth > 5) return null;
            if (Array.isArray(o.alignedWords)) return { words: o.alignedWords, cer: o.hootCer };
            if (Array.isArray(o.aligned_words)) return { words: o.aligned_words, cer: o.hoot_cer ?? o.hootCer };
            for (const k of ['data', 'resultObject', 'response', 'result']) { const x = tsPick(o[k], depth + 1); if (x) return x; }
            return null;
        }
        async function tsV1(song, key) {
            const { r, j } = await tsPost(KIE_TS_V1, key, { taskId: song.taskId, audioId: song.audioId });
            if (!r.ok || Number(j.code) !== 200) throw tsErr(r, j);
            const a = tsPick(j.data);
            if (!a) throw new Error('respons tanpa alignedWords');
            return a;
        }
        async function tsMarket(song, key) {
            const { r, j } = await tsPost(KIE_TS_MARKET, key, { model: 'ai-music-api/timeStamped-lyrics', input: { task_id: song.taskId, audio_id: song.audioId } });
            if (!r.ok || Number(j.code) !== 200) throw tsErr(r, j);
            const d = j.data || {};
            if (d.code != null && Number(d.code) !== 200) throw new Error(d.msg || ('kode ' + d.code));
            const a = tsPick(d);
            if (a) return a;
            if (!d.taskId) throw new Error('respons tanpa data lirik');
            for (let i = 0; i < 40; i++) {
                await tsSleep(3000);
                const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);
                let jj = {};
                try { const rr = await fetch(`${KIE_JOB_INFO}?taskId=${encodeURIComponent(d.taskId)}`, { headers: { 'Authorization': `Bearer ${key}` }, signal: ctl.signal }); jj = await rr.json().catch(() => ({})); }
                catch (e) { continue; } finally { clearTimeout(tm); }
                if (Number(jj.code) !== 200 || !jj.data) continue;
                if (jj.data.state === 'success') {
                    let res = jj.data.response;
                    if (!res && jj.data.resultJson) { try { res = JSON.parse(jj.data.resultJson); } catch (e) {} }
                    const x = tsPick(res);
                    if (x) return x;
                    throw new Error('hasil tanpa alignedWords');
                }
                if (jj.data.state === 'fail') throw new Error(jj.data.failMsg || 'tugas gagal');
            }
            throw new Error('terlalu lama menunggu hasil');
        }
        // key aktif dulu; key yang ditolak (401/402/403) dilewati ke key berikutnya
        async function fetchTimestamps(song, onLog) {
            const keys = ravenKieList();
            if (!keys.length) throw Object.assign(new Error('API key Kie belum diisi.'), { noKey: true });
            let last = null;
            for (const key of keys) {
                for (const [name, fn] of [['v1', tsV1], ['market', tsMarket]]) {
                    try { return await fn(song, key); }
                    catch (e) {
                        last = e;
                        onLog(`Kie ${name} · key …${key.slice(-4)}: ${e.name === 'AbortError' ? 'timeout' : e.message}`);
                        if (e.auth) break;
                    }
                }
            }
            throw last || new Error('Gagal mengambil data');
        }

        // Normalisasi bentuk data (camelCase / snake_case) tanpa mengubah isi.
        const tsWord = (w, i) => {
            const s = w.startS ?? w.start_s ?? w.start, e = w.endS ?? w.end_s ?? w.end;
            const ok = w.success !== false && tsIsNum(s) && tsIsNum(e);
            return { i, text: String(w.word ?? w.text ?? ''), start: tsIsNum(s) ? Number(s) : null, end: tsIsNum(e) ? Number(e) : null, ok };
        };
        // Tampilan baca: memakai baris baru & tag [Bagian] yang sudah ada di data Kie. Tidak ada pemecahan scene.
        function tsReadView(words) {
            const toks = (words || []).map(tsWord);
            const out = [];
            let cur = null;
            const flush = () => {
                if (cur && cur.toks.some(t => /[\p{L}\p{N}]/u.test(t.text))) {
                    const okT = cur.toks.filter(t => t.ok);
                    cur.start = okT.length ? okT[0].start : null;
                    cur.end = okT.length ? okT[okT.length - 1].end : null;
                    out.push(cur);
                }
                cur = null;
            };
            toks.forEach(t => {
                t.text.replace(/\r/g, '').split(/(\[[^\]\n]*\]|\n)/).forEach(part => {
                    if (!part) return;
                    if (part === '\n') { flush(); return; }
                    if (/^\[[^\]\n]*\]$/.test(part)) { flush(); out.push({ type: 'section', label: part.slice(1, -1).trim() }); return; }
                    if (!cur) cur = { type: 'line', toks: [] };
                    cur.toks.push({ ...t, text: part });
                });
            });
            flush();
            const lines = out.filter(x => x.type === 'line');
            const okCount = toks.filter(t => t.ok).length;
            const okAll = toks.filter(t => t.ok);
            return {
                items: out, lines, toks,
                stats: { words: toks.length, lines: lines.length, okPct: toks.length ? Math.round(okCount / toks.length * 100) : 0, first: okAll.length ? okAll[0].start : null, last: okAll.length ? okAll[okAll.length - 1].end : null }
            };
        }

        function DurasiView({ lib, setLib, active, onGoMusic }) {
            const all = (lib && Array.isArray(lib.covers)) ? lib.covers : [];
            const songs = all.map((x, idx) => ({ x, idx })).filter(o => o.x && o.x.id && o.x.taskId && o.x.audioId)
                .sort((a, b) => (b.x.date || 0) - (a.x.date || 0) || a.idx - b.idx).map(o => o.x);
            const legacy = all.filter(x => x && x.id).length - songs.length;
            const [selId, setSelId] = useState(() => { try { return localStorage.getItem('raven_dur_sel') || ''; } catch (e) { return ''; } });
            const [cache, setCache] = useState(loadTsCache);
            const [busy, setBusy] = useState(false);
            const [log, setLog] = useState([]);
            const [err, setErr] = useState('');
            const [view, setView] = useState('lirik');
            const [pickOpen, setPickOpen] = useState(false);
            const [t, setT] = useState(-1);
            const audioRef = useRef(null);
            const lyricRef = useRef(null);
            const rafRef = useRef(0);
            const [openF, setOpenF] = useState(() => new Set());
            const [selMode, setSelMode] = useState(false);
            const [selIds, setSelIds] = useState(() => new Set());
            const [bulkBusy, setBulkBusy] = useState(false);
            const [dlBusy, setDlBusy] = useState('');

            const select = (id) => {
                setSelId(id); setErr(''); setLog([]); setPickOpen(false); setT(-1);
                try { localStorage.setItem('raven_dur_sel', id); } catch (e) {}
                if (audioRef.current) audioRef.current.pause();
            };
            const newest = songs[0] ? songs[0].id : '';
            useEffect(() => {
                if (!newest) return;
                let seen = '';
                try { seen = localStorage.getItem('raven_dur_seen') || ''; } catch (e) {}
                if (newest !== seen) { try { localStorage.setItem('raven_dur_seen', newest); } catch (e) {} select(newest); }
                else if (!songs.some(s => s.id === selId)) select(newest);
            }, [newest, songs.length]);
            useEffect(() => { if (!active && audioRef.current) audioRef.current.pause(); }, [active]);
            useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

            const song = songs.find(s => s.id === selId) || null;
            const entry = song ? cache[song.id] : null;
            const data = React.useMemo(() => entry ? tsReadView(entry.words) : null, [entry]);
            const vNo = song ? songVariant(song, all) : 0;
            const songName = (s) => (s.title || 'Tanpa judul');

            // folder per judul + pemilihan banyak lagu
            const folders = groupSongsByTitle(songs);
            const curFolder = song ? songFolderKey(song) : '';
            useEffect(() => { if (curFolder) setOpenF(o => o.has(curFolder) ? o : new Set([...o, curFolder])); }, [curFolder, selId]);
            useEffect(() => { setSelIds(p => { const ids = new Set(songs.map(x => x.id)); const n = new Set([...p].filter(id => ids.has(id))); return n.size === p.size ? p : n; }); }, [songs.length]);
            const toggleF = (k) => setOpenF(o => { const n = new Set(o); if (n.has(k)) n.delete(k); else n.add(k); return n; });
            const toggleSel = (id) => setSelIds(p => { const n = new Set(p); if (n.has(id)) n.delete(id); else n.add(id); return n; });
            const selFolder = (f) => setSelIds(p => { const n = new Set(p); const allOn = f.items.every(x => n.has(x.id)); f.items.forEach(x => { if (allOn) n.delete(x.id); else n.add(x.id); }); return n; });
            const selAll = () => setSelIds(p => p.size === songs.length ? new Set() : new Set(songs.map(x => x.id)));
            const exitSel = () => { setSelMode(false); setSelIds(new Set()); };
            const dlOne = async (s) => { if (dlBusy || !s || !s.url) return; setDlBusy(s.id); try { await downloadSongFile(s, all); } finally { setDlBusy(''); } };
            const bulkDownload = async () => {
                if (bulkBusy || !selIds.size) return;
                setBulkBusy(true);
                try { await downloadSongsBulk(songs.filter(x => selIds.has(x.id)), all); } finally { setBulkBusy(false); }
            };
            const bulkDelete = () => {
                if (bulkBusy || !selIds.size) return;
                if (!window.confirm(`Hapus ${selIds.size} lagu terpilih dari Library?`)) return;
                const ids = new Set(selIds);
                if (song && ids.has(song.id) && audioRef.current) audioRef.current.pause();
                setLib(l => ({ ...l, covers: l.covers.filter(x => !ids.has(x.id)) }));
                showToast(`${ids.size} lagu dihapus.`, 'success');
                exitSel();
            };

            // posisi putar -> baris & kata yang sedang dinyanyikan
            const tick = () => { const a = audioRef.current; if (a) setT(a.currentTime); rafRef.current = requestAnimationFrame(tick); };
            const onPlay = () => { cancelAnimationFrame(rafRef.current); rafRef.current = requestAnimationFrame(tick); };
            const onPause = () => { cancelAnimationFrame(rafRef.current); const a = audioRef.current; if (a) setT(a.currentTime); };
            let curLine = -1;
            if (data && t >= 0) data.lines.forEach((l, i) => { if (l.start != null && l.start <= t + 0.05) curLine = i; });
            useEffect(() => {
                if (curLine < 0 || !lyricRef.current || view !== 'lirik') return;
                const el = lyricRef.current.querySelector(`[data-line="${curLine}"]`);
                if (el && audioRef.current && !audioRef.current.paused) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }, [curLine]);
            const seek = (s) => {
                const a = audioRef.current;
                if (!a || s == null) return;
                a.currentTime = Math.max(0, s - 0.05);
                setT(a.currentTime);
                a.play().catch(() => {});
            };

            const getData = async () => {
                if (!song || busy) return;
                ravenApi.start('ts'); let apiOk = false;
                setBusy(true); setErr(''); setLog([`Meminta lirik & timestamp · task ${song.taskId} · audio ${song.audioId}`]);
                try {
                    const a = await fetchTimestamps(song, (m) => setLog(l => [...l, m]));
                    saveTsEntry(song.id, { fetchedAt: Date.now(), cer: a.cer ?? null, words: a.words });
                    setCache(loadTsCache());
                    setLog(l => [...l, `Diterima: ${a.words.length} token kata.`]);
                    showToast(a.words.length ? `Timestamp diterima: ${a.words.length} kata.` : 'Data diterima, tetapi tanpa lirik.', 'success');
                    apiOk = true;
                } catch (e) {
                    if (e.noKey) { openRavenApi(); setErr('API key Kie belum diisi. Tambahkan melalui menu Kunci API.'); }
                    else setErr(`Gagal mengambil data dari Kie: ${e.name === 'AbortError' ? 'timeout' : e.message}. Data lagu di Kie umumnya hanya tersimpan sekitar 14 hari.`);
                } finally { setBusy(false); ravenApi.end('ts', apiOk); }
            };

            const exportPayload = () => ({
                app: 'Raven Studio', type: 'timestamped-lyrics', exportedAt: new Date().toISOString(),
                song: { title: song.title || '', variant: vNo || null, kind: song.kind || 'cover', duration: song.duration || null, taskId: song.taskId, audioId: song.audioId, url: song.url || '' },
                fetchedAt: entry ? new Date(entry.fetchedAt).toISOString() : null, hootCer: entry ? entry.cer : null,
                alignedWords: entry ? entry.words : []
            });
            const downloadJson = () => {
                const name = `${String((song.title || 'Lagu') + (vNo ? ` - Versi ${vNo}` : '')).replace(/[\\/:*?"<>|]+/g, ' ').trim()} - timestamp.json`;
                const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
                const u = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(u), 30000);
                showToast('Mengunduh: ' + name, 'success');
            };
            const copyJson = async () => {
                try { await navigator.clipboard.writeText(JSON.stringify(exportPayload(), null, 2)); showToast('Data JSON disalin.', 'success'); }
                catch (e) { showToast('Gagal menyalin. Gunakan tombol Unduh.', 'error'); }
            };

            const fmtDate = (ms) => { try { return ms ? new Date(ms).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; } catch (e) { return ''; } };
            const VBadge = VerTag;

            if (!songs.length) {
                return (
                    <div className="flex-1 min-h-0 overflow-y-auto hide-scroll p-4 sm:p-8 flex items-center justify-center">
                        <div className="glass-panel rounded-2xl p-8 max-w-md w-full text-center flex flex-col items-center gap-4 shadow-xl">
                            <div className="w-14 h-14 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xl text-zinc-300"><i className="fa-solid fa-wave-square"></i></div>
                            <div>
                                <h2 className="text-base font-bold text-white mb-1.5">Belum ada lagu dari Musiclabs</h2>
                                <p className="text-xs text-zinc-400 leading-relaxed">Buat lagu melalui Lagu Baru atau Cover. Setiap hasil akan otomatis tersimpan di sini beserta label Versi 1 / Versi 2.</p>
                                {legacy > 0 && <p className="text-[11px] text-zinc-500 leading-relaxed mt-3">{legacy} lagu lama di Library dibuat sebelum pembaruan sehingga tidak memiliki ID dari Kie dan tidak dapat digunakan.</p>}
                            </div>
                            <button onClick={onGoMusic} className="h-11 px-5 rounded-xl bg-white text-black text-xs font-bold uppercase tracking-wider hover:bg-zinc-200 transition-colors">Buka Musiclabs</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 min-h-0 overflow-y-auto lg:overflow-hidden hide-scroll">
                    <div className="max-w-6xl mx-auto w-full p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-4 lg:gap-6 lg:h-full">
                        {/* Daftar lagu: folder per judul, berisi Versi 1 / Versi 2 */}
                        <aside className="lg:w-80 shrink-0 glass-panel rounded-2xl p-4 flex flex-col gap-3 lg:min-h-0 shadow-xl">
                            <div className="flex items-center justify-between gap-3">
                                <h2 className="text-sm font-bold text-white flex items-center gap-2.5">
                                    <span className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center"><i className="fa-solid fa-music text-zinc-300 text-[11px]"></i></span>
                                    Lagu Musiclabs
                                </h2>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] font-mono text-zinc-500">{songs.length}</span>
                                    {!selMode && <button onClick={() => { setSelMode(true); setPickOpen(true); }} className="h-9 sm:h-7 px-3 sm:px-2.5 glass-btn rounded-md text-[10px] font-semibold uppercase tracking-wider text-zinc-300 flex items-center gap-1.5"><i className="fa-regular fa-square-check"></i>Pilih</button>}
                                </div>
                            </div>
                            {selMode && <SelectBar compact count={selIds.size} total={songs.length} busy={bulkBusy} onAll={selAll} onDownload={bulkDownload} onDelete={bulkDelete} onCancel={exitSel} />}
                            {song && (
                                <button onClick={() => setPickOpen(true)} className={`${pickOpen ? 'hidden' : 'flex lg:hidden'} w-full text-left items-center gap-3 p-2.5 rounded-xl border bg-white/10 border-white/30`}>
                                    <SongArt src={song.image} title={song.title} size={44} radius={10} />
                                    <div className="min-w-0 flex-1 flex items-center gap-2">
                                        <span className="text-xs font-semibold text-white truncate">{songName(song)}</span>
                                        <VBadge n={vNo} />
                                    </div>
                                    {songs.length > 1 && <i className="fa-solid fa-chevron-down text-[10px] text-zinc-500 shrink-0"></i>}
                                </button>
                            )}
                            <div className={`${pickOpen ? 'flex' : 'hidden lg:flex'} flex-col gap-2 lg:overflow-y-auto hide-scroll lg:min-h-0 lg:-mx-1 lg:px-1`}>
                                {folders.map(f => {
                                    const open = openF.has(f.key);
                                    const cover = (f.items.find(x => x.image) || {}).image;
                                    const nSel = f.items.filter(x => selIds.has(x.id)).length;
                                    const hasCur = f.items.some(x => x.id === selId);
                                    return (
                                        <div key={f.key} className={`rounded-xl border transition-colors ${hasCur && !selMode ? 'bg-white/[0.04] border-white/20' : 'glass-inner border-white/5'}`}>
                                            <div role="button" tabIndex={0} aria-expanded={open} onClick={() => toggleF(f.key)} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleF(f.key); } }} className="flex items-center gap-3 p-2.5 cursor-pointer select-none">
                                                {selMode && <SelBox on={nSel === f.items.length} part={nSel > 0 && nSel < f.items.length} onClick={(e) => { e.stopPropagation(); selFolder(f); }} />}
                                                <SongArt src={cover} title={f.title} size={44} radius={10} />
                                                <div className="min-w-0 flex-1">
                                                    <div className="text-xs font-semibold text-white truncate">{f.title}</div>
                                                    <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-wider truncate mt-1"><i className="fa-regular fa-folder mr-1.5"></i>{f.items.length} versi</div>
                                                </div>
                                                <i className={`fa-solid fa-chevron-down text-[10px] text-zinc-500 shrink-0 transition-transform ${open ? 'rotate-180' : ''}`}></i>
                                            </div>
                                            {open && (
                                                <div className="flex flex-col gap-1 px-2 pb-2">
                                                    {f.items.map(s => {
                                                        const sel = s.id === selId;
                                                        const v = songVariant(s, all);
                                                        const got = !!cache[s.id];
                                                        const chk = selIds.has(s.id);
                                                        return (
                                                            <button key={s.id} onClick={() => selMode ? toggleSel(s.id) : select(s.id)}
                                                                className={`w-full text-left flex items-center gap-2.5 px-2 py-1.5 rounded-lg border transition-colors ${(sel && !selMode) || chk ? 'bg-white/10 border-white/25' : 'border-transparent hover:bg-white/5'}`}>
                                                                {selMode && <SelBox on={chk} />}
                                                                <SongArt src={s.image} title={s.title} size={32} radius={8} />
                                                                <VerTag n={v || 1} />
                                                                <span className="text-[10px] font-mono text-zinc-500 truncate flex-1 min-w-0">{fmtDate(s.date)}</span>
                                                                {got ? <i className="fa-solid fa-circle-check text-green-400 text-xs shrink-0" title="Timestamp sudah diterima"></i> : null}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            {songs.length > 1 && !selMode && <button onClick={() => setPickOpen(o => !o)} className="lg:hidden h-9 glass-btn rounded-lg text-[10px] font-semibold uppercase tracking-wider text-zinc-400">{pickOpen ? 'Tutup daftar' : `Pilih lagu lain (${songs.length - 1})`}</button>}
                            {legacy > 0 && <p className="text-[10px] leading-relaxed text-zinc-600">{legacy} lagu lama tidak ditampilkan karena dibuat sebelum pembaruan (tidak memiliki ID dari Kie).</p>}
                        </aside>

                        {/* Detail lagu terpilih */}
                        {song && (
                            <section className="flex-1 min-w-0 flex flex-col gap-4 lg:min-h-0 lg:overflow-y-auto hide-scroll pb-4">
                                <div className="glass-panel rounded-2xl p-4 sm:p-5 flex flex-col gap-4 shadow-xl">
                                    <div className="flex items-center gap-4">
                                        <SongArt src={song.image} title={song.title} size={72} radius={14} />
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center gap-2 min-w-0 flex-wrap">
                                                <h2 className="text-base sm:text-lg font-bold text-white truncate max-w-full">{songName(song)}</h2>
                                                <VBadge n={vNo} big />
                                            </div>
                                            <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-wider mt-1.5">{[SONG_KIND_LABEL[song.kind || 'cover'], song.duration ? formatTime(song.duration) : '', fmtDate(song.date)].filter(Boolean).join(' · ')}</div>
                                            {song.style ? <div className="text-[11px] text-zinc-400 mt-1.5 line-clamp-1">{song.style}</div> : null}
                                        </div>
                                    </div>
                                    {song.url ? <SongPlayer key={song.id} src={song.url} audioRef={audioRef} knownDuration={song.duration} onPlay={onPlay} onPause={onPause} onEnded={onPause} onSeeked={() => { const a = audioRef.current; if (a) setT(a.currentTime); }} onDownload={() => dlOne(song)} dlBusy={dlBusy === song.id} />
                                        : <div className="text-[11px] text-zinc-500">Audio lagu tidak tersedia.</div>}
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <button onClick={getData} disabled={busy} className="w-full sm:flex-1 h-12 shrink-0 rounded-xl bg-white text-black text-xs font-bold uppercase tracking-widest hover:bg-zinc-200 disabled:opacity-60 transition-colors flex items-center justify-center gap-2.5">
                                            {busy ? <><i className="fa-solid fa-spinner fa-spin"></i> Mengambil data…</> : <><i className={`fa-solid ${entry ? 'fa-rotate' : 'fa-download'}`}></i> {entry ? 'Ambil ulang timestamp' : 'Ambil lirik & timestamp'}</>}
                                        </button>
                                        {entry && (
                                            <div className="flex gap-2 shrink-0">
                                                <button onClick={downloadJson} className="flex-1 sm:flex-none h-12 px-4 glass-btn rounded-xl text-[10px] font-semibold uppercase tracking-wider text-zinc-300 flex items-center justify-center gap-2"><i className="fa-solid fa-file-arrow-down"></i> Unduh JSON</button>
                                                <button onClick={copyJson} aria-label="Salin JSON" className="h-12 w-12 glass-btn rounded-xl text-zinc-300 flex items-center justify-center"><i className="fa-regular fa-copy"></i></button>
                                            </div>
                                        )}
                                    </div>
                                    {entry && <div className="text-[10px] font-mono text-zinc-500">Diterima {fmtDate(entry.fetchedAt)} · tersimpan di perangkat ini</div>}
                                    {err && <div className="rounded-xl border border-red-500/30 bg-red-500/10 p-3 text-[11px] leading-relaxed text-red-300"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{err}</div>}
                                    {log.length > 0 && (busy || err) && <div className="glass-inner rounded-xl p-3 text-[10px] font-mono text-zinc-500 leading-relaxed break-words">{log.map((l, i) => <div key={i}>{l}</div>)}</div>}
                                </div>

                                {data && (
                                    <div className="glass-panel rounded-2xl p-4 sm:p-5 flex flex-col gap-4 shadow-xl lg:min-h-[420px]">
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                            {[['Kata', data.stats.words], ['Baris', data.stats.lines], ['Tersinkron', data.stats.okPct + '%'], ['Vokal', data.stats.first != null ? `${fmtTs(data.stats.first)} – ${fmtTs(data.stats.last)}` : '—']].map(([k, v]) => (
                                                <div key={k} className="glass-inner rounded-xl px-3 py-2.5">
                                                    <div className="text-[10px] font-semibold uppercase tracking-widest text-zinc-500">{k}</div>
                                                    <div className="text-sm font-mono font-semibold text-white mt-0.5 truncate">{v}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex items-center justify-between gap-3 flex-wrap">
                                            <div className="flex gap-1.5 p-1 bg-black/40 rounded-lg border border-white/5">
                                                {[['lirik', 'Lirik'], ['data', 'Data mentah']].map(([id, l]) => (
                                                    <button key={id} onClick={() => setView(id)} className={`px-4 py-2.5 sm:py-1.5 text-xs font-semibold rounded-md transition-all ${view === id ? 'bg-white text-black shadow-md' : 'text-zinc-400 hover:text-white hover:bg-white/5'}`}>{l}</button>
                                                ))}
                                            </div>
                                            <span className="hidden sm:flex text-[10px] text-zinc-500 items-center gap-1.5"><i className="fa-solid fa-scissors text-[9px]"></i> Pemecahan scene: segera hadir</span>
                                        </div>

                                        {data.toks.length === 0 && <div className="glass-inner rounded-xl p-6 text-center text-xs text-zinc-500">Kie tidak mengembalikan lirik untuk lagu ini (kemungkinan instrumental atau tanpa vokal).</div>}

                                        {data.toks.length > 0 && view === 'lirik' && (
                                            <div ref={lyricRef} className="flex flex-col gap-1">
                                                <p className="text-[10px] text-zinc-600 mb-1">Ketuk baris untuk memutar dari titik tersebut.</p>
                                                {(() => { let li = -1; return data.items.map((it, k) => {
                                                    if (it.type === 'section') return <div key={k} className="pt-3 pb-1 text-[10px] font-bold uppercase tracking-[0.18em] text-zinc-500">{it.label}</div>;
                                                    li++; const idx = li; const on = idx === curLine;
                                                    return (
                                                        <button key={k} data-line={idx} onClick={() => seek(it.start)} className={`w-full text-left flex items-start gap-3 px-3 py-2.5 rounded-xl border transition-colors ${on ? 'bg-white/10 border-white/25' : 'border-transparent hover:bg-white/5'}`}>
                                                            <span className={`shrink-0 mt-0.5 text-[10px] font-mono ${on ? 'text-white' : 'text-zinc-500'}`}>{fmtTs(it.start)}</span>
                                                            <span className="text-sm leading-relaxed whitespace-pre-wrap break-words min-w-0">
                                                                {it.toks.map((w, j) => {
                                                                    const sung = on && w.ok && w.start <= t;
                                                                    return <span key={j} className={!w.ok ? 'text-zinc-500 underline decoration-dotted decoration-zinc-600' : (sung ? 'text-white' : (on ? 'text-zinc-400' : 'text-zinc-300'))}>{w.text}</span>;
                                                                })}
                                                            </span>
                                                        </button>
                                                    );
                                                }); })()}
                                                {data.toks.some(w => !w.ok) && <p className="text-[10px] text-zinc-600 mt-2">Kata bergaris titik-titik: Kie tidak berhasil menentukan waktunya. Data ditampilkan sesuai aslinya.</p>}
                                            </div>
                                        )}

                                        {data.toks.length > 0 && view === 'data' && (
                                            <div className="glass-inner rounded-xl overflow-hidden">
                                                <div className="grid grid-cols-[2.5rem_1fr_4.5rem_4.5rem_1.5rem] gap-2 px-3 py-2 border-b border-white/5 text-[9px] font-semibold uppercase tracking-widest text-zinc-500">
                                                    <span>#</span><span>Token</span><span>Mulai</span><span>Selesai</span><span></span>
                                                </div>
                                                <div className="max-h-[60dvh] overflow-y-auto hide-scroll">
                                                    {data.toks.map(w => (
                                                        <div key={w.i} onClick={() => w.ok && seek(w.start)} className={`grid grid-cols-[2.5rem_1fr_4.5rem_4.5rem_1.5rem] gap-2 px-3 py-1.5 text-[11px] font-mono border-b border-white/[0.03] ${w.ok ? 'cursor-pointer hover:bg-white/5' : ''} ${w.ok && w.start <= t && t < w.end ? 'bg-white/10 text-white' : 'text-zinc-300'}`}>
                                                            <span className="text-zinc-600">{w.i + 1}</span>
                                                            <span className="truncate">{w.text.replace(/\n/g, '↵')}</span>
                                                            <span>{fmtTs(w.start)}</span>
                                                            <span>{fmtTs(w.end)}</span>
                                                            <span>{w.ok ? <i className="fa-solid fa-check text-green-400 text-[9px]"></i> : <i className="fa-solid fa-xmark text-red-400 text-[9px]"></i>}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {!data && !busy && !err && (
                                    <div className="glass-panel rounded-2xl p-6 text-center text-xs text-zinc-500 leading-relaxed shadow-xl">
                                        Tekan <span className="text-zinc-300 font-semibold">Ambil lirik &amp; timestamp</span> untuk menerima lirik beserta waktu tiap kata dari Kie. Data disimpan di perangkat ini dan nanti dipakai untuk pemecahan scene.
                                    </div>
                                )}
                            </section>
                        )}
                    </div>
                </div>
            );
        }

        // =====================================================================================
        // VISUAL · LOOP VIDEO
        // Satu klip AI (±10 detik) disambung berulang tanpa jahitan sepanjang satu lagu atau
        // rangkaian hingga 30 lagu. Engine: cari titik sambung paling mirip -> render SATU putaran
        // (crossfade halus atau bolak-balik) -> putaran itu diulang di level paket encoder,
        // sehingga hasil panjang tetap cepat dan setiap sambungan identik.
        // Engine 3: frame-exact + fps asli, frame blending, optical-flow morph di sambungan, pre-roll encoder.
        // =====================================================================================
        const LP_SCHEMA = 'raven-loop/1';
        const LP_MB_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.62.1/dist/bundles/mediabunny.min.mjs';
        const LP_MAX_SONGS = 30;
        const LP_SONG_XF = 1.5;     // detik: tumpang tindih halus saat pergantian lagu (tanpa jeda)
        const LP_REC_SEC = 10;      // durasi klip yang disarankan (batas generator video AI)
        const LP_MAX_SEC = 20;      // klip terpanjang yang diterima
        const LP_MIN_SEC = 2;
        const LP_ANA_FPS = 30;      // batas frame analisis per detik (mengikuti frame rate klip, maks ini)
        const LP_ENGINE = 4;        // versi engine sambungan; naik = loop & analisis lama dibuat ulang
        const LP_WARM_SEC = 1.0;    // detik pre-roll encoder (dibuang) agar kualitas awal putaran = akhir putaran
        const LP_GL_MAX_MS = 120;   // batas waktu morph WebGL per frame; lebih lambat = tanpa GPU → pakai geser kamera 2D
        const LP_ANA_W = 64;        // lebar frame analisis (px)
        const LP_FPS_OPT = [24, 25, 30, 50, 60];
        const LP_Q_BPP = { std: 0.07, high: 0.12 };
        const LP_AUDIO_BR = 192000;
        const LP_PRESETS = {
            default: { label: 'Default', xf: 1.2, d: 'Pengaturan standar. Sambungan cukup halus untuk sebagian besar video.' },
            medium: { label: 'Medium', xf: 2.0, d: 'Sambungan lebih tersamar. Gunakan jika sambungan pada preset Default masih terlihat.' },
            high: { label: 'High', xf: 3.0, d: 'Sambungan paling tersamar, namun gerakan dapat tampak sedikit berlapis.' }
        };
        const LP_DEF = { xf: 1.2, pre: 'default', preUser: false, preAuto: false, curve: 'smooth', auto: true, S: 0, E: 0, res: '1080', fps: 0, q: 'high', audio: true, gap: 0, disk: null };   // fps 0 = ikut frame rate klip (paling mulus)
        // Sesuaikan pengaturan lama yang tersimpan di perangkat dengan pilihan yang kini tersedia
        function lpNormSet(s) {
            const x = { ...LP_DEF, ...s };
            const xf = Number(x.xf) || 1.2;
            x.pre = xf < 1.6 ? 'default' : xf < 2.5 ? 'medium' : 'high';
            x.xf = LP_PRESETS[x.pre].xf;
            x.curve = 'smooth'; x.auto = true; x.S = 0; x.E = 0;
            x.res = x.res === '720' ? '720' : '1080';
            x.fps = x.fps === 60 ? 60 : (x.fps === 30 && x.fpsUser) ? 30 : 0;   // default lama 30 → ikut klip
            x.q = 'high'; x.disk = null; x.gap = 0; x.preUser = !!x.preUser; x.preAuto = !!x.preAuto && !x.preUser;
            return x;
        }

        // ===== VISUAL · utilitas =====
        const lpUid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const lpCx = (...a) => a.filter(Boolean).join(' ');
        const lpClamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const lpEven = (v) => Math.max(2, Math.round(v / 2) * 2);
        const lpT = (sec) => { const v = Math.max(0, Math.round(sec || 0)), h = Math.floor(v / 3600), m = Math.floor((v % 3600) / 60), s = v % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
        const lpSec = (sec, d = 2) => (Number(sec) || 0).toFixed(d).replace('.', ',') + ' dtk';
        const lpBytes = (b) => b >= 1e9 ? (b / 1e9).toFixed(2).replace('.', ',') + ' GB' : (b / 1e6).toFixed(b >= 1e8 ? 0 : 1).replace('.', ',') + ' MB';
        const lpSafeName = (s) => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 90) || 'Visual';
        const lpCancelled = () => Object.assign(new Error('Dibatalkan'), { cancelled: true });
        const lpCheck = (signal) => { if (signal && signal.aborted) throw lpCancelled(); };
        const lpYield = () => new Promise(r => setTimeout(r, 0));
        const lpNearFps = (f) => LP_FPS_OPT.reduce((b, x) => Math.abs(x - f) < Math.abs(b - f) ? x : b, 30);
        const lpBitrate = (w, h, fps, q) => Math.round(lpClamp(w * h * fps * (LP_Q_BPP[q] || LP_Q_BPP.std), 1.2e6, 30e6));
        function lpOutSize(info, res) {
            const short = Math.min(info.w, info.h);
            const sc = res === 'src' ? 1 : Number(res) / short;
            let w = info.w * sc, h = info.h * sc;
            const big = Math.max(w, h); if (big > 3840) { w *= 3840 / big; h *= 3840 / big; }
            return { w: lpEven(w), h: lpEven(h) };
        }
        function lpDownload(blob, name) {
            const u = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = u; a.download = name; a.style.display = 'none';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(u), 120000);
        }
        async function lpWakeLock() { try { return navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch (e) { return null; } }

        // ===== VISUAL · penyimpanan (IndexedDB raven_loop) =====
        // kv: state (proyek), clip (video sumber), ana (hasil analisis), loop (satu putaran ter-render), song_<id> (audio).
        let lpDbP = null;
        const lpMem = new Map();   // cadangan bila IndexedDB tidak tersedia / penuh
        function lpDb() {
            if (lpDbP) return lpDbP;
            lpDbP = new Promise((res, rej) => {
                let r; try { r = indexedDB.open('raven_loop', 1); } catch (e) { lpDbP = null; rej(e); return; }
                r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
                r.onsuccess = () => res(r.result);
                r.onerror = () => { lpDbP = null; rej(r.error); };
            });
            return lpDbP;
        }
        async function lpTx(mode, fn) {
            const d = await lpDb();
            return new Promise((res, rej) => {
                const tx = d.transaction('kv', mode), q = fn(tx.objectStore('kv'));
                tx.oncomplete = () => res(q ? q.result : undefined);
                tx.onerror = () => rej(tx.error);
                tx.onabort = () => rej(tx.error || new Error('Transaksi dibatalkan'));
            });
        }
        async function lpGet(k) { if (lpMem.has(k)) return lpMem.get(k); try { return await lpTx('readonly', s => s.get(k)); } catch (e) { return undefined; } }
        async function lpPut(k, v) { try { await lpTx('readwrite', s => s.put(v, k)); lpMem.delete(k); } catch (e) { lpMem.set(k, v); } }
        async function lpDel(k) { lpMem.delete(k); try { await lpTx('readwrite', s => s.delete(k)); } catch (e) {} }
        // Bersihkan penyimpanan engine Visual lama (ruang speaker) satu kali.
        (function lpPurgeOldVisual() {
            try {
                if (localStorage.getItem('raven_viz_purged') === '1') return;
                if (window.indexedDB) indexedDB.deleteDatabase('raven_viz');
                localStorage.removeItem('raven_viz_last');
                localStorage.setItem('raven_viz_purged', '1');
            } catch (e) {}
        })();

        // ===== VISUAL · media (Mediabunny + WebCodecs) =====
        let lpMbP = null;
        function lpLoadMb() {
            if (!lpMbP) { lpMbP = new Function('u', 'return import(u)')(LP_MB_URL); lpMbP.catch(() => { lpMbP = null; }); }
            return lpMbP;
        }
        async function lpOpen(blob) {
            const mb = await lpLoadMb();
            const input = new mb.Input({ source: new mb.BlobSource(blob), formats: mb.ALL_FORMATS });
            const vt = await input.getPrimaryVideoTrack();
            return { mb, input, vt };
        }
        const lpClose = (input) => { try { if (input && typeof input.dispose === 'function') input.dispose(); } catch (e) {} };
        const lpEndIt = (it) => { try { if (it && it.return) Promise.resolve(it.return()).catch(() => {}); } catch (e) {} };
        async function lpCaps(w, h, fps) {
            const caps = { ok: false, video: '', container: '', audio: '', err: '' };
            if (typeof window.VideoEncoder !== 'function' || typeof window.VideoDecoder !== 'function') { caps.err = 'Browser ini belum mendukung WebCodecs. Gunakan Chrome atau Edge versi terbaru (desktop atau Android).'; return caps; }
            try {
                const mb = await lpLoadMb(), br = lpBitrate(w, h, fps, 'high');
                if (await mb.canEncodeVideo('avc', { width: w, height: h, bitrate: br })) { caps.video = 'avc'; caps.container = 'mp4'; }
                else if (await mb.canEncodeVideo('vp9', { width: w, height: h, bitrate: br })) { caps.video = 'vp9'; caps.container = 'webm'; }
                if (typeof window.AudioEncoder === 'function') {
                    const ac = { numberOfChannels: 2, sampleRate: 48000, bitrate: LP_AUDIO_BR };
                    if (caps.container === 'mp4' && await mb.canEncodeAudio('aac', ac)) caps.audio = 'aac';
                    else if (await mb.canEncodeAudio('opus', ac)) caps.audio = 'opus';
                }
                caps.ok = !!caps.video;
                if (!caps.ok) caps.err = `Browser ini tidak dapat membuat video ${w}×${h}. Gunakan resolusi yang lebih kecil.`;
            } catch (e) { caps.err = 'Pustaka video gagal dimuat: ' + e.message; }
            return caps;
        }
        // Baca info klip sumber
        async function lpProbe(blob) {
            let o;
            try { o = await lpOpen(blob); } catch (e) { throw new Error('File tidak dapat dibaca sebagai video (' + e.message + ').'); }
            const { input, vt } = o;
            try {
                if (!vt) throw new Error('File ini tidak berisi trek video.');
                if (!(await vt.canDecode())) throw new Error(`Codec video "${vt.codec || 'tidak dikenal'}" tidak dapat dibaca oleh browser ini. Konversikan ke MP4 (H.264), lalu unggah ulang.`);
                const t0 = await vt.getFirstTimestamp(), t1 = await vt.computeDuration();
                let fps = 30;
                try { const st = await vt.computePacketStats(240); if (st && st.averagePacketRate > 1) fps = st.averagePacketRate; } catch (e) {}
                return { w: vt.displayWidth, h: vt.displayHeight, t0, dur: Math.max(0, t1 - t0), fps: Math.round(fps * 100) / 100, codec: vt.codec || '' };
            } finally { lpClose(input); }
        }

        // ===== VISUAL · tabel waktu frame (frame-exact) =====
        // Timestamp presentasi ASLI tiap frame dibaca dari paket (tanpa decode). Frame selalu diminta di
        // TENGAH durasinya, bukan tepat di batas frame: pembulatan floating-point di batas frame dulu membuat
        // decoder kadang mengembalikan frame sebelumnya (frame dobel) lalu melompati frame berikutnya.
        async function lpFrameTimes(mb, vt, info) {
            let ts = [], it = null;
            try {
                it = new mb.EncodedPacketSink(vt).packets(undefined, undefined, { metadataOnly: true })[Symbol.asyncIterator]();
                for (;;) { const r = await it.next(); if (r.done) break; ts.push(r.value.timestamp); }
            } catch (e) { ts = []; } finally { lpEndIt(it); }
            ts.sort((a, b) => a - b);
            const u = []; for (const t of ts) if (!u.length || t - u[u.length - 1] > 1e-5) u.push(t);
            if (u.length < 2) { u.length = 0; const n0 = Math.max(2, Math.round(info.dur * info.fps)); for (let i = 0; i < n0; i++) u.push(info.t0 + i / info.fps); }
            const n = u.length, fd = (u[n - 1] - u[0]) / (n - 1), end = info.t0 + info.dur;
            const mid = (i) => { i = lpClamp(Math.round(i), 0, n - 1); const nx = i + 1 < n ? u[i + 1] : Math.min(end, u[i] + fd); return u[i] + Math.max(1e-4, (nx - u[i]) * 0.5); };
            return { n, t: u, fd, fps: 1 / fd, mid };
        }

        // ===== VISUAL · analisis titik sambung =====
        // Klip diperkecil ke 64 px dan dibaca pada frame rate aslinya. Selisih antar frame DIBOBOTI peta gerak:
        // yang menentukan kecocokan adalah piksel yang bergerak. Latar statis (selalu mirip) tidak lagi
        // menutupi pose subjek yang sebenarnya berbeda di titik sambung.
        // Engine 3: frame diambil frame-exact (tengah frame) dan disimpan juga versi 128 px (Y2) untuk
        // estimasi optical flow di titik sambung.
        async function lpAnalyze(blob, info, signal, onProg) {
            const { mb, input, vt } = await lpOpen(blob);
            let it = null;
            try {
                const ft = await lpFrameTimes(mb, vt, info);
                const aw = LP_ANA_W, ah = Math.max(8, Math.round(aw * info.h / info.w)), P = aw * ah;
                const aw2 = aw * 2, ah2 = ah * 2, P2 = aw2 * ah2;
                const sink = new mb.CanvasSink(vt, { width: aw2, height: ah2, fit: 'fill', poolSize: 2 });
                const af = info.fps > LP_ANA_FPS + 0.5 ? info.fps / Math.ceil(info.fps / LP_ANA_FPS) : Math.max(8, info.fps);
                const sF = ft.fps, src = (i) => Math.round(i * sF / af);
                let n = Math.max(4, Math.floor(info.dur * af + 1e-6));
                while (n > 4 && src(n - 1) > ft.n - 1) n--;
                const ts = []; for (let i = 0; i < n; i++) ts.push(ft.mid(src(i)));
                it = sink.canvasesAtTimestamps(ts)[Symbol.asyncIterator]();
                const fr = [], fr2 = []; let prev = null, prev2 = null;
                for (let i = 0; i < n; i++) {
                    lpCheck(signal);
                    const r = await it.next(); if (r.done) break;
                    let y = prev, y2 = prev2;
                    if (r.value && r.value.canvas) {
                        const d = r.value.canvas.getContext('2d').getImageData(0, 0, aw2, ah2).data;
                        y2 = new Uint8Array(P2);
                        for (let k = 0, q = 0; k < P2; k++, q += 4) y2[k] = (d[q] * 77 + d[q + 1] * 150 + d[q + 2] * 29) >> 8;
                        y = new Uint8Array(P);   // versi 64 px = rata-rata 2x2 dari versi 128 px
                        for (let yy = 0; yy < ah; yy++) for (let xx = 0; xx < aw; xx++) {
                            const o = (yy * 2) * aw2 + xx * 2;
                            y[yy * aw + xx] = (y2[o] + y2[o + 1] + y2[o + aw2] + y2[o + aw2 + 1] + 2) >> 2;
                        }
                    }
                    if (!y) { y = new Uint8Array(P); y2 = new Uint8Array(P2); }
                    fr.push(y); fr2.push(y2); prev = y; prev2 = y2;
                    if (onProg && i % 8 === 0) onProg(0.4 * i / n);
                }
                const m = fr.length;
                if (m < 4) throw new Error('Video terlalu pendek untuk dianalisis.');
                // peta gerak: simpangan tiap piksel terhadap rata-ratanya sepanjang klip
                const mean = new Float32Array(P), dev = new Float32Array(P);
                for (const f of fr) for (let k = 0; k < P; k++) mean[k] += f[k];
                for (let k = 0; k < P; k++) mean[k] /= m;
