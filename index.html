    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        html, body {
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

            -webkit-appearance: none;

<body class="flex justify-center h-screen w-screen overflow-hidden text-zinc-300 bg-black viz-bg selection:bg-white/20 selection:text-white">

    <div id="root" class="w-full h-full relative flex flex-col overflow-hidden mx-auto max-w-[1600px] shadow-2xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Kie AI (GPT-6 Luna, format OpenAI Responses) ---
        const KIE_URL = 'https://api.kie.ai/codex/v1/responses'; 
        const KIE_TIMEOUT_MS = 180000; 
        const KIE_ATTEMPTS = [
            { model: 'gpt-6-luna', effort: 'low' },
            { model: 'gpt-6-luna', effort: 'low' }
        ];

        // --- Kie AI (Suno: Upload & Cover) ---
        const KIE_SUNO_URL = 'https://api.kie.ai/api/v1/generate/upload-cover';
        const KIE_SUNO_INFO = 'https://api.kie.ai/api/v1/generate/record-info';
        // Model Suno yang didukung Kie AI saat ini (docs.kie.ai: V6 / V6_WILD / V6_MINI).
        // V5.5 ke bawah ditandai Discontinued/deprecated di dokumentasi, jadi sengaja tidak ditampilkan.
        const SUNO_MODELS = [
            { id: 'V6', short: 'V6', name: 'V6', desc: 'Model standar (direkomendasikan)' },
            { id: 'V6_WILD', short: 'V6 Wild', name: 'V6 Wild', desc: 'Hasil lebih eksperimental dan kreatif' },
            { id: 'V6_MINI', short: 'V6 Mini', name: 'V6 Mini', desc: 'Versi ringan' }
        ];
        const SUNO_MODEL_DEFAULT = 'V6';
        const SUNO_MODEL_KEY = 'kie_suno_model';
        const loadSunoModel = () => {
            try { const m = localStorage.getItem(SUNO_MODEL_KEY); if (SUNO_MODELS.some(x => x.id === m)) return m; } catch (e) {}
            return SUNO_MODEL_DEFAULT;
        };
        const KIE_DEFAULT_CALLBACK = 'https://example.com/callback';
        const KIE_UPLOAD_ENDPOINTS = [
            { kind: 'stream', url: 'https://kieai.redpandaai.co/api/file-stream-upload' },
            { kind: 'base64', url: 'https://kieai.redpandaai.co/api/file-base64-upload' },
            { kind: 'base64', url: 'https://api.kie.ai/api/v1/file-base64-upload' }
        ];

        // REBRAND: Changed Suno stages to generic AI stages for UI display
        const PROCESS_STAGES = ['Render Audio ACD', 'Kompres Audio', 'Unggah ke Server', 'Kirim Tugas Pemrosesan', 'AI Memproses'];
        
        const STYLE_MAX = 1000;  
        const LYRICS_MAX = 5000; 
        const LIB_KEY = 'kie_library_v1';
        // Nomor versi hasil Kie (1 generate = biasanya 2 versi). Sama persis dengan label di Durasi.
        const songVariant = (it, all) => {
            if (!it) return 0;
            if (it.variant) return Number(it.variant) || 0;
            if (!it.taskId) return 0;
            const g = (all || []).filter(x => x && x.taskId === it.taskId);
            return g.length > 1 ? g.indexOf(it) + 1 : 0;
        };
        const loadLib = () => { try { const l = JSON.parse(localStorage.getItem(LIB_KEY)); if (l) return { uploads: l.uploads || [], covers: l.covers || [] }; } catch (e) {} return { uploads: [], covers: [] }; };
        const idb = (mode, fn) => new Promise((res, rej) => {
            try {
                const r = indexedDB.open('kie_cover_studio', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('audio');
                r.onerror = () => rej(r.error);
                r.onsuccess = () => { const tx = r.result.transaction('audio', mode); const q = fn(tx.objectStore('audio')); tx.oncomplete = () => res(q ? q.result : undefined); tx.onerror = () => rej(tx.error); };
            } catch (e) { rej(e); }
        });
        const idbPut = (id, blob) => idb('readwrite', st => st.put(blob, id));
        const idbGet = (id) => idb('readonly', st => st.get(id));
        const idbDel = (id) => idb('readwrite', st => st.delete(id));

        const cleanKey = (k) => String(k || '').replace(/^\s*Bearer\s+/i, '').replace(/\s+/g, '');

        // --- API terpusat Raven Studio (menu Input API di header) ---
        const RAVEN_KEYS = 'raven_keys';
        const RAVEN_MAX_KEYS = 5;
        try { localStorage.removeItem('groq_keys'); localStorage.removeItem('groq_apikey'); } catch (e) {}
        const loadRavenKeys = () => {
            let k = null;
            try { k = JSON.parse(localStorage.getItem(RAVEN_KEYS) || 'null'); } catch (e) { k = null; }
            if (!k || typeof k !== 'object') {
                k = { kie: [], kieActive: '', callback: '', sbMeta: {} };
                try {
                    const o = JSON.parse(localStorage.getItem('kie_app_keys') || 'null');
                    if (o) { k.kie = [o.kie, ...(Array.isArray(o.savedKeys) ? o.savedKeys : [])]; k.kieActive = o.kie || ''; k.callback = o.callback || ''; }
                } catch (e) {}
            }
            const list = [];
            (Array.isArray(k.kie) ? k.kie : []).forEach(x => { const c = cleanKey(x); if (c && !list.includes(c) && list.length < RAVEN_MAX_KEYS) list.push(c); });
            const act = cleanKey(k.kieActive);
            return { kie: list, kieActive: list.includes(act) ? act : (list[0] || ''), callback: String(k.callback || '').trim(), sbMeta: (k.sbMeta && typeof k.sbMeta === 'object') ? k.sbMeta : {} };
        };
        const saveRavenKeys = (k) => {
            try { localStorage.setItem(RAVEN_KEYS, JSON.stringify(k)); } catch (e) {}
            window.dispatchEvent(new Event('raven-keys'));
        };
        // pindahkan key dari versi lama (kie_app_keys) sekali saja
        try { if (!localStorage.getItem(RAVEN_KEYS) && localStorage.getItem('kie_app_keys')) localStorage.setItem(RAVEN_KEYS, JSON.stringify(loadRavenKeys())); } catch (e) {}
        // urutan pemakaian: key aktif dulu, lalu key cadangan
        const ravenKieList = () => { const k = loadRavenKeys(); return k.kie.length ? [k.kieActive, ...k.kie.filter(x => x !== k.kieActive)] : []; };
        const readCentralKeys = () => { const k = loadRavenKeys(); return { kie: k.kieActive, callback: k.callback, savedKeys: k.kie }; };
        const openRavenApi = () => window.dispatchEvent(new Event('raven-open-api'));
        // Aktivitas API global untuk indikator: start/end tiap proses; end(ok=true) memulihkan, end(ok=false) menandai gagal, null = dibatalkan.
        const ravenApi = (() => {
            const busy = new Map(); let fail = false;
            const emit = () => window.dispatchEvent(new Event('raven-api-activity'));
            return {
                start(id) { busy.set(id, (busy.get(id) || 0) + 1); emit(); },
                end(id, ok) { const n = (busy.get(id) || 1) - 1; if (n > 0) busy.set(id, n); else busy.delete(id); if (ok === true) fail = false; else if (ok === false) fail = true; emit(); },
                clearFail() { if (fail) { fail = false; emit(); } },
                get() { return { busy: busy.size > 0, fail }; }
            };
        })();
        window.addEventListener('raven-keys', () => ravenApi.clearFail());
        function useRavenApi() {
            const [st, setSt] = useState(ravenApi.get);
            useEffect(() => {
                const on = () => setSt(ravenApi.get());
                window.addEventListener('raven-api-activity', on);
                return () => window.removeEventListener('raven-api-activity', on);
            }, []);
            return st;
        }
        const ravenIndState = (hasKey, act, st) => !hasKey ? 'off' : (act.busy || st === 'checking') ? 'busy' : (act.fail || st === 'error' || st === 'empty') ? 'fail' : 'on';
        const maskKey = (k) => k.length > 10 ? `${k.slice(0, 4)}••••${k.slice(-4)}` : '••••';
        const checkKieCredit = async (key) => {
            const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 15000);
            try {
                const res = await fetch('https://api.kie.ai/api/v1/chat/credit', { cache: 'no-store', signal: ctl.signal, headers: { 'Authorization': `Bearer ${key}`, 'Accept': 'application/json' } });
                const data = await res.json().catch(() => ({}));
                const code = Number(data.code != null ? data.code : res.status);
                const credits = Number(data.data);
                if (code === 401 || res.status === 401) return { state: 'error', msg: 'Tidak valid' };
                if (code === 402) return { state: 'empty', msg: 'Kredit habis', credits: 0 };
                if (res.ok && code === 200 && isFinite(credits)) return credits > 0 ? { state: 'ok', credits } : { state: 'empty', msg: 'Kredit habis', credits };
                return { state: 'error', msg: `Error ${code}` };
            } catch (e) {
                return { state: 'error', msg: e.name === 'AbortError' ? 'Timeout' : 'Tidak terhubung' };
            } finally { clearTimeout(tm); }
        };

        const fetchWithTimeout = async (url, opts = {}, ms = 15000) => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
            finally { clearTimeout(timer); }
        };

        function extractText(data) {
            if (!data) return '';
            if (Array.isArray(data.output)) {
                const t = data.output.filter(o => o && o.type !== 'reasoning').flatMap(o => Array.isArray(o.content) ? o.content : []).filter(c => c && typeof c.text === 'string' && !/reasoning/.test(c.type || '')).map(c => c.text).join('');
                if (t) return t;
            }
            if (typeof data.output_text === 'string') return data.output_text;
            if (Array.isArray(data.content)) return data.content.filter(b => b && b.type === 'text').map(b => b.text).join('');
            if (typeof data.content === 'string') return data.content;
            const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (typeof c === 'string') return c;
            if (data.data && typeof data.data === 'object') return extractText(data.data);
            return '';
        }

        // Membaca balasan streaming (SSE) format OpenAI Responses. Toleran: juga paham format chat-completions.
        async function readKieStream(res, onActivity, onText) {
            const st = { text: '', final: '', incomplete: false, error: '' };
            const handle = (ev) => {
                if (!ev || typeof ev !== 'object') return;
                const t = String(ev.type || '');
                if (t === 'response.output_text.delta' && typeof ev.delta === 'string') { st.text += ev.delta; if (onText) onText(st.text); return; }
                const cd = ev.choices && ev.choices[0] && ev.choices[0].delta && ev.choices[0].delta.content;
                if (typeof cd === 'string') { st.text += cd; if (onText) onText(st.text); return; }
                if (t === 'response.completed' && ev.response) { st.final = extractText(ev.response); return; }
                if (t === 'response.incomplete') { st.incomplete = true; return; }
                if (t === 'response.failed') { st.error = (ev.response && ev.response.error && ev.response.error.message) || 'Proses AI gagal'; return; }
                if (t === 'error' || ev.error) { st.error = (ev.error && ev.error.message) || ev.message || ev.msg || 'Error dari server AI'; return; }
                if (ev.code && Number(ev.code) !== 200 && (ev.msg || ev.message)) st.error = ev.msg || ev.message;
            };
            let buf = '';
            const feed = (chunk, flush) => {
                buf += chunk;
                const parts = buf.split(/\r?\n\r?\n/);
                buf = flush ? '' : parts.pop();
                for (const block of parts) {
                    const d = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
                    if (!d || d === '[DONE]') continue;
                    try { handle(JSON.parse(d)); } catch (e) {}
                }
            };
            if (res.body && res.body.getReader) {
                const reader = res.body.getReader(), dec = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (onActivity) onActivity();
                    feed(dec.decode(value, { stream: true }), false);
                }
                feed(dec.decode(), true);
            } else {
                feed(await res.text(), true);
            }
            return st;
        }

        // Membatasi frekuensi update state React saat teks streaming masuk.
        function makeStreamUpdater(apply, gap = 90) {
            let last = 0, pending = null, timer = null, dead = false;
            const run = () => { timer = null; if (dead || pending === null) return; const t = pending; pending = null; last = Date.now(); apply(t); };
            return {
                push: (t) => { if (dead) return; pending = t; if (timer) return; timer = setTimeout(run, Math.max(0, gap - (Date.now() - last))); },
                cancel: () => { dead = true; if (timer) clearTimeout(timer); timer = null; pending = null; }
            };
        }

        // Jika onDelta diberikan, balasan di-stream (teks muncul bertahap). `timeout` = batas diam tanpa data baru.
        // Bila server tidak mendukung stream, otomatis jatuh ke mode biasa.
        async function kieChat(prompt, key, { timeout = KIE_TIMEOUT_MS, signal, onTry, onDelta, model = 'gpt-6-luna', effort = 'low' } = {}) {
            const log = [], RETRY = [429, 502, 503, 504];
            let streaming = typeof onDelta === 'function';
            for (let i = 0; i < 2; i++) {
                if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                const ctrl = new AbortController(), onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort);
                let timedOut = false; const t0 = Date.now();
                let timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeout);
                const bump = () => { clearTimeout(timer); timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeout); };
                try {
                    if (onTry) onTry(i + 1);
                    const res = await fetch(KIE_URL, {
                        method: 'POST', signal: ctrl.signal,
                        headers: { 'Content-Type': 'application/json', 'Accept': streaming ? 'text/event-stream, application/json' : 'application/json', 'Authorization': `Bearer ${key}` },
                        body: JSON.stringify({ model, stream: streaming, reasoning: { effort }, input: [{ role: 'user', content: [{ type: 'input_text', text: prompt }] }] })
                    });
                    bump();
                    if (streaming && res.ok && /text\/event-stream/i.test(res.headers.get('content-type') || '')) {
                        const st = await readKieStream(res, bump, onDelta);
                        const sOut = st.final.length > st.text.length ? st.final : st.text;
                        const sHead = `HTTP ${res.status} | stream | ${((Date.now() - t0) / 1000).toFixed(1)} dtk | ${sOut.length} karakter`;
                        if (st.error) throw Object.assign(new Error(st.error), { raw: sHead });
                        if (st.incomplete) throw Object.assign(new Error('Respons AI terpotong karena melebihi batas token. Persingkat input, lalu coba lagi.'), { raw: sHead });
                        if (!sOut) throw Object.assign(new Error('Respons stream kosong'), { raw: sHead, noStream: true });
                        return sOut;
                    }

            const fs = sr / dec;
            let x = biquadFilter(vocal, 'highpass', 60, 0.7, sr);
            if (dec > 1) { for (let i = 0; i < 3; i++) biquadFilter(x, 'lowpass', 4300, 0.7, sr, x); }
            const xd = new Float32Array(Math.floor(x.length / dec));
            for (let i = 0; i < xd.length; i++) xd[i] = x[i * dec];
            x = null;
            await tick();

            const winLen = (Math.round(0.072 * fs) >> 1) << 1;
            const hop = Math.max(1, Math.round(0.010 * fs));
            let Nf = 1; while (Nf < winLen * 2) Nf <<= 1;
            const nFr = Math.floor(xd.length / hop) + 1;
            const fft = makeFFT(Nf);
            const hann = new Float64Array(winLen);
            for (let i = 0; i < winLen; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * (i + 0.5) / winLen);
            const binHz = fs / Nf;
            const kLo = Math.max(2, Math.floor(70 / binHz)), kHi = Math.min((Nf >> 1) - 3, Math.floor(5000 / binHz));

            const ps = new Float64Array(xd.length + 1);
            for (let i = 0; i < xd.length; i++) ps[i + 1] = ps[i] + xd[i] * xd[i];
            const envRaw = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) {
                const a = Math.max(0, t * hop - (winLen >> 1)), b = Math.min(xd.length, a + winLen);
                envRaw[t] = b > a ? Math.sqrt((ps[b] - ps[a]) / (b - a)) : 0;
            }
            const envSorted = Float32Array.from(envRaw).sort();
            const envP95 = envSorted[Math.min(nFr - 1, Math.floor(nFr * 0.95))] || 1e-6;
            const env = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) env[t] = envRaw[t] / envP95;

            const BPS = 4;                                              
            const NB = Math.round(BPS * 12 * Math.log2(VF_FMAX / VF_FMIN)) + 1;
            const LOG2MIN = Math.log2(VF_FMIN);
            const HN = 10;
            const wH = new Float64Array(HN + 1), l2h = new Float64Array(HN + 1);
            for (let h = 1; h <= HN; h++) { wH[h] = Math.pow(0.84, h - 1); l2h[h] = Math.log2(h); }

            const MAXP = 64;
            const pkF = new Float32Array(nFr * MAXP), pkA = new Float32Array(nFr * MAXP);
            const pkN = new Uint8Array(nFr);
            const obs = new Uint8Array(nFr * NB);
            const sal = new Float64Array(NB + 2), sal2 = new Float64Array(NB);
            const re = new Float64Array(Nf), im = new Float64Array(Nf);
            const mgA = new Float64Array((Nf >> 1) + 2), mgB = new Float64Array((Nf >> 1) + 2);
            const cF = new Float64Array(512), cA = new Float64Array(512);

            const doFrame = (t, mg) => {
                let mmax = 0;
                for (let k = kLo; k <= kHi; k++) if (mg[k] > mmax) mmax = mg[k];
                const o = t * NB;
                if (mmax < 1e-9) { pkN[t] = 0; return; }
                const thr = mmax * 0.02;
                let cnt = 0;
                for (let k = kLo; k <= kHi && cnt < 512; k++) {
                    const m = mg[k];
                    if (m > thr && m > mg[k - 1] && m >= mg[k + 1]) {
                        const la = Math.log(mg[k - 1] + 1e-12), lb = Math.log(m), lc = Math.log(mg[k + 1] + 1e-12);
                        const den = la - 2 * lb + lc;
                        let d = den < 0 ? 0.5 * (la - lc) / den : 0;
                        if (d > 0.5) d = 0.5; else if (d < -0.5) d = -0.5;
                        cF[cnt] = (k + d) * binHz;
                        cA[cnt] = Math.exp(lb - 0.25 * (la - lc) * d) / mmax;
                        cnt++;
                    }
                }
                let idxs = null;
                if (cnt > MAXP) {
                    idxs = Array.from({ length: cnt }, (_, i) => i).sort((a, b) => cA[b] - cA[a]).slice(0, MAXP).sort((a, b) => a - b);
                } else { idxs = Array.from({ length: cnt }, (_, i) => i); }
                const base = t * MAXP;
                for (let n = 0; n < idxs.length; n++) { pkF[base + n] = cF[idxs[n]]; pkA[base + n] = cA[idxs[n]]; }
                pkN[t] = idxs.length;

                sal.fill(0);
                for (let n = 0; n < idxs.length; n++) {
                    const fp = pkF[base + n], a = Math.pow(pkA[base + n], 0.6);
                    const l2 = Math.log2(fp);
                    for (let h = 1; h <= HN; h++) {
                        const jf = BPS * 12 * (l2 - l2h[h] - LOG2MIN);
                        if (jf < -0.5) break;
                        if (jf > NB - 1) continue;
                        const j0 = Math.floor(jf), fr = jf - j0, v = a * wH[h];
                        sal[j0] += v * (1 - fr); sal[j0 + 1] += v * fr;
                    }
                }
                let sm = 0;
                for (let j = 0; j < NB; j++) {
                    const v = 0.25 * (j > 0 ? sal[j - 1] : sal[j]) + 0.5 * sal[j] + 0.25 * sal[j + 1];
                    sal2[j] = v; if (v > sm) sm = v;
                }
                if (sm > 0) for (let j = 0; j < NB; j++) obs[o + j] = Math.round(255 * sal2[j] / sm);
            };

            for (let t = 0; t < nFr; t += 2) {
                const t2 = t + 1 < nFr ? t + 1 : -1;
                re.fill(0); im.fill(0);
                const s1 = t * hop - (winLen >> 1);
                for (let i = 0; i < winLen; i++) { const idx = s1 + i; if (idx >= 0 && idx < xd.length) re[i] = xd[idx] * hann[i]; }
                if (t2 >= 0) {
                    const s2 = t2 * hop - (winLen >> 1);
                    for (let i = 0; i < winLen; i++) { const idx = s2 + i; if (idx >= 0 && idx < xd.length) im[i] = xd[idx] * hann[i]; }
                }
                fft(re, im, false);
                for (let k = kLo - 1; k <= kHi + 1; k++) {
                    const k2 = (Nf - k) & (Nf - 1);
                    const ar = (re[k] + re[k2]) * 0.5, ai = (im[k] - im[k2]) * 0.5;
                    mgA[k] = Math.sqrt(ar * ar + ai * ai);
                    const br = (im[k] + im[k2]) * 0.5, bi = -(re[k] - re[k2]) * 0.5;
                    mgB[k] = Math.sqrt(br * br + bi * bi);
                }
                doFrame(t, mgA);
                if (t2 >= 0) doFrame(t2, mgB);
                if (t % 400 === 0) { rep(0.6 * t / nFr); await tick(); }
            }

            const LAM = 0.010, JCAP = 0.55;
            const bp = new Uint8Array(nFr * NB);
            let prev = new Float32Array(NB), cur = new Float32Array(NB);
            const fv = new Float32Array(NB), fi = new Uint8Array(NB), bv = new Float32Array(NB), bi2 = new Uint8Array(NB);
            for (let j = 0; j < NB; j++) prev[j] = obs[j] / 255;
            for (let t = 1; t < nFr; t++) {
                let gmax = -1e9, gidx = 0;
                for (let j = 0; j < NB; j++) if (prev[j] > gmax) { gmax = prev[j]; gidx = j; }
                fv[0] = prev[0]; fi[0] = 0;
                for (let j = 1; j < NB; j++) {
                    if (fv[j - 1] - LAM > prev[j]) { fv[j] = fv[j - 1] - LAM; fi[j] = fi[j - 1]; } else { fv[j] = prev[j]; fi[j] = j; }
                }
                bv[NB - 1] = prev[NB - 1]; bi2[NB - 1] = NB - 1;
                for (let j = NB - 2; j >= 0; j--) {
                    if (bv[j + 1] - LAM > prev[j]) { bv[j] = bv[j + 1] - LAM; bi2[j] = bi2[j + 1]; } else { bv[j] = prev[j]; bi2[j] = j; }
                }
                const capV = gmax - JCAP;
                const o = t * NB;
                let cmax = -1e9;
                for (let j = 0; j < NB; j++) {
                    let v, id;
                    if (fv[j] >= bv[j]) { v = fv[j]; id = fi[j]; } else { v = bv[j]; id = bi2[j]; }
                    if (v < capV) { v = capV; id = gidx; }
                    bp[o + j] = id;
                    cur[j] = v + obs[o + j] / 255;
                    if (cur[j] > cmax) cmax = cur[j];
                }
                for (let j = 0; j < NB; j++) cur[j] -= cmax;
                const sw = prev; prev = cur; cur = sw;
                if (t % 2000 === 0) { rep(0.6 + 0.2 * t / nFr); await tick(); }
            }
            const path = new Uint8Array(nFr);
            let best = 0; for (let j = 1; j < NB; j++) if (prev[j] > prev[best]) best = j;
            path[nFr - 1] = best;
            for (let t = nFr - 1; t > 0; t--) path[t - 1] = bp[t * NB + path[t]];

            const f0 = new Float32Array(nFr), hr = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) {
                const fb = VF_FMIN * Math.pow(2, path[t] / (BPS * 12));
                const base = t * MAXP, n = pkN[t];
                let acc = 0, wsum = 0, matchE = 0, totE = 0;
                for (let q = 0; q < n; q++) totE += pkA[base + q] * pkA[base + q];
                for (let h = 1; h <= HN; h++) {
                    const target = fb * h;
                    if (target > 5000) break;
                    let bestA = 0, bestF = 0;
                    for (let q = 0; q < n; q++) {
                        const fp = pkF[base + q];
                        if (Math.abs(Math.log2(fp / target)) < 0.04 && pkA[base + q] > bestA) { bestA = pkA[base + q]; bestF = fp; }
                    }
                    if (bestA > 0) { acc += bestA * (bestF / h); wsum += bestA; matchE += bestA * bestA; }
                }
                f0[t] = wsum > 0 ? acc / wsum : fb;
                hr[t] = totE > 0 ? matchE / totE : 0;
            }

            const strong = [];
            for (let t = 0; t < nFr; t++) if (env[t] > 0.25) strong.push(hr[t]);
            strong.sort((a, b) => a - b);
            const p75 = strong.length ? strong[Math.floor(strong.length * 0.75)] : 0.5;
            const hrThr = Math.min(0.40, Math.max(0.15, 0.5 * p75));
            const vo = new Uint8Array(nFr);
            for (let t = 0; t < nFr; t++) vo[t] = (env[t] >= 0.04 && hr[t] >= hrThr) ? 1 : 0;

            let i = 0;
            while (i < nFr) {
                if (vo[i]) { let j = i; while (j < nFr && vo[j]) j++; if (j - i < 3) for (let k = i; k < j; k++) vo[k] = 0; i = j; } else i++;
            }
            i = 0;
            while (i < nFr) {
                if (!vo[i]) {
                    let j = i; while (j < nFr && !vo[j]) j++;
                    if (i > 0 && j < nFr && (j - i) <= 3 && Math.abs(Math.log2(f0[j] / f0[i - 1])) < 0.17) {
                        let e = 0; for (let k = i; k < j; k++) e += env[k];
                        if (e / (j - i) > 0.10) for (let k = i; k < j; k++) { vo[k] = 1; f0[k] = f0[i - 1] * Math.pow(f0[j] / f0[i - 1], (k - i + 1) / (j - i + 1)); }
                    }
                    i = j;
                } else i++;
            }

            const lg = new Float32Array(nFr), sm3 = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) lg[t] = Math.log2(f0[t]);
            for (let t = 0; t < nFr; t++) {
                if (!vo[t]) { sm3[t] = lg[t]; continue; }
                const a = (t > 0 && vo[t - 1]) ? lg[t - 1] : lg[t], b = lg[t], c = (t + 1 < nFr && vo[t + 1]) ? lg[t + 1] : lg[t];
                sm3[t] = Math.max(Math.min(a, b), Math.min(Math.max(a, b), c));
            }
            let first = -1, voicedCount = 0;
            for (let t = 0; t < nFr; t++) if (vo[t]) { if (first < 0) first = t; voicedCount++; }
            const hopSec = hop / fs;
            if (first < 0) return { f0log: new Float32Array(nFr).fill(Math.log2(600)), tone: vo, shift: 0, env, hopSec, nFr, f0hz: new Float32Array(nFr), hrThr };
            const f0log = new Float32Array(nFr);
            let last = sm3[first];
            for (let t = 0; t < nFr; t++) { if (vo[t]) last = sm3[t]; f0log[t] = last; }
            const vals = []; for (let t = 0; t < nFr; t++) if (vo[t]) vals.push(sm3[t]);
            vals.sort((a, b) => a - b);
            const med = Math.pow(2, vals[vals.length >> 1]);
            const shift = Math.min(2, Math.max(0, Math.round(Math.log2(700 / med))));
            const f0hz = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) f0hz[t] = Math.pow(2, f0log[t]);
            rep(1);
            return { f0log, tone: vo, shift, env, hopSec, nFr, f0hz, hrThr };
        }

        async function synthesizeVoice(track, vocal, sr, onProgress, opts = {}) {
            const len = vocal.length;
            const { f0log, tone, shift, env: envN, hopSec, nFr } = track;

            const TAB = 2048;
            const tab = new Float32Array(TAB);
            const harm = [1, 0.28, 0.10, 0.04];
            let pk = 0;
            for (let i = 0; i < TAB; i++) {
                let v = 0;
                for (let h = 0; h < harm.length; h++) v += harm[h] * Math.sin(2 * Math.PI * (h + 1) * i / TAB);
                tab[i] = v; if (Math.abs(v) > pk) pk = Math.abs(v);
            }
            for (let i = 0; i < TAB; i++) tab[i] /= pk;

            const out = new Float32Array(len);
            const act = new Uint8Array(len);
            const aAtt = 1 - Math.exp(-1 / (sr * 0.008));
            const aRel = 1 - Math.exp(-1 / (sr * 0.04));
            const aAmp = 1 - Math.exp(-1 / (sr * 0.015));
            const aBr = 1 - Math.exp(-1 / (sr * 0.01));
            const aN1 = 1 - Math.exp(-2 * Math.PI * 6000 / sr);
            const aN2 = 1 - Math.exp(-2 * Math.PI * 1500 / sr);
            const BLOCK = 64;
            let phase = 0, toneG = 0, ampS = 0, breathS = 0, vibPhase = 0, sustain = 0, n1 = 0, n2 = 0;

            for (let s = 0; s < len; s += BLOCK) {
                let fp = (s / sr) / hopSec;
                if (fp < 0) fp = 0; if (fp > nFr - 1) fp = nFr - 1;
                const i0 = Math.floor(fp), i1 = Math.min(nFr - 1, i0 + 1), fr = fp - i0;
                let f = Math.pow(2, f0log[i0] + (f0log[i1] - f0log[i0]) * fr + shift);
                while (f > 2100) f /= 2;
                if (opts.ceil && f > opts.ceil) f = opts.ceil * Math.pow(f / opts.ceil, opts.squash); 
                const toneT = tone[Math.min(nFr - 1, Math.round(fp))] ? 1 : 0;
                const envv = envN[i0] + (envN[i1] - envN[i0]) * fr;
                const ampT = Math.min(1, Math.pow(Math.max(envv, 0), 0.55)) * sstep(0.03, 0.10, envv);
                const breathT = toneT ? BREATH_VOICED * ampT : (envv > 0.12 ? BREATH_UNVOICED * Math.min(1, Math.pow(envv, 0.7)) : 0);
                if (toneT) sustain += BLOCK / sr; else sustain = 0;
                const vibD = Math.min(1, Math.max(0, (sustain - 0.15) / 0.4));
                const end = Math.min(len, s + BLOCK);
                for (let k = s; k < end; k++) {
                    toneG += (toneT - toneG) * (toneT > toneG ? aAtt : aRel);
                    ampS += (ampT - ampS) * aAmp;
                    breathS += (breathT - breathS) * aBr;
                    vibPhase += 5.3 / sr; if (vibPhase >= 1) vibPhase -= 1;
                    const fm = f * (1 + 0.0035 * vibD * Math.sin(6.2831853 * vibPhase));
                    phase += fm / sr; if (phase >= 1) phase -= 1;
                    const ph = phase * TAB, ii = ph | 0, fr2 = ph - ii;
                    const smp = tab[ii] + (tab[(ii + 1) & (TAB - 1)] - tab[ii]) * fr2;
                    const nz = Math.random() * 2 - 1;
                    n1 += aN1 * (nz - n1); n2 += aN2 * (n1 - n2);
                    out[k] = smp * toneG * ampS + (n1 - n2) * breathS * 2.5;
                    if (toneG * ampS > 0.05) act[k] = 1;
                }
                if ((s / BLOCK) % 2048 === 0) { if (onProgress) onProgress(s / len); await tick(); }
            }

            let eV = 0, eO = 0;
            for (let i = 0; i < len; i++) if (act[i]) { eV += vocal[i] * vocal[i]; eO += out[i] * out[i]; }
            const gain = Math.min(3, Math.max(0.1, VOICE_LEVEL * Math.sqrt((eV + 1e-12) / (eO + 1e-12))));
            for (let i = 0; i < len; i++) { const v = out[i] * gain; out[i] = 0.9 * Math.tanh(v / 0.9); }
            return out;
        }

        async function buildVoiceFilter(vocal, sr, onProgress) {
            const report = (p) => { if (onProgress) onProgress(p); };
            const track = await trackMelody(vocal, sr, f => report(0.6 * f));
            await tick();
            const out = await synthesizeVoice(track, vocal, sr, f => report(0.6 + 0.4 * f));
            report(1);
            return { out, track };
        }

        // ALGORITMA BARU: Filter Modulasi Lanjutan (Micro-Pitch Jitter + Comb Filtering)
        async function generateEvader(audioData, sr, onProgress) {
            const len = audioData.length;
            const out = new Float32Array(len);

            // 1. Time Jitter + Micro Pitch
            const maxDelaySec = 0.018; // 18ms maksimum drift
            const maxDelaySamples = Math.ceil(maxDelaySec * sr);
            const buffer = new Float32Array(len + maxDelaySamples * 2);
            buffer.set(audioData, maxDelaySamples);

            let jitterPhase1 = 0;
            let jitterPhase2 = 0;
            const shiftFreq = 12; // Modulasi pelan 12Hz

            // 2. Multi-band Comb Filter parameters
            const combDelaySec = 0.005; // 5ms delay
            const combDelaySamples = Math.floor(combDelaySec * sr);

            for (let i = 0; i < len; i++) {
                const t = i / sr;
                
                // Osilator random lambat & cepat
                jitterPhase1 += 0.0005; 
                jitterPhase2 += (Math.random() - 0.5) * 0.05; 

                const delay = (Math.sin(jitterPhase1) * 0.8 + Math.sin(jitterPhase2) * 0.2 + 1) * 0.5 * maxDelaySec * sr;

                const readPos = i + maxDelaySamples - delay;
                const idx1 = Math.floor(readPos);
                const frac = readPos - idx1;

                let warped = buffer[idx1] * (1 - frac) + buffer[idx1 + 1] * frac;

                // Comb Filter (menyampurkan sinyal dengan versi delaynya)
                const combReadPos = i + maxDelaySamples - combDelaySamples;
                const combSample = buffer[combReadPos] || 0;
                warped = warped * 0.7 + combSample * 0.3;

                // Ring Modulation untuk Frequency Shifting
                warped = warped * Math.cos(2 * Math.PI * shiftFreq * t);

                out[i] = warped;

                if ((i & 65535) === 0) {
                    if (onProgress) onProgress(i / len);
                    await tick();
                }
            }
            return out;
        }

        const ECHO_MAX = 1.0;
        function makeEchoFx(ctx, level = 0) {
            const input = ctx.createGain(), out = ctx.createGain();
            out.gain.value = level * ECHO_MAX;
            
            const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500;

            const delay = ctx.createDelay(1.0); delay.delayTime.value = 0.02; 
            
            const lfo = ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 1.2;
            const lfoGain = ctx.createGain();
            lfoGain.gain.value = 0.008; 
            lfo.connect(lfoGain);
            lfoGain.connect(delay.delayTime);
            lfo.start();

            const fb = ctx.createGain(); fb.gain.value = 0.45; 
            
            input.connect(hp); hp.connect(lp);
            lp.connect(delay); delay.connect(out);
            delay.connect(fb); fb.connect(delay);
            input.connect(out); 

            return { input, output: out, setLevel: (v) => out.gain.setTargetAtTime(v * ECHO_MAX, ctx.currentTime, 0.03) };
        }

        const TARGET_RMS = 0.14, MAX_BOOST = 4, PEAK_CEIL = 0.85, MIN_CUT = 1, EDGE_FADE = 0.01, EXPORT_KBPS = 128;     

        function vocalMix(i) {
            return { dry: Math.pow(1 - i, 4), wet: Math.sin(i * Math.PI / 2) * VOICE_GAIN };
        }
        
        function distMix(r) { 
            return { wet: Math.cos(r * Math.PI / 2), dist: Math.sin(r * Math.PI / 2) }; 
        }

        function computeMakeupGain(vocal, melody, intensity) {
            const mix = vocalMix(intensity);
            const n = Math.min(vocal.length, melody.length);
            let sum = 0, cnt = 0, peak = 0;
            for (let i = 0; i < n; i++) {
                const m = mix.dry * vocal[i] + mix.wet * melody[i];
                const a = Math.abs(m);
                if (a > peak) peak = a;
                if (a > 0.005) { sum += m * m; cnt++; }
            }
            if (cnt < 100 || peak <= 0) return 1;
            const rms = Math.sqrt(sum / cnt);
            let gain = TARGET_RMS / rms;
            gain = Math.min(gain, PEAK_CEIL / peak);
            return Math.min(MAX_BOOST, Math.max(1, gain));
        }

        function makeMasterChain(ctx) {
            const gain = ctx.createGain(); gain.gain.value = 0.92;
            const lim = ctx.createDynamicsCompressor();
            lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20;
            lim.attack.value = 0.003; lim.release.value = 0.12;
            gain.connect(lim); lim.connect(ctx.destination);
            return gain;
        }

        class AudioEngine {
            static fileKey(file) { return `${file.name}|${file.size}|${file.lastModified}`; }

            constructor() {
                this.loadedKey = null;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.originalBuffer = null;
                this.vocalBuffer = null;
                this.filterBuffer = null;
                this.robotBuffer = null;

                this.vocalSource = null;
                this.filterSource = null;
                this.robotSource = null;

                this.masterGain = makeMasterChain(this.ctx);

                this.echoLevel = 0;
                this.robotLevel = 0;
                this.echoFx = makeEchoFx(this.ctx, 0);
                this.echoFx.output.connect(this.masterGain);

                this.vocalAnalyser = this.ctx.createAnalyser();
                this.vocalAnalyser.fftSize = 256;
                this.vocalAnalyser.smoothingTimeConstant = 0.8;

                this.isPlaying = false;
                this.startTime = 0;
                this.pauseTime = 0;
                this.duration = 0;
                this.baseReady = false;

                this.makeup = 1;         
                this.trimStart = 0;      
                this.trimEnd = 0;

                this.tracks = { vocal: { enabled: true, intensity: 0.6, volumeNode: null, dryGain: null, wetGain: null } };
            }

            async loadAudio(file, onProgress = () => {}) {
                const key = AudioEngine.fileKey(file);
                if (this.loadedKey === key && this.vocalBuffer && this.filterBuffer) {
                    onProgress(100, "Sistem Siap");
                    return;
                }
                this.stop();
                this.pauseTime = 0;
                this.loadedKey = null;
                this.originalBuffer = this.vocalBuffer = this.filterBuffer = this.robotBuffer = null;

                onProgress(10, "Mengalokasikan memori...");
                const arrayBuffer = await file.arrayBuffer();
                onProgress(40, "Decoding data PCM...");
                this.originalBuffer = await new Promise((resolve, reject) => {
                    const p = this.ctx.decodeAudioData(arrayBuffer, resolve, reject);
                    if (p && p.catch) p.catch(reject);
                });
                this.duration = this.originalBuffer.duration;

                const sr = this.originalBuffer.sampleRate;
                const len = this.originalBuffer.length;
                const L = this.originalBuffer.getChannelData(0);
                const R = this.originalBuffer.numberOfChannels > 1 ? this.originalBuffer.getChannelData(1) : L;

                onProgress(50, "Memisahkan frekuensi...");
                let coarse = await separateStems(L, R, sr, (f) => onProgress(50 + Math.round(f * 18), "Memisahkan frekuensi..."));
                onProgress(68, "Menganalisis nada...");
                const vf = await buildVoiceFilter(coarse.vocal, sr, (f) => onProgress(68 + Math.round(f * 18), "Menganalisis nada..."));
                onProgress(86, "Menyempurnakan audio...");
                const fin = await refineStems(L, R, sr, vf.track, coarse, (f) => onProgress(86 + Math.round(f * 7), "Menyempurnakan audio..."));
                coarse = null;
                
                onProgress(93, "Memproses pemfilteran lanjutan...");
                const robot = await generateEvader(fin.vocal, sr, (f) => onProgress(93 + Math.round(f * 3), "Memproses pemfilteran lanjutan...")); 

                this.vocalBuffer = this.ctx.createBuffer(1, len, sr);
                this.vocalBuffer.copyToChannel(fin.vocal, 0);
                this.filterBuffer = this.ctx.createBuffer(1, len, sr);
                this.filterBuffer.copyToChannel(vf.out, 0);
                this.robotBuffer = this.ctx.createBuffer(1, len, sr);
                this.robotBuffer.copyToChannel(robot, 0);

                onProgress(96, "Kalibrasi dynamic range...");
                this.makeup = computeMakeupGain(fin.vocal, vf.out, this.tracks.vocal.intensity);
                this.trimStart = 0;
                this.trimEnd = this.duration;

                onProgress(98, "Menginisialisasi pemutar...");
                this.initBaseNodes();
                this.loadedKey = key;
                onProgress(100, "Sistem Siap");
            }

            initBaseNodes() {
                if (this.baseReady) { this.applyVocalState(); return; } 
                const ctx = this.ctx;
                const v = this.tracks.vocal;

                v.volumeNode = ctx.createGain();
                v.dryGain = ctx.createGain();
                v.wetGain = ctx.createGain();
                v.dryGain.connect(v.volumeNode);
                v.wetGain.connect(v.volumeNode);
                this.robotGain = ctx.createGain();
                this.robotGain.connect(v.volumeNode);
                v.volumeNode.connect(this.vocalAnalyser);
                this.vocalAnalyser.connect(this.masterGain);
                this.vocalAnalyser.connect(this.echoFx.input);

                this.baseReady = true;
                this.applyVocalState();
            }

            applyVocalState() {
                if (!this.baseReady) return;
                const t = this.tracks.vocal;
                const now = this.ctx.currentTime;
                t.volumeNode.gain.setTargetAtTime(this.makeup, now, 0.01);
                
                // Logika pencampuran (MIX) untuk pemfilteran
                const mix = vocalMix(t.enabled ? t.intensity : 0);
                const dm = distMix(this.robotLevel); 
                
                t.dryGain.gain.setTargetAtTime(mix.dry, now, 0.03); 
                t.wetGain.gain.setTargetAtTime(mix.wet * dm.wet, now, 0.03); 
                this.robotGain.gain.setTargetAtTime(mix.wet * dm.dist, now, 0.03); 
            }

            setIntensity(value) { this.tracks.vocal.intensity = value; this.applyVocalState(); }
            setEcho(value) { this.echoLevel = value; this.echoFx.setLevel(value); }
            setRobot(value) { this.robotLevel = value; this.applyVocalState(); }

            getPeaks(bins) {
                const v = this.vocalBuffer.getChannelData(0), f = this.filterBuffer.getChannelData(0);
                const mix = vocalMix(this.tracks.vocal.intensity);
                const dm = distMix(this.robotLevel), rb = this.robotBuffer ? this.robotBuffer.getChannelData(0) : null;
                const len = Math.min(v.length, f.length);
                const peaks = new Float32Array(bins);
                const step = len / bins;
                let max = 0;
                for (let b = 0; b < bins; b++) {
                    const s = Math.floor(b * step), e = Math.min(len, Math.floor((b + 1) * step));
                    let pk = 0;
                    for (let i = s; i < e; i++) { const a = Math.abs(mix.dry * v[i] + mix.wet * (dm.wet * f[i] + (rb ? dm.dist * rb[i] : 0))); if (a > pk) pk = a; }
                    peaks[b] = pk; if (pk > max) max = pk;
                }
                if (max > 0) for (let b = 0; b < bins; b++) peaks[b] /= max;
                return peaks;
            }

            setTrim(start, end) {
                const d = this.duration;
                const minLen = Math.min(MIN_CUT, d);
                start = Math.max(0, Math.min(start, d - minLen));
                end = Math.min(d, Math.max(end, start + minLen));
                this.trimStart = start;
                this.trimEnd = end;
                this._scheduleStop();
            }

            _scheduleStop() {
                if (!this.isPlaying) return;
                const remain = Math.max(0, this.trimEnd - (this.ctx.currentTime - this.startTime));
                const when = this.ctx.currentTime + remain;
                [this.vocalSource, this.filterSource, this.robotSource].forEach(s => {
                    if (s) { try { s.stop(when); } catch (e) {} }
                });
            }

            play(offset = 0) {
                if (!this.vocalBuffer || !this.filterBuffer || !this.baseReady) return false;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                if (offset < this.trimStart || offset >= this.trimEnd - 0.05) offset = this.trimStart;

                this.vocalSource = this.ctx.createBufferSource();
                this.vocalSource.buffer = this.vocalBuffer;
                this.vocalSource.connect(this.tracks.vocal.dryGain);

                this.filterSource = this.ctx.createBufferSource();
                this.filterSource.buffer = this.filterBuffer;
                this.filterSource.connect(this.tracks.vocal.wetGain);

                this.robotSource = null;
                if (this.robotBuffer) {
                    this.robotSource = this.ctx.createBufferSource();
                    this.robotSource.buffer = this.robotBuffer;
                    this.robotSource.connect(this.robotGain);
                }

                this.startTime = this.ctx.currentTime - offset;
                this.vocalSource.start(0, offset);
                this.filterSource.start(0, offset);
                if (this.robotSource) this.robotSource.start(0, offset);
                this.isPlaying = true;
                this._scheduleStop();
                return true;
            }

            stop() {
                if (this.isPlaying) this.pauseTime = Math.max(0, Math.min(this.ctx.currentTime - this.startTime, this.duration));
                [this.vocalSource, this.filterSource, this.robotSource].forEach(s => {
                    if (s) { try { s.stop(); } catch (e) {} }
                });
                this.isPlaying = false;
            }

            seekTime(time) {
                if (this.isPlaying) { this.stop(); this.play(time); }
                else { this.pauseTime = time; }
            }

            seek(percent) { this.seekTime((percent / 100) * this.duration); }

            getCurrentTime() {
                if (!this.isPlaying) return this.pauseTime;
                const t = this.ctx.currentTime - this.startTime;
                if (t >= this.trimEnd) { this.stop(); this.pauseTime = this.trimStart; return this.trimStart; }
                return t;
            }

            async renderOffline(onProgress) {
                const origSr = this.originalBuffer.sampleRate;
                const sr = [44100, 48000, 32000].includes(origSr) ? origSr : 44100;
                const start = this.trimStart;
                const dur = this.trimEnd - this.trimStart;
                const len = Math.max(1, Math.round(dur * sr));
                const oc = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, len, sr);
                const master = makeMasterChain(oc);
                const v = this.tracks.vocal;
                const mix = vocalMix(v.enabled ? v.intensity : 0);

                const bus = oc.createGain();
                const fade = Math.min(EDGE_FADE, dur / 4);
                const cutAtStart = start > 0.001;
                const cutAtEnd = this.trimEnd < this.duration - 0.001;
                bus.gain.setValueAtTime(cutAtStart ? 0 : this.makeup, 0);
                if (cutAtStart) bus.gain.linearRampToValueAtTime(this.makeup, fade);
                if (cutAtEnd) {
                    bus.gain.setValueAtTime(this.makeup, dur - fade);
                    bus.gain.linearRampToValueAtTime(0, dur);
                }
                bus.connect(master);
                if (this.echoLevel > 0) { const fx = makeEchoFx(oc, this.echoLevel); bus.connect(fx.input); fx.output.connect(master); }

                const vSrc = oc.createBufferSource(); vSrc.buffer = this.vocalBuffer;
                const fSrc = oc.createBufferSource(); fSrc.buffer = this.filterBuffer;
                const dm = distMix(this.robotLevel);
                
                const dG = oc.createGain(); dG.gain.value = mix.dry;
                const wG = oc.createGain(); wG.gain.value = mix.wet * dm.wet;
                
                vSrc.connect(dG); dG.connect(bus);
                fSrc.connect(wG); wG.connect(bus);
                
                vSrc.start(0, start, dur);
                fSrc.start(0, start, dur);
                if (this.robotBuffer && dm.dist > 0) {
                    const rSrc = oc.createBufferSource(); rSrc.buffer = this.robotBuffer;
                    const rG = oc.createGain(); rG.gain.value = mix.wet * dm.dist;
                    rSrc.connect(rG); rG.connect(bus);
                    rSrc.start(0, start, dur);
                }

                onProgress(30, "Merender hasil final...");
                return await new Promise((resolve, reject) => {
                    oc.oncomplete = (e) => resolve(e.renderedBuffer);
                    const p = oc.startRendering();
                    if (p && p.then) p.then(resolve, reject);
                });
            }
        }

        async function encodeMp3(buffer, kbps, onProgress) {
            if (!window.lamejs) throw new Error("Encoder MP3 belum termuat. Periksa koneksi internet, lalu muat ulang halaman.");
            const sr = buffer.sampleRate, len = buffer.length;
            const L = buffer.getChannelData(0), R = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : L;
            let peak = 0;
            for (let i = 0; i < len; i++) { const a = Math.abs(L[i]), b = Math.abs(R[i]); if (a > peak) peak = a; if (b > peak) peak = b; }
            const gain = peak > 1 ? 0.98 / peak : 1; 
            const enc = new window.lamejs.Mp3Encoder(2, sr, kbps);
            const block = 1152 * 20, chunks = [];
            for (let i = 0, n = 0; i < len; i += block, n++) {
                const m = Math.min(block, len - i);
                const l = new Int16Array(m), r = new Int16Array(m);
                for (let j = 0; j < m; j++) {
                    const a = Math.max(-1, Math.min(1, L[i + j] * gain)), b = Math.max(-1, Math.min(1, R[i + j] * gain));
                    l[j] = a < 0 ? a * 0x8000 : a * 0x7FFF; r[j] = b < 0 ? b * 0x8000 : b * 0x7FFF;
                }
                const out = enc.encodeBuffer(l, r);
                if (out.length) chunks.push(new Uint8Array(out));
                if (n % 10 === 0) { onProgress(Math.round(i / len * 100)); await new Promise(res => setTimeout(res, 0)); }
            }
            const end = enc.flush();
            if (end.length) chunks.push(new Uint8Array(end));
            return new Blob(chunks, { type: 'audio/mpeg' });
        }

        async function kieUploadAudio(blob, fileName, key, signal) {
            const log = [];

                try {
                    let init;
                    if (ep.kind === 'stream') {
                        const fd = new FormData();

                        init = { method: 'POST', headers: { 'Authorization': `Bearer ${key}` }, body: fd, signal };
                    } else {
                        if (!dataUrl) dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Gagal membaca file')); fr.readAsDataURL(blob); });
                        init = { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ base64Data: dataUrl, uploadPath: 'audio/cover-studio', fileName }), signal };
                    }
                    const res = await fetchT(ep.url, init, 120000);
                    const j = await res.json().catch(() => ({}));
                    const url = j.data && (j.data.downloadUrl || j.data.fileUrl);
                    if (res.ok && url) return url;
                    if (res.status === 401 || res.status === 402 || Number(j.code) === 401 || Number(j.code) === 402) throw Object.assign(new Error(j.msg || 'API key ditolak atau kredit tidak mencukupi'), { fatal: true });
                    log.push(`${ep.kind} ${ep.url}: ${j.msg || j.message || 'HTTP ' + res.status}`);

        function sniffAudio(u) {
            const t = (a, b) => String.fromCharCode(...Array.from(u.slice(a, b)));
            if (t(0, 3) === 'ID3') return 'mp3';
            if (u[0] === 0xFF && (u[1] & 0xE0) === 0xE0) return (u[1] & 0x06) === 0 ? 'aac' : 'mp3'; 
            if (t(0, 4) === 'RIFF' && t(8, 12) === 'WAVE') return 'wav';
            if (t(0, 4) === 'OggS') return 'ogg';
            if (t(0, 4) === 'fLaC') return 'flac';
            if (t(4, 8) === 'ftyp') return 'm4a';
            return 'unknown';
        }

        // =====================================================================================
        // Proses latar (generate lagu): berjalan walau pengguna pindah halaman, tanpa tombol batal.

        const ravenJobs = (() => {
            let list = [];
            const emit = () => window.dispatchEvent(new Event('raven-jobs'));
            return {
                add(job) { list = [...list.filter(j => j.id !== job.id), { start: Date.now(), msg: '', ...job }]; emit(); },
                update(id, patch) { list = list.map(j => j.id === id ? { ...j, ...patch } : j); emit(); },
                remove(id) { list = list.filter(j => j.id !== id); emit(); },
                get() { return list; }
            };
        })();
        function useRavenJobs() {
            const [l, setL] = useState(ravenJobs.get);
            useEffect(() => { const f = () => setL(ravenJobs.get()); window.addEventListener('raven-jobs', f); return () => window.removeEventListener('raven-jobs', f); }, []);
            return l;
        }
        function useTick(on) {
            const [, setT] = useState(0);
            useEffect(() => { if (!on) return; const id = setInterval(() => setT(x => x + 1), 1000); return () => clearInterval(id); }, [on]);
        }
        const fmtClock = (sec) => `${Math.floor(Math.max(0, sec) / 60)}:${String(Math.max(0, sec) % 60).padStart(2, '0')}`;
        const SUNO_STATUS_ID = { PENDING: 'Menunggu antrean server', TEXT_SUCCESS: 'Menyusun lirik', FIRST_SUCCESS: 'Versi pertama hampir siap' };

        async function resumeSunoTask(it, onDone) {
            const key = cleanKey(readCentralKeys().kie);
            if (!key) return;
            const jobId = 'resume-' + it.taskId, label = (it.meta && it.meta.title) || it.label || 'Lagu';
            ravenJobs.add({ id: jobId, label, msg: 'Melanjutkan pemantauan', start: it.date || Date.now() });
            let fails = 0;
            try {
                while (Date.now() - (it.date || 0) < 1200000) {
                    let d = {};
                    try {
                        const r = await fetchT(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(it.taskId)}`, { headers: { 'Authorization': `Bearer ${key}` } }, 30000);
                        d = await r.json().catch(() => ({}));
                        if (!r.ok || Number(d.code) !== 200) throw new Error(d.msg || `HTTP ${r.status}`);
                        fails = 0;
                    } catch (e) { if (++fails > 5) return; await new Promise(r => setTimeout(r, 6000)); continue; }
                    const info = d.data || {}, status = info.status || '';
                    const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                    ravenJobs.update(jobId, { msg: SUNO_STATUS_ID[status] || 'AI sedang memproses' });
                    if (status === 'SUCCESS' || (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url))) {
                        pendDel(it.taskId);
                        const results = list.map((x, i) => ({ id: x.id || i, title: x.title || `${label} ${i + 1}`, taskId: it.taskId, audioId: x.id || '', variant: i + 1, url: x.audio_url || x.source_audio_url || x.stream_audio_url || '', image: x.image_url || x.source_image_url || '', duration: x.duration })).filter(x => x.url);
                        if (results.length) { onDone(results); showToast(`"${label}" selesai. ${results.length} versi telah disimpan ke Library.`, 'success'); }
                        return;
                    }
                    if (['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR', 'CALLBACK_EXCEPTION'].includes(status)) {
                        pendDel(it.taskId); showToast(`"${label}" gagal diproses: ${info.errorMessage || status}`, 'error'); return;
                    }
                    await new Promise(r => setTimeout(r, 6000));
                }
            } finally { ravenJobs.remove(jobId); }
        }

        // Pill kecil di header: tanda ada lagu yang sedang dibuat.
        function JobsPill() {

        // --- Bersama: unduh lagu, pengelompokan folder per judul, pemilihan banyak lagu, pemutar ---
        async function downloadSongFile(it, all) {
                if (!it || !it.url) return;
                const vNo = songVariant(it, all);
                const base = String((it.title || 'Lagu') + (vNo ? ` - Versi ${vNo}` : '')).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Lagu';
                const saveRaw = (blob, ext) => {
                    const obj = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = obj; a.download = `${base}.${ext}`; a.style.display = 'none';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(obj), 60000);
                    return `${base}.${ext}`;
                };
                const saveMp3 = (bytes) => saveRaw(new Blob([bytes], { type: 'application/octet-stream' }), 'mp3');
                try {
                    const res = await fetch(it.url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const ab = await res.arrayBuffer();
                    if (!ab.byteLength) throw new Error('File kosong');
                    const kind = sniffAudio(new Uint8Array(ab, 0, Math.min(16, ab.byteLength)));
                    if (kind === 'mp3') {
                        showToast('Mengunduh: ' + saveMp3(ab), 'success');
                    } else {
                        const label = kind === 'unknown' ? 'non-MP3' : kind.toUpperCase();
                        let mp3 = null;
                        try {
                            showToast('File berformat ' + label + ', mengonversi...', 'info');
                            const AC = window.AudioContext || window.webkitAudioContext;
                            const ctx = new AC();
                            let abuf; try { abuf = await ctx.decodeAudioData(ab.slice(0)); } finally { try { ctx.close(); } catch (e) {} }
                            mp3 = await encodeMp3(abuf, 192, () => {});
                        } catch (ce) { console.error(ce); }
                        if (mp3) showToast('Mengunduh: ' + saveMp3(mp3), 'success');
                        else if (kind === 'unknown') throw new Error('Format file tidak dikenal');  
                        else showToast('Disimpan sebagai MP3: ' + saveMp3(ab), 'info');
                    }
                } catch (e) {
                    showToast('Mengunduh lewat tab baru...', 'info');
                    const a = document.createElement('a');
                    a.href = it.url;
                    a.download = `${base}.mp3`;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                }
        }
        const songFolderKey = (s) => String((s && s.title) || '').trim().toLowerCase() || 'tanpa judul';
        // Daftar masuk sudah urut terbaru dulu; folder ikut urutan lagu terbarunya.
        const groupSongsByTitle = (list) => {
            const map = new Map();
            (list || []).forEach(s => {
                const k = songFolderKey(s);
                if (!map.has(k)) map.set(k, { key: k, title: String((s && s.title) || '').trim() || 'Tanpa judul', items: [] });
                map.get(k).items.push(s);
            });
            return [...map.values()];
        };
        async function downloadSongsBulk(items, all) {
            const list = (items || []).filter(x => x && x.url);
            if (!list.length) { showToast('Tidak ada audio yang bisa diunduh.', 'error'); return; }
            if (list.length > 1) showToast(`Mengunduh ${list.length} lagu satu per satu...`, 'info');
            for (let i = 0; i < list.length; i++) {
                await downloadSongFile(list[i], all);
                if (i < list.length - 1) await new Promise(r => setTimeout(r, 800));
            }
        }
        const SelBox = ({ on, part, onClick }) => (
            <span role="checkbox" aria-checked={part ? 'mixed' : !!on} onClick={onClick}
                className={`w-5 h-5 shrink-0 rounded-md border flex items-center justify-center transition-colors cursor-pointer ${on || part ? 'bg-white border-white text-black' : 'border-white/25 bg-black/30 hover:border-white/50'}`}>
                {on ? <i className="fa-solid fa-check text-[10px]"></i> : part ? <i className="fa-solid fa-minus text-[10px]"></i> : null}
            </span>
        );
        function SelectBar({ count, total, busy, compact, onAll, onDownload, onDelete, onCancel }) {
            const all = total > 0 && count === total;
            return (
                <div className="flex items-center gap-1.5 p-1.5 rounded-xl bg-white/[0.06] border border-white/15 animate-fade-in">

                    <div className="flex-1"></div>
                    <button onClick={onDownload} disabled={!count || busy} title="Unduh lagu terpilih" aria-label="Unduh lagu terpilih" className="h-8 px-2.5 glass-btn rounded-lg text-[10px] font-semibold uppercase tracking-wider text-zinc-200 disabled:opacity-40 flex items-center gap-1.5">
                        {busy ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-download"></i>}{!compact && <span className="hidden sm:inline">Unduh</span>}
                    </button>
                    <button onClick={onDelete} disabled={!count || busy} title="Hapus lagu terpilih" aria-label="Hapus lagu terpilih" className="h-8 px-2.5 rounded-lg border border-red-500/30 text-red-400 hover:bg-red-500/15 hover:text-red-300 disabled:opacity-40 text-[10px] font-semibold uppercase tracking-wider flex items-center gap-1.5 transition-colors">
