        // --- Bersama: unduh lagu, pengelompokan folder per judul, pemilihan banyak lagu, pemutar ---
        async function downloadSongFile(it, all) {
                if (!it || !it.url) return;
                const vNo = songVariant(it, all);
                const base = String((it.title || 'Lagu') + (vNo ? ` - Versi ${vNo}` : '')).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Lagu';
                const saveRaw = (blob, ext) => {
                    const obj = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = obj; a.download = `${base}.${ext}`; a.style.display = 'none';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(obj), 60000);
                    return `${base}.${ext}`;
                };
                const saveMp3 = (bytes) => saveRaw(new Blob([bytes], { type: 'application/octet-stream' }), 'mp3');
                try {
                    const res = await fetch(it.url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const ab = await res.arrayBuffer();
                    if (!ab.byteLength) throw new Error('File kosong');
                    const kind = sniffAudio(new Uint8Array(ab, 0, Math.min(16, ab.byteLength)));
                    if (kind === 'mp3') {
                        showToast('Mengunduh: ' + saveMp3(ab), 'success');
                    } else {
                        const label = kind === 'unknown' ? 'non-MP3' : kind.toUpperCase();
                        let mp3 = null;
                        try {
                            showToast('File berformat ' + label + ', mengonversi...', 'info');
                            const AC = window.AudioContext || window.webkitAudioContext;
                            const ctx = new AC();
                            let abuf; try { abuf = await ctx.decodeAudioData(ab.slice(0)); } finally { try { ctx.close(); } catch (e) {} }
                            mp3 = await encodeMp3(abuf, 192, () => {});
                        } catch (ce) { console.error(ce); }
                        if (mp3) showToast('Mengunduh: ' + saveMp3(mp3), 'success');
                        else if (kind === 'unknown') throw new Error('Format file tidak dikenal');  
                        else showToast('Disimpan sebagai MP3: ' + saveMp3(ab), 'info');
                    }
                } catch (e) {
                    showToast('Mengunduh lewat tab baru...', 'info');
                    const a = document.createElement('a');
                    a.href = it.url;
                    a.download = `${base}.mp3`;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                }
        }
        const songFolderKey = (s) => String((s && s.title) || '').trim().toLowerCase() || 'tanpa judul';
        // Daftar masuk sudah urut terbaru dulu; folder ikut urutan lagu terbarunya.
        const groupSongsByTitle = (list) => {
            const map = new Map();
            (list || []).forEach(s => {
                const k = songFolderKey(s);
                if (!map.has(k)) map.set(k, { key: k, title: String((s && s.title) || '').trim() || 'Tanpa judul', items: [] });
                map.get(k).items.push(s);
            });
            return [...map.values()];
        };
        async function downloadSongsBulk(items, all) {
            const list = (items || []).filter(x => x && x.url);
            if (!list.length) { showToast('Tidak ada audio yang bisa diunduh.', 'error'); return; }
            if (list.length > 1) showToast(`Mengunduh ${list.length} lagu satu per satu...`, 'info');
            for (let i = 0; i < list.length; i++) {
                await downloadSongFile(list[i], all);
                if (i < list.length - 1) await new Promise(r => setTimeout(r, 800));
            }
        }
        const SelBox = ({ on, part, onClick }) => (
            <span role="checkbox" aria-checked={part ? 'mixed' : !!on} onClick={onClick}
                className={`w-5 h-5 shrink-0 rounded-md border flex items-center justify-center transition-colors cursor-pointer ${on || part ? 'bg-white border-white text-black' : 'border-white/25 bg-black/30 hover:border-white/50'}`}>
                {on ? <i className="fa-solid fa-check text-[10px]"></i> : part ? <i className="fa-solid fa-minus text-[10px]"></i> : null}
            </span>
        );
        function SelectBar({ count, total, busy, compact, onAll, onDownload, onDelete, onCancel }) {
            const all = total > 0 && count === total;
            return (
                <div className="flex items-center gap-1.5 p-1.5 rounded-xl bg-white/[0.06] border border-white/15 animate-fade-in">
                    <span className="text-[11px] font-semibold text-white pl-1.5 whitespace-nowrap">{count} dipilih</span>
                    <button onClick={onAll} disabled={busy} className="h-8 px-2 rounded-lg text-[10px] font-semibold uppercase tracking-wider text-zinc-400 hover:text-white disabled:opacity-40 whitespace-nowrap">{all ? 'Kosongkan' : 'Semua'}</button>
                    <div className="flex-1"></div>
                    <button onClick={onDownload} disabled={!count || busy} title="Unduh lagu terpilih" aria-label="Unduh lagu terpilih" className="h-8 px-2.5 glass-btn rounded-lg text-[10px] font-semibold uppercase tracking-wider text-zinc-200 disabled:opacity-40 flex items-center gap-1.5">
                        {busy ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-download"></i>}{!compact && <span className="hidden sm:inline">Unduh</span>}
                    </button>
                    <button onClick={onDelete} disabled={!count || busy} title="Hapus lagu terpilih" aria-label="Hapus lagu terpilih" className="h-8 px-2.5 rounded-lg border border-red-500/30 text-red-400 hover:bg-red-500/15 hover:text-red-300 disabled:opacity-40 text-[10px] font-semibold uppercase tracking-wider flex items-center gap-1.5 transition-colors">
                        <i className="fa-solid fa-trash-can"></i>{!compact && <span className="hidden sm:inline">Hapus</span>}
                    </button>
                    <button onClick={onCancel} disabled={busy} title="Batal" aria-label="Batal memilih" className="w-8 h-8 rounded-lg glass-btn text-zinc-400 hover:text-white disabled:opacity-40 flex items-center justify-center"><i className="fa-solid fa-xmark text-xs"></i></button>
                </div>
            );
        }
        // Pemutar lagu bergaya glass dengan tombol Download yang selalu terlihat.
        function SongPlayer({ src, audioRef, knownDuration, onPlay, onPause, onEnded, onSeeked, onDownload, dlBusy, dlDisabled }) {
            const ownRef = useRef(null);
            const ref = audioRef || ownRef;
            const barRef = useRef(null);
            const dragRef = useRef(false);
            const [playing, setPlaying] = useState(false);
            const [loading, setLoading] = useState(false);
            const [cur, setCur] = useState(0);
            const [dur, setDur] = useState(0);
            const total = dur || Number(knownDuration) || 0;
            const pct = total ? Math.min(100, Math.max(0, (cur / total) * 100)) : 0;
            const toggle = () => {
                const a = ref.current;
                if (!a) return;
                if (a.paused) {
                    document.querySelectorAll('audio').forEach(el => { if (el !== a && !el.paused) { try { el.pause(); } catch (e) {} } });
                    setLoading(true);
                    const p = a.play();
                    if (p && p.catch) p.catch(() => { setLoading(false); showToast('Audio tidak dapat diputar.', 'error'); });
                } else a.pause();
            };
            const seekAt = (x) => {
                const a = ref.current, el = barRef.current;
                if (!a || !el || !total) return;
                const r = el.getBoundingClientRect();
                const p = Math.min(1, Math.max(0, (x - r.left) / r.width));
                try { a.currentTime = p * total; } catch (e) {}
                setCur(p * total);
            };
            const setD = (e) => { const d = e.currentTarget.duration; if (isFinite(d) && d > 0) setDur(d); };
            return (
                <div className="flex items-center gap-3 p-2 pr-2.5 rounded-xl bg-black/40 border border-white/10 shadow-inner">
                    <audio ref={ref} preload="none" src={src} className="hidden"
                        onPlay={(e) => { setPlaying(true); if (onPlay) onPlay(e); }}
                        onPlaying={() => setLoading(false)}
                        onWaiting={() => setLoading(true)}
                        onPause={(e) => { setPlaying(false); setLoading(false); if (onPause) onPause(e); }}
                        onEnded={(e) => { setPlaying(false); setLoading(false); if (onEnded) onEnded(e); }}
                        onLoadedMetadata={setD} onDurationChange={setD}
                        onTimeUpdate={(e) => { if (!dragRef.current) setCur(e.currentTarget.currentTime); }}
                        onSeeked={(e) => { setCur(e.currentTarget.currentTime); if (onSeeked) onSeeked(e); }}
                        onError={() => { setLoading(false); setPlaying(false); }}></audio>
                    <button type="button" onClick={toggle} aria-label={playing ? 'Jeda' : 'Putar'} className="w-10 h-10 shrink-0 rounded-full bg-white text-black flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition-transform">
                        <i className={`fa-solid ${playing && loading ? 'fa-circle-notch fa-spin' : playing ? 'fa-pause' : 'fa-play ml-0.5'} text-sm`}></i>
                    </button>
                    <div className="flex-1 min-w-0 flex flex-col gap-1">
                        <div ref={barRef} role="slider" aria-label="Posisi lagu" aria-valuemin={0} aria-valuemax={Math.round(total)} aria-valuenow={Math.round(cur)}
                            className="relative h-4 flex items-center cursor-pointer touch-none group/bar"
                            onPointerDown={(e) => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {} dragRef.current = true; seekAt(e.clientX); }}
                            onPointerMove={(e) => { if (dragRef.current) seekAt(e.clientX); }}
                            onPointerUp={() => { dragRef.current = false; }}
                            onPointerCancel={() => { dragRef.current = false; }}>
                            <div className="w-full h-1 rounded-full bg-white/15 overflow-hidden"><div className="h-full bg-white rounded-full" style={{ width: pct + '%' }}></div></div>
                            <span className={`absolute top-1/2 w-3 h-3 -mt-1.5 -ml-1.5 rounded-full bg-white shadow-[0_0_0_3px_rgba(0,0,0,0.45)] transition-opacity ${playing ? 'opacity-100' : 'opacity-0 group-hover/bar:opacity-100'}`} style={{ left: pct + '%' }}></span>
                        </div>
                        <div className="flex justify-between text-[10px] font-mono text-zinc-500 leading-none">
                            <span className={playing ? 'text-zinc-300' : ''}>{formatTime(cur)}</span>
                            <span>{total ? formatTime(total) : '--:--'}</span>
                        </div>
                    </div>
                    {onDownload && (
                        <button type="button" onClick={onDownload} disabled={dlDisabled || dlBusy} title="Download MP3" aria-label="Download lagu" className="h-10 px-3 sm:px-3.5 shrink-0 rounded-lg glass-btn text-zinc-200 hover:text-white disabled:opacity-50 flex items-center justify-center gap-2 text-[10px] font-semibold uppercase tracking-wider">
                            {dlBusy ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-download"></i>}<span className="hidden sm:inline">Download</span>
                        </button>
                    )}
                </div>
            );
        }

        // --- Durasi: menerima lagu + lirik bertimestamp dari Music Labs (belum ada pemecahan scene) ---
        const KIE_TS_V1 = 'https://api.kie.ai/api/v1/generate/get-timestamped-lyrics';
        const KIE_TS_MARKET = 'https://api.kie.ai/api/v1/jobs/createTask';
        const KIE_JOB_INFO = 'https://api.kie.ai/api/v1/jobs/recordInfo';
        const TS_CACHE = 'raven_ts_v1';
        const TS_CACHE_MAX = 40;
        const tsSleep = (ms) => new Promise(r => setTimeout(r, ms));
        const tsIsNum = (v) => v !== null && v !== '' && v !== undefined && isFinite(Number(v));
        const loadTsCache = () => { try { const c = JSON.parse(localStorage.getItem(TS_CACHE) || '{}'); return c && typeof c === 'object' ? c : {}; } catch (e) { return {}; } };
        const saveTsEntry = (id, entry) => {
            const c = { ...loadTsCache(), [id]: entry };
            const ids = Object.keys(c).sort((a, b) => (c[b].fetchedAt || 0) - (c[a].fetchedAt || 0));
            ids.slice(TS_CACHE_MAX).forEach(k => delete c[k]);
            try { localStorage.setItem(TS_CACHE, JSON.stringify(c)); } catch (e) {}
        };
        const fmtTs = (s) => {
            if (!tsIsNum(s)) return '--:--.-';
            const v = Math.max(0, Number(s));
            return `${String(Math.floor(v / 60)).padStart(2, '0')}:${(v % 60).toFixed(1).padStart(4, '0')}`;
        };

        async function tsPost(url, key, body, ms = 60000) {
            const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
            try {
                const r = await fetch(url, { method: 'POST', signal: ctl.signal, headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                return { r, j: await r.json().catch(() => ({})) };
            } finally { clearTimeout(tm); }
        }
        const tsAuthFail = (r, j) => [401, 402, 403].includes(r.status) || [401, 402, 403].includes(Number(j && j.code));
        const tsErr = (r, j) => Object.assign(new Error((j && (j.msg || j.message)) || ('HTTP ' + r.status)), { auth: tsAuthFail(r, j) });
        function tsPick(o, depth = 0) {
            if (!o || typeof o !== 'object' || depth > 5) return null;
            if (Array.isArray(o.alignedWords)) return { words: o.alignedWords, cer: o.hootCer };
            if (Array.isArray(o.aligned_words)) return { words: o.aligned_words, cer: o.hoot_cer ?? o.hootCer };
            for (const k of ['data', 'resultObject', 'response', 'result']) { const x = tsPick(o[k], depth + 1); if (x) return x; }
            return null;
        }
        async function tsV1(song, key) {
            const { r, j } = await tsPost(KIE_TS_V1, key, { taskId: song.taskId, audioId: song.audioId });
            if (!r.ok || Number(j.code) !== 200) throw tsErr(r, j);
            const a = tsPick(j.data);
            if (!a) throw new Error('respons tanpa alignedWords');
            return a;
        }
        async function tsMarket(song, key) {
            const { r, j } = await tsPost(KIE_TS_MARKET, key, { model: 'ai-music-api/timeStamped-lyrics', input: { task_id: song.taskId, audio_id: song.audioId } });
            if (!r.ok || Number(j.code) !== 200) throw tsErr(r, j);
            const d = j.data || {};
            if (d.code != null && Number(d.code) !== 200) throw new Error(d.msg || ('kode ' + d.code));
            const a = tsPick(d);
            if (a) return a;
            if (!d.taskId) throw new Error('respons tanpa data lirik');
            for (let i = 0; i < 40; i++) {
                await tsSleep(3000);
                const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);
                let jj = {};
                try { const rr = await fetch(`${KIE_JOB_INFO}?taskId=${encodeURIComponent(d.taskId)}`, { headers: { 'Authorization': `Bearer ${key}` }, signal: ctl.signal }); jj = await rr.json().catch(() => ({})); }
                catch (e) { continue; } finally { clearTimeout(tm); }
                if (Number(jj.code) !== 200 || !jj.data) continue;
                if (jj.data.state === 'success') {
                    let res = jj.data.response;
                    if (!res && jj.data.resultJson) { try { res = JSON.parse(jj.data.resultJson); } catch (e) {} }
                    const x = tsPick(res);
                    if (x) return x;
                    throw new Error('hasil tanpa alignedWords');
                }
                if (jj.data.state === 'fail') throw new Error(jj.data.failMsg || 'tugas gagal');
            }
            throw new Error('terlalu lama menunggu hasil');
        }
        // key aktif dulu; key yang ditolak (401/402/403) dilewati ke key berikutnya
        async function fetchTimestamps(song, onLog) {
            const keys = ravenKieList();
            if (!keys.length) throw Object.assign(new Error('API key Kie belum diisi.'), { noKey: true });
            let last = null;
            for (const key of keys) {
                for (const [name, fn] of [['v1', tsV1], ['market', tsMarket]]) {
                    try { return await fn(song, key); }
                    catch (e) {
                        last = e;
                        onLog(`Kie ${name} · key …${key.slice(-4)}: ${e.name === 'AbortError' ? 'timeout' : e.message}`);
                        if (e.auth) break;
                    }
                }
            }
            throw last || new Error('Gagal mengambil data');
        }

        // Normalisasi bentuk data (camelCase / snake_case) tanpa mengubah isi.
        const tsWord = (w, i) => {
            const s = w.startS ?? w.start_s ?? w.start, e = w.endS ?? w.end_s ?? w.end;
            const ok = w.success !== false && tsIsNum(s) && tsIsNum(e);
            return { i, text: String(w.word ?? w.text ?? ''), start: tsIsNum(s) ? Number(s) : null, end: tsIsNum(e) ? Number(e) : null, ok };
        };
        // Tampilan baca: memakai baris baru & tag [Bagian] yang sudah ada di data Kie. Tidak ada pemecahan scene.
        function tsReadView(words) {
            const toks = (words || []).map(tsWord);
            const out = [];
            let cur = null;
            const flush = () => {
                if (cur && cur.toks.some(t => /[\p{L}\p{N}]/u.test(t.text))) {
                    const okT = cur.toks.filter(t => t.ok);
                    cur.start = okT.length ? okT[0].start : null;
                    cur.end = okT.length ? okT[okT.length - 1].end : null;
                    out.push(cur);
                }
                cur = null;
            };
            toks.forEach(t => {
                t.text.replace(/\r/g, '').split(/(\[[^\]\n]*\]|\n)/).forEach(part => {
                    if (!part) return;
                    if (part === '\n') { flush(); return; }
                    if (/^\[[^\]\n]*\]$/.test(part)) { flush(); out.push({ type: 'section', label: part.slice(1, -1).trim() }); return; }
                    if (!cur) cur = { type: 'line', toks: [] };
                    cur.toks.push({ ...t, text: part });
                });
            });
            flush();
            const lines = out.filter(x => x.type === 'line');
            const okCount = toks.filter(t => t.ok).length;
            const okAll = toks.filter(t => t.ok);
            return {
                items: out, lines, toks,
                stats: { words: toks.length, lines: lines.length, okPct: toks.length ? Math.round(okCount / toks.length * 100) : 0, first: okAll.length ? okAll[0].start : null, last: okAll.length ? okAll[okAll.length - 1].end : null }
            };
        }

        function DurasiView({ lib, setLib, active, onGoMusic }) {
            const all = (lib && Array.isArray(lib.covers)) ? lib.covers : [];
            const songs = all.map((x, idx) => ({ x, idx })).filter(o => o.x && o.x.id && o.x.taskId && o.x.audioId)
                .sort((a, b) => (b.x.date || 0) - (a.x.date || 0) || a.idx - b.idx).map(o => o.x);
            const legacy = all.filter(x => x && x.id).length - songs.length;
            const [selId, setSelId] = useState(() => { try { return localStorage.getItem('raven_dur_sel') || ''; } catch (e) { return ''; } });
            const [cache, setCache] = useState(loadTsCache);
            const [busy, setBusy] = useState(false);
            const [log, setLog] = useState([]);
            const [err, setErr] = useState('');
            const [view, setView] = useState('lirik');
            const [pickOpen, setPickOpen] = useState(false);
            const [t, setT] = useState(-1);
            const audioRef = useRef(null);
            const lyricRef = useRef(null);
            const rafRef = useRef(0);
            const [openF, setOpenF] = useState(() => new Set());
            const [selMode, setSelMode] = useState(false);
            const [selIds, setSelIds] = useState(() => new Set());
            const [bulkBusy, setBulkBusy] = useState(false);
            const [dlBusy, setDlBusy] = useState('');

            const select = (id) => {
                setSelId(id); setErr(''); setLog([]); setPickOpen(false); setT(-1);
                try { localStorage.setItem('raven_dur_sel', id); } catch (e) {}
                if (audioRef.current) audioRef.current.pause();
            };
            const newest = songs[0] ? songs[0].id : '';
            useEffect(() => {
                if (!newest) return;
                let seen = '';
                try { seen = localStorage.getItem('raven_dur_seen') || ''; } catch (e) {}
                if (newest !== seen) { try { localStorage.setItem('raven_dur_seen', newest); } catch (e) {} select(newest); }
                else if (!songs.some(s => s.id === selId)) select(newest);
            }, [newest, songs.length]);
            useEffect(() => { if (!active && audioRef.current) audioRef.current.pause(); }, [active]);
            useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

            const song = songs.find(s => s.id === selId) || null;
            const entry = song ? cache[song.id] : null;
            const data = React.useMemo(() => entry ? tsReadView(entry.words) : null, [entry]);
            const vNo = song ? songVariant(song, all) : 0;
            const songName = (s) => (s.title || 'Tanpa judul');

            // folder per judul + pemilihan banyak lagu
            const folders = groupSongsByTitle(songs);
            const curFolder = song ? songFolderKey(song) : '';
            useEffect(() => { if (curFolder) setOpenF(o => o.has(curFolder) ? o : new Set([...o, curFolder])); }, [curFolder, selId]);
            useEffect(() => { setSelIds(p => { const ids = new Set(songs.map(x => x.id)); const n = new Set([...p].filter(id => ids.has(id))); return n.size === p.size ? p : n; }); }, [songs.length]);
            const toggleF = (k) => setOpenF(o => { const n = new Set(o); if (n.has(k)) n.delete(k); else n.add(k); return n; });
            const toggleSel = (id) => setSelIds(p => { const n = new Set(p); if (n.has(id)) n.delete(id); else n.add(id); return n; });
            const selFolder = (f) => setSelIds(p => { const n = new Set(p); const allOn = f.items.every(x => n.has(x.id)); f.items.forEach(x => { if (allOn) n.delete(x.id); else n.add(x.id); }); return n; });
            const selAll = () => setSelIds(p => p.size === songs.length ? new Set() : new Set(songs.map(x => x.id)));
            const exitSel = () => { setSelMode(false); setSelIds(new Set()); };
            const dlOne = async (s) => { if (dlBusy || !s || !s.url) return; setDlBusy(s.id); try { await downloadSongFile(s, all); } finally { setDlBusy(''); } };
            const bulkDownload = async () => {
                if (bulkBusy || !selIds.size) return;
                setBulkBusy(true);
                try { await downloadSongsBulk(songs.filter(x => selIds.has(x.id)), all); } finally { setBulkBusy(false); }
            };
            const bulkDelete = () => {
                if (bulkBusy || !selIds.size) return;
                if (!window.confirm(`Hapus ${selIds.size} lagu terpilih dari library?`)) return;
                const ids = new Set(selIds);
                if (song && ids.has(song.id) && audioRef.current) audioRef.current.pause();
                setLib(l => ({ ...l, covers: l.covers.filter(x => !ids.has(x.id)) }));
                showToast(`${ids.size} lagu dihapus.`, 'success');
                exitSel();
            };

            // posisi putar -> baris & kata yang sedang dinyanyikan
            const tick = () => { const a = audioRef.current; if (a) setT(a.currentTime); rafRef.current = requestAnimationFrame(tick); };
            const onPlay = () => { cancelAnimationFrame(rafRef.current); rafRef.current = requestAnimationFrame(tick); };
            const onPause = () => { cancelAnimationFrame(rafRef.current); const a = audioRef.current; if (a) setT(a.currentTime); };
            let curLine = -1;
            if (data && t >= 0) data.lines.forEach((l, i) => { if (l.start != null && l.start <= t + 0.05) curLine = i; });
            useEffect(() => {
                if (curLine < 0 || !lyricRef.current || view !== 'lirik') return;
                const el = lyricRef.current.querySelector(`[data-line="${curLine}"]`);
                if (el && audioRef.current && !audioRef.current.paused) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }, [curLine]);
            const seek = (s) => {
                const a = audioRef.current;
                if (!a || s == null) return;
                a.currentTime = Math.max(0, s - 0.05);
                setT(a.currentTime);
                a.play().catch(() => {});
            };

            const getData = async () => {
                if (!song || busy) return;
                ravenApi.start('ts'); let apiOk = false;
                setBusy(true); setErr(''); setLog([`Meminta lirik & timestamp · task ${song.taskId} · audio ${song.audioId}`]);
                try {
                    const a = await fetchTimestamps(song, (m) => setLog(l => [...l, m]));
                    saveTsEntry(song.id, { fetchedAt: Date.now(), cer: a.cer ?? null, words: a.words });
                    setCache(loadTsCache());
                    setLog(l => [...l, `Diterima: ${a.words.length} token kata.`]);
                    showToast(a.words.length ? `Timestamp diterima: ${a.words.length} kata.` : 'Data diterima, tetapi tanpa lirik.', 'success');
                    apiOk = true;
                } catch (e) {
                    if (e.noKey) { openRavenApi(); setErr('API key Kie belum diisi. Tambahkan lewat Input API.'); }
                    else setErr(`Gagal mengambil data dari Kie: ${e.name === 'AbortError' ? 'timeout' : e.message}. Data lagu di Kie biasanya hanya tersimpan sekitar 14 hari.`);
                } finally { setBusy(false); ravenApi.end('ts', apiOk); }
            };

            const exportPayload = () => ({
                app: 'Raven Studio', type: 'timestamped-lyrics', exportedAt: new Date().toISOString(),
                song: { title: song.title || '', variant: vNo || null, kind: song.kind || 'cover', duration: song.duration || null, taskId: song.taskId, audioId: song.audioId, url: song.url || '' },
                fetchedAt: entry ? new Date(entry.fetchedAt).toISOString() : null, hootCer: entry ? entry.cer : null,
                alignedWords: entry ? entry.words : []
            });
            const downloadJson = () => {
                const name = `${String((song.title || 'Lagu') + (vNo ? ` - Versi ${vNo}` : '')).replace(/[\\/:*?"<>|]+/g, ' ').trim()} - timestamp.json`;
                const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
                const u = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(u), 30000);
                showToast('Mengunduh: ' + name, 'success');
            };
            const copyJson = async () => {
                try { await navigator.clipboard.writeText(JSON.stringify(exportPayload(), null, 2)); showToast('Data JSON disalin.', 'success'); }
                catch (e) { showToast('Gagal menyalin. Pakai tombol Unduh.', 'error'); }
            };

            const fmtDate = (ms) => { try { return ms ? new Date(ms).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; } catch (e) { return ''; } };
            const VBadge = VerTag;

            if (!songs.length) {
                return (
                    <div className="flex-1 min-h-0 overflow-y-auto hide-scroll p-4 sm:p-8 flex items-center justify-center">
                        <div className="glass-panel rounded-2xl p-8 max-w-md w-full text-center flex flex-col items-center gap-4 shadow-xl">
                            <div className="w-14 h-14 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xl text-zinc-300"><i className="fa-solid fa-wave-square"></i></div>
                            <div>
                                <h2 className="text-base font-bold text-white mb-1.5">Belum ada lagu dari Music Labs</h2>
                                <p className="text-xs text-zinc-400 leading-relaxed">Buat lagu lewat Song Generator atau Cover. Setiap hasil otomatis muncul di sini lengkap dengan label Versi 1 / Versi 2.</p>
                                {legacy > 0 && <p className="text-[11px] text-zinc-500 leading-relaxed mt-3">{legacy} lagu lama di pustaka dibuat sebelum pembaruan, jadi belum menyimpan ID dari Kie dan tidak bisa dipakai.</p>}
                            </div>
                            <button onClick={onGoMusic} className="h-11 px-5 rounded-xl bg-white text-black text-xs font-bold uppercase tracking-wider hover:bg-zinc-200 transition-colors">Buka Music Labs</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 min-h-0 overflow-y-auto lg:overflow-hidden hide-scroll">
                    <div className="max-w-6xl mx-auto w-full p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-4 lg:gap-6 lg:h-full">
                        {/* Daftar lagu: folder per judul, berisi Versi 1 / Versi 2 */}
                        <aside className="lg:w-80 shrink-0 glass-panel rounded-2xl p-4 flex flex-col gap-3 lg:min-h-0 shadow-xl">
                            <div className="flex items-center justify-between gap-3">
                                <h2 className="text-sm font-bold text-white flex items-center gap-2.5">
                                    <span className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center"><i className="fa-solid fa-music text-zinc-300 text-[11px]"></i></span>
                                    Lagu Music Labs
                                </h2>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] font-mono text-zinc-500">{songs.length}</span>
                                    {!selMode && <button onClick={() => { setSelMode(true); setPickOpen(true); }} className="h-9 sm:h-7 px-3 sm:px-2.5 glass-btn rounded-md text-[10px] font-semibold uppercase tracking-wider text-zinc-300 flex items-center gap-1.5"><i className="fa-regular fa-square-check"></i>Pilih</button>}
                                </div>
                            </div>
                            {selMode && <SelectBar compact count={selIds.size} total={songs.length} busy={bulkBusy} onAll={selAll} onDownload={bulkDownload} onDelete={bulkDelete} onCancel={exitSel} />}
                            {song && (
                                <button onClick={() => setPickOpen(true)} className={`${pickOpen ? 'hidden' : 'flex lg:hidden'} w-full text-left items-center gap-3 p-2.5 rounded-xl border bg-white/10 border-white/30`}>
                                    <SongArt src={song.image} title={song.title} size={44} radius={10} />
                                    <div className="min-w-0 flex-1 flex items-center gap-2">
                                        <span className="text-xs font-semibold text-white truncate">{songName(song)}</span>
                                        <VBadge n={vNo} />
                                    </div>
                                    {songs.length > 1 && <i className="fa-solid fa-chevron-down text-[10px] text-zinc-500 shrink-0"></i>}
                                </button>
                            )}
                            <div className={`${pickOpen ? 'flex' : 'hidden lg:flex'} flex-col gap-2 lg:overflow-y-auto hide-scroll lg:min-h-0 lg:-mx-1 lg:px-1`}>
                                {folders.map(f => {
                                    const open = openF.has(f.key);
                                    const cover = (f.items.find(x => x.image) || {}).image;
                                    const nSel = f.items.filter(x => selIds.has(x.id)).length;
                                    const hasCur = f.items.some(x => x.id === selId);
                                    return (
                                        <div key={f.key} className={`rounded-xl border transition-colors ${hasCur && !selMode ? 'bg-white/[0.04] border-white/20' : 'glass-inner border-white/5'}`}>
                                            <div role="button" tabIndex={0} aria-expanded={open} onClick={() => toggleF(f.key)} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleF(f.key); } }} className="flex items-center gap-3 p-2.5 cursor-pointer select-none">
                                                {selMode && <SelBox on={nSel === f.items.length} part={nSel > 0 && nSel < f.items.length} onClick={(e) => { e.stopPropagation(); selFolder(f); }} />}
                                                <SongArt src={cover} title={f.title} size={44} radius={10} />
                                                <div className="min-w-0 flex-1">
                                                    <div className="text-xs font-semibold text-white truncate">{f.title}</div>
                                                    <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-wider truncate mt-1"><i className="fa-regular fa-folder mr-1.5"></i>{f.items.length} versi</div>
                                                </div>
                                                <i className={`fa-solid fa-chevron-down text-[10px] text-zinc-500 shrink-0 transition-transform ${open ? 'rotate-180' : ''}`}></i>
                                            </div>
                                            {open && (
                                                <div className="flex flex-col gap-1 px-2 pb-2">
                                                    {f.items.map(s => {
                                                        const sel = s.id === selId;
                                                        const v = songVariant(s, all);
                                                        const got = !!cache[s.id];
                                                        const chk = selIds.has(s.id);
                                                        return (
                                                            <button key={s.id} onClick={() => selMode ? toggleSel(s.id) : select(s.id)}
                                                                className={`w-full text-left flex items-center gap-2.5 px-2 py-1.5 rounded-lg border transition-colors ${(sel && !selMode) || chk ? 'bg-white/10 border-white/25' : 'border-transparent hover:bg-white/5'}`}>
                                                                {selMode && <SelBox on={chk} />}
                                                                <SongArt src={s.image} title={s.title} size={32} radius={8} />
                                                                <VerTag n={v || 1} />
                                                                <span className="text-[10px] font-mono text-zinc-500 truncate flex-1 min-w-0">{fmtDate(s.date)}</span>
                                                                {got ? <i className="fa-solid fa-circle-check text-green-400 text-xs shrink-0" title="Timestamp sudah diterima"></i> : null}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            {songs.length > 1 && !selMode && <button onClick={() => setPickOpen(o => !o)} className="lg:hidden h-9 glass-btn rounded-lg text-[10px] font-semibold uppercase tracking-wider text-zinc-400">{pickOpen ? 'Tutup daftar' : `Pilih lagu lain (${songs.length - 1})`}</button>}
                            {legacy > 0 && <p className="text-[10px] leading-relaxed text-zinc-600">{legacy} lagu lama tidak ditampilkan karena dibuat sebelum pembaruan (belum menyimpan ID dari Kie).</p>}
                        </aside>

                        {/* Detail lagu terpilih */}
                        {song && (
                            <section className="flex-1 min-w-0 flex flex-col gap-4 lg:min-h-0 lg:overflow-y-auto hide-scroll pb-4">
                                <div className="glass-panel rounded-2xl p-4 sm:p-5 flex flex-col gap-4 shadow-xl">
                                    <div className="flex items-center gap-4">
                                        <SongArt src={song.image} title={song.title} size={72} radius={14} />
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center gap-2 min-w-0 flex-wrap">
                                                <h2 className="text-base sm:text-lg font-bold text-white truncate max-w-full">{songName(song)}</h2>
                                                <VBadge n={vNo} big />
                                            </div>
                                            <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-wider mt-1.5">{[SONG_KIND_LABEL[song.kind || 'cover'], song.duration ? formatTime(song.duration) : '', fmtDate(song.date)].filter(Boolean).join(' · ')}</div>
                                            {song.style ? <div className="text-[11px] text-zinc-400 mt-1.5 line-clamp-1">{song.style}</div> : null}
                                        </div>
                                    </div>
                                    {song.url ? <SongPlayer key={song.id} src={song.url} audioRef={audioRef} knownDuration={song.duration} onPlay={onPlay} onPause={onPause} onEnded={onPause} onSeeked={() => { const a = audioRef.current; if (a) setT(a.currentTime); }} onDownload={() => dlOne(song)} dlBusy={dlBusy === song.id} />
                                        : <div className="text-[11px] text-zinc-500">Audio lagu tidak tersedia.</div>}
                                    <div className="flex flex-col sm:flex-row gap-2">

        }

        // ===== STORYBOARD · pembantu umum =====
        const SB_FPS = 24;

        const sbFrameMs = (ms) => Math.round(Math.round(Number(ms) * SB_FPS / 1000) * 1000 / SB_FPS);

        const sbSecToMs = (s) => Math.round(Math.round(Number(s) * SB_FPS) * 1000 / SB_FPS);

        const sbUid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

        const sbPad = (n, w = 2) => String(n).padStart(w, '0');

        const sbClone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));

        const sbFmtMs = (ms) => {
            const v = Math.max(0, Math.round(ms || 0));

        const sbFmtDur = (ms) => (Math.round((ms || 0) / 100) / 10).toFixed(1).replace('.', ',') + ' dtk';

        const SB_KIND_LABEL = { intro: 'Intro', verse: 'Verse', prechorus: 'Pre-chorus', chorus: 'Chorus', bridge: 'Bridge', outro: 'Outro', gap: 'Jeda instrumental' };

        const sbNormTxt = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

        function sbLev(a, b) {
            if (a === b) return 0;
            const m = a.length, n = b.length;
            if (!m) return n; if (!n) return m;
            let prev = new Array(n + 1); for (let j = 0; j <= n; j++) prev[j] = j;
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                prev = cur;
            }
            return prev[n];
        }

        const sbSim = (a, b) => { a = sbNormTxt(a); b = sbNormTxt(b); const L = Math.max(a.length, b.length); return L ? 1 - sbLev(a, b) / L : 1; };

        const SB_HAS_LETTER = /[\p{L}\p{N}]/u;

        const sbJoinRaw = (ws) => ws.map(w => String(w.raw != null ? w.raw : w.text).replace(/\[[^\]\n]*\]/g, ' ').replace(/\n/g, ' ')).join('').replace(/\s+/g, ' ').trim();

        function sbDownloadText(name, text) {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const u = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = u; a.download = name; a.style.display = 'none';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(u), 30000);
        }

        let sbPersistAsked = false;

        const sbAskPersist = () => {
            if (sbPersistAsked) return; sbPersistAsked = true;
            try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
        };

        const sbSafeName = (s) => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Proyek';

        function sbDownload(name, obj) {
            const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
            const u = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = u; a.download = name; a.style.display = 'none';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(u), 30000);
        }

        const sbReadFile = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.onerror = () => rej(r.error || new Error('Gagal membaca file')); r.readAsText(file); });

        async function sbCopy(text) {
            let ok = false;
            try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
            if (!ok) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0'; ta.style.fontSize = '16px';
                    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
                    ok = document.execCommand('copy'); ta.remove();
                } catch (e) { ok = false; }
            }
            if (typeof showToast === 'function') showToast(ok ? 'Tersalin' : 'Gagal menyalin. Tekan lama teks lalu salin manual.', ok ? 'success' : 'error');
            return ok;
        }

        function sbParseTsFile(text) {
            let j;
            try { j = JSON.parse(text); } catch (e) { throw new Error('File bukan JSON yang valid.'); }
            if (!j || typeof j !== 'object') throw new Error('Isi file tidak dikenali.');
            if (j.type && j.type !== 'timestamped-lyrics') throw new Error('Ini bukan file timestamp dari tab Lirik (type: ' + j.type + ').');
            const words = Array.isArray(j.alignedWords) ? j.alignedWords : Array.isArray(j.aligned_words) ? j.aligned_words : null;
            if (!words || !words.length) throw new Error('File tidak berisi alignedWords. Pakai file "… - timestamp.json" dari tab Lirik.');
            return { song: j.song || {}, words, cer: j.hootCer ?? j.hoot_cer ?? null };
        }

        function sbNormWords(raw) {
            const out = (raw || []).map((w, i) => {
                const t = tsWord(w, i);
                const text = t.text.replace(/\[[^\]\n]*\]/g, ' ').replace(/\s+/g, ' ').trim();
                return { i, text, raw: t.text, startMs: t.ok ? sbSecToMs(t.start) : null, endMs: t.ok ? sbSecToMs(t.end) : null, ok: t.ok, interp: false, lw: SB_HAS_LETTER.test(text) };
            });
            let i = 0;
            while (i < out.length) {
                if (out[i].ok) { i++; continue; }
                let j = i; while (j < out.length && !out[j].ok) j++;
                const a = i > 0 ? out[i - 1].endMs : 0;
                const nx = j < out.length ? out[j].startMs : null;
                const n = j - i;
                const b = Math.max(a, nx != null ? nx : a + n * 300);
                for (let k = 0; k < n; k++) {
                    const w = out[i + k];
                    w.startMs = sbFrameMs(a + (b - a) * k / n); w.endMs = sbFrameMs(a + (b - a) * (k + 1) / n); w.interp = true;
                }
                i = j;
            }
            out.forEach(w => { if (w.endMs < w.startMs) w.endMs = w.startMs; });
            return out;
        }

        function sbKindOf(label) {
            const l = String(label || '').toLowerCase();
            if (/pre[\s-]*(chorus|reff?|refrain)/.test(l)) return 'prechorus';
            if (/intro/.test(l)) return 'intro';
            if (/chorus|reff?\b|refrain|^ref/.test(l)) return 'chorus';
            if (/bridge/.test(l)) return 'bridge';
            if (/outro|ending|penutup/.test(l)) return 'outro';
            return 'verse';
        }

        function sbStructure(words, durationMs) {
            // urutan event: tag, paragraf (baris kosong), baris
            const ev = []; let line = null, nl = 0;
            const endLine = () => { if (line && line.w.length) ev.push({ t: 'line', w: line.w }); line = null; };
            words.forEach(w => {
                String(w.raw || '').replace(/\r/g, '').split(/(\[[^\]\n]*\]|\n)/).forEach(part => {
                    if (!part) return;
                    if (part === '\n') { endLine(); nl++; if (nl === 2) ev.push({ t: 'para' }); return; }
                    if (/^\[[^\]\n]*\]$/.test(part)) { endLine(); ev.push({ t: 'tag', label: part.slice(1, -1).trim() }); nl = 0; return; }
                    if (!SB_HAS_LETTER.test(part)) return;
                    nl = 0;
                    if (!line) line = { w: [] };
                    if (!line.w.includes(w.i)) line.w.push(w.i);
                });
            });
            endLine();
            const tagged = ev.some(e => e.t === 'tag');
            const groups = []; let g = null;
            const newGroup = (label) => { g = { label, tagged: label != null, lines: [] }; groups.push(g); };
            ev.forEach(e => {
                if (e.t === 'tag') newGroup(e.label);
                else if (e.t === 'para') { if (!tagged) g = null; }
                else { if (!g) newGroup(null); g.lines.push(e.w); }
            });
            const secs = [], lines = [];
            groups.filter(x => x.lines.length).forEach(x => {
                const sec = { id: 'SEC' + sbPad(secs.length + 1), label: x.label || '', tagged: x.tagged, kind: x.tagged ? sbKindOf(x.label) : null, instance: 0, startMs: 0, endMs: 0, lineIds: [], text: '' };
                x.lines.forEach(wi => {
                    const ws = wi.map(i => words[i]).filter(w => w.lw);
                    if (!ws.length) return;
                    const ln = { id: 'L' + sbPad(lines.length + 1), sectionId: sec.id, wordRange: [ws[0].i, ws[ws.length - 1].i], text: sbJoinRaw(ws), startMs: Math.min(...ws.map(w => w.startMs)), endMs: Math.max(...ws.map(w => w.endMs)) };
                    lines.push(ln); sec.lineIds.push(ln.id);
                });
                if (!sec.lineIds.length) return;
                const ls = sec.lineIds.map(id => lines.find(l => l.id === id));
                sec.startMs = ls[0].startMs; sec.endMs = ls[ls.length - 1].endMs; sec.text = ls.map(l => l.text).join(' / ');
                secs.push(sec);
            });
            // chorus tanpa label: mirip >= 0,8 dengan chorus berlabel, atau (tanpa chorus sama sekali) paragraf yang paling sering berulang
            const unl = secs.filter(s => !s.kind);
            const choruses = secs.filter(s => s.kind === 'chorus');
            if (choruses.length) unl.forEach(s => { if (choruses.some(c => sbSim(c.text, s.text) >= 0.8)) s.kind = 'chorus'; });
            else if (unl.length > 1) {
                const cl = [];
                unl.forEach(s => { const c = cl.find(c => sbSim(c[0].text, s.text) >= 0.8); if (c) c.push(s); else cl.push([s]); });
                const best = cl.filter(c => c.length >= 2).sort((a, b) => b.length - a.length || b[0].text.length - a[0].text.length)[0];
                if (best) best.forEach(s => { s.kind = 'chorus'; });
            }
            const cnt = {};
            secs.forEach(s => {
                if (!s.kind) s.kind = 'verse';
                cnt[s.kind] = (cnt[s.kind] || 0) + 1; s.instance = cnt[s.kind];
                if (!s.label) s.label = `${SB_KIND_LABEL[s.kind]} ${s.instance}`;
            });
            // instrumental
            const lw = words.filter(w => w.lw);
            const inst = [];
            if (lw.length) {
                const first = Math.min(...lw.map(w => w.startMs)), last = Math.max(...lw.map(w => w.endMs));
                if (first > 0) inst.push({ kind: 'intro', startMs: 0, endMs: first });
                for (let k = 1; k < lines.length; k++) {
                    if (lines[k].startMs - lines[k - 1].endMs > 1500) inst.push({ kind: 'gap', startMs: lines[k - 1].endMs, endMs: lines[k].startMs, afterLine: lines[k - 1].id, beforeLine: lines[k].id });
                }
                if (durationMs > last) inst.push({ kind: 'outro', startMs: last, endMs: durationMs });
            }
            inst.sort((a, b) => a.startMs - b.startMs).forEach((x, k) => { x.id = 'I' + sbPad(k + 1); });
            return { sections: secs, lines, instrumentals: inst };
        }

        const sbCodeFromTitle = (t) => (String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').split(/\s+/).filter(Boolean)[0] || 'LAGU').slice(0, 8);

        const sbAIHooks = { ask: null };

        if (typeof window !== 'undefined') window.sbAIHooks = sbAIHooks;

        const sbStripTrailingCommas = (s) => String(s).replace(/,(\s*[}\]])/g, '$1');

        function sbRepairJsonStrings(s) {
            let out = '', inStr = false, esc = false;
            for (let i = 0; i < s.length; i++) {
                const c = s[i];
                if (esc) { out += c; esc = false; continue; }
                if (c === '\\' && inStr) { out += c; esc = true; continue; }
                if (c === '"') { inStr = !inStr; out += c; continue; }
                if (inStr) { if (c === '\n') { out += '\\n'; continue; } if (c === '\r') { out += '\\r'; continue; } if (c === '\t') { out += '\\t'; continue; } }
                else if (c === '+' && s[i + 1] >= '0' && s[i + 1] <= '9') continue;
                out += c;
            }
            return out;
        }

        function sbEscapeContentQuotes(s) {
            let out = '', inStr = false, esc = false;
            const ws = (ch) => ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r';
            for (let i = 0; i < s.length; i++) {
                const c = s[i];
                if (esc) { out += c; esc = false; continue; }
                if (c === '\\' && inStr) { out += c; esc = true; continue; }
                if (c === '"') {
                    if (!inStr) { inStr = true; out += c; continue; }
                    let j = i + 1; while (j < s.length && ws(s[j])) j++;
                    const n = j < s.length ? s[j] : '';
                    let closes = n === '}' || n === ']' || n === ':' || n === '';
                    if (n === ',') { let k = j + 1; while (k < s.length && ws(s[k])) k++; const n2 = k < s.length ? s[k] : ''; closes = n2 === '"' || n2 === '{' || n2 === '[' || n2 === '-' || (n2 >= '0' && n2 <= '9') || n2 === 't' || n2 === 'f' || n2 === 'n' || n2 === ''; }
                    if (closes) { inStr = false; out += c; } else out += '\\"';
                    continue;
                }
                out += c;
            }
            return out;
        }

        function sbSliceBalanced(s) {
            const i = s.indexOf('{'); if (i < 0) return null;
            let depth = 0, inStr = false, esc = false;
            for (let k = i; k < s.length; k++) {
                const c = s[k];
                if (esc) { esc = false; continue; }
                if (c === '\\' && inStr) { esc = true; continue; }
                if (c === '"') { inStr = !inStr; continue; }
                if (inStr) continue;
                if (c === '{') depth++;
                else if (c === '}') { depth--; if (depth === 0) return s.slice(i, k + 1); }
            }
            return null;
        }

        function sbCompleteTruncatedJson(s, maxAttempts = 24) {
            const start = s.indexOf('{'); if (start < 0) return null;
            const cands = [], stack = []; let inStr = false, esc = false;
            for (let i = start; i < s.length; i++) {
                const c = s[i];
                if (esc) { esc = false; continue; }
                if (c === '\\' && inStr) { esc = true; continue; }
                if (c === '"') { inStr = !inStr; continue; }
                if (inStr) continue;
                if (c === '{') stack.push('}');
                else if (c === '[') stack.push(']');
                else if (c === '}' || c === ']') { stack.pop(); cands.push({ idx: i, st: stack.slice() }); }
                else if (c === ',') cands.push({ idx: i - 1, st: stack.slice() });
            }
            if (!stack.length && !inStr) return null;
            for (let k = cands.length - 1, t = 0; k >= 0 && t < maxAttempts; k--, t++) {
                const { idx, st } = cands[k];
                const attempt = s.slice(start, idx + 1).replace(/,\s*$/, '') + st.slice().reverse().join('');
                try { const v = JSON.parse(attempt); if (v && typeof v === 'object') return attempt; } catch (e) { }
            }
            return null;
        }

        function sbExtractJson(text) {
            const base = String(text || '').replace(/^\s*```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '');
            const i = base.indexOf('{');
            if (i < 0) throw new Error('balasan tanpa objek JSON');
            const body = base.slice(i);
            const tryParse = (s) => { if (!s) return null; try { const v = JSON.parse(s); return v && typeof v === 'object' ? v : null; } catch (e) { return null; } };
            const fixed = sbEscapeContentQuotes(sbStripTrailingCommas(sbRepairJsonStrings(body)));
            const tiers = [

        async function sbAskAI(prompt, signal, role = 'story', onProgress) {

        function sb2Cands(T, durationMs) {
            const W = T.words, lw = W.filter(w => w.lw);

        function sb2Cut(T, durationMs) {

            const secStarts = T.sections.map(s => { const l = T.lines.find(x => x.id === s.lineIds[0]); return l ? l.startMs - 120 : null; }).filter(x => x != null && x > 500);
            const best = new Array(n).fill(Infinity), prev = new Array(n).fill(-1); best[0] = 0;
            for (let j = 1; j < n; j++) {
                for (let i = j - 1; i >= 0; i--) {
                    const L = C[j].t - C[i].t; if (L > SB2_MAX + 1) break;

        function sb2Parts(T, durationMs, cuts) {

            const lineOf = {}; T.lines.forEach(l => { for (let i = l.wordRange[0]; i <= l.wordRange[1]; i++) lineOf[i] = l; });
            const secOf = {}; T.sections.forEach(s => { secOf[s.id] = s; });

        // ===== STORYBOARD (Revisi-6) · tampilan =====
        const sb3T = (ms) => { const v = Math.max(0, Math.round((ms || 0) / 1000)); return `${Math.floor(v / 60)}:${sbPad(v % 60)}`; };

        const SB3_LOG_CLS = { head: 'text-white font-bold', info: 'text-zinc-400', ok: 'text-emerald-400', warn: 'text-amber-300', err: 'text-red-400' };
        function Sb3LogLine({ e }) {

        function Sb3Terminal({ busy, logs }) {

            return (
                <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 animate-fade-in">
                    <div className="flex items-center gap-3">

        function Sb3ExportMenu({ pj }) {

        function Sb3View({ lib, active }) {
            const [ready, setReady] = useState(false);
            const [dbErr, setDbErr] = useState('');
            const [projects, setProjects] = useState([]);
            const [curId, setCurId] = useState(null);
            const [busy, setBusy] = useState(null);
            const [logs, setLogs] = useState([]);
            const [showLog, setShowLog] = useState(false);
            const [tsCache, setTsCache] = useState(loadTsCache);
            const projRef = useRef([]); projRef.current = projects;
            const curRef = useRef(null); curRef.current = curId;
            const busyRef = useRef(null);
            const timers = useRef({});
            const all = (lib && Array.isArray(lib.covers)) ? lib.covers : [];
            const songs = all.filter(x => x && x.id && x.taskId && x.audioId).slice().sort((a, b) => (b.date || 0) - (a.date || 0));

            useEffect(() => {
                let dead = false;
                (async () => {
                    try {
                        const P = await sb3List(); if (dead) return;
                        setProjects((P || []).filter(p => p && p.schema === 'raven-sb3/1').sort((a, b) => b.updatedAt - a.updatedAt));
                        try { const last = localStorage.getItem('raven_sb3_last'); if (last && (P || []).some(p => p.id === last)) setCurId(last); } catch (e) {}
                    } catch (e) { setDbErr('Penyimpanan perangkat (IndexedDB) tidak tersedia: ' + e.message + '. Data hanya bertahan selama halaman terbuka.'); }
                    setReady(true); sbAskPersist();
                })();
                return () => { dead = true; };
            }, []);
            useEffect(() => { if (active) setTsCache(loadTsCache()); }, [active]);
            useEffect(() => { if (!ready) return; try { localStorage.setItem('raven_sb3_last', curId || ''); } catch (e) {} }, [curId, ready]);

            const log = useCallback((level, msg) => setLogs(L => {
                const t = Date.now(), last = L[L.length - 1];
                if (level === 'live') {
                    if (last && last.live) return [...L.slice(0, -1), { ...last, msg: String(msg), t }];
                    return [...L.slice(-299), { id: t + '_' + Math.random(), t, level: 'info', live: true, msg: String(msg) }];
                }
                const base = last && last.live ? L.slice(0, -1) : L;
                return [...base.slice(-299), { id: t + '_' + Math.random(), t, level, msg: String(msg) }];
            }), []);
            const putProject = (n) => {
                n.updatedAt = Date.now();
                const ps = projRef.current.some(p => p.id === n.id) ? projRef.current.map(p => p.id === n.id ? n : p) : [n, ...projRef.current];
                projRef.current = ps; setProjects(ps);
                clearTimeout(timers.current[n.id]);
                timers.current[n.id] = setTimeout(() => { sb3Save(n).catch(e => showToast('Gagal menyimpan: ' + e.message, 'error')); }, 400);
            };
            const getPj = () => projRef.current.find(p => p.id === curRef.current);
            const updPj = (fn) => { const p = getPj(); if (!p) return; const n = sbClone(p); fn(n); putProject(n); };
            const run = async (panel, label, fn) => {
                if (busyRef.current) { showToast('Proses AI masih berjalan, tunggu sampai selesai.', 'info'); return; }
                const ctrl = new AbortController(), b = { panel, label, ctrl, done: 0, total: 0 };
                busyRef.current = b; setBusy(b);
                log('head', label);
                const prog = (done, total) => setBusy(x => (x ? { ...x, done, total } : x));
                try { await fn(ctrl.signal, prog); }
                catch (e) {
                    if (e && (e.cancelled || e.name === 'AbortError')) { log('warn', 'Dibatalkan. Hasil yang sudah jadi tetap tersimpan.'); showToast('Dibatalkan', 'info'); }
                    else { console.error(e); log('err', e.message || String(e)); showToast(e.message || String(e), 'error'); }
                }
                finally { busyRef.current = null; setBusy(null); }
            };

            const createFrom = (song, words, source) => {
                try {
                    const pj = sb3CreateProject({ song, rawWords: words, source });
                    putProject(pj); setCurId(pj.id);
                    log('ok', `Lirik "${pj.song.title}" diimpor: ${pj.parts.length} scene, ${sbFmtDur(pj.song.durationMs)}`);
                    showToast(`Proyek dibuat: ${pj.parts.length} scene`, 'success');
                } catch (e) { showToast(e.message, 'error'); }
            };
            const importText = (text, name) => {
                let j = null;
                try { j = JSON.parse(text); } catch (e) { showToast('Isi bukan JSON yang valid. Pakai file "… - timestamp.json" dari tab Lirik.', 'error'); return; }
                if (j && j.schema === 'raven-sb3/1' && Array.isArray(j.parts)) {
                    if (projRef.current.some(p => p.id === j.id)) j.id = sbUid('pj3');
                    putProject(j); setCurId(j.id); log('ok', `Proyek "${j.song.title}" dipulihkan`); showToast('Proyek dipulihkan', 'success'); return;
                }
                try {
                    const p = sbParseTsFile(text), song = { ...p.song };
                    if (!song.title) song.title = String(name || '').replace(/\s*-\s*timestamp\.json$/i, '').replace(/\.json$/i, '') || 'Tanpa judul';
                    createFrom(song, p.words, 'file');
                } catch (e) { showToast(e.message, 'error'); }
            };
            const importFile = async (f) => { try { importText(await sbReadFile(f), f.name); } catch (e) { showToast(e.message, 'error'); } };
            useEffect(() => {
                if (!active || curId) return;
                const onPaste = (e) => {
                    if (e.target && ['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
                    const t = e.clipboardData && e.clipboardData.getData('text');
                    if (t && t.trim().length > 20) { e.preventDefault(); importText(t, 'Tempelan'); }

                document.addEventListener('paste', onPaste);
                return () => document.removeEventListener('paste', onPaste);
            }, [active, curId]);
            const onDelete = (p) => {
                if (!window.confirm(`Hapus proyek "${p.song.title}"? Semua konsep dan scene ikut terhapus dan tidak bisa dibatalkan.`)) return;
                clearTimeout(timers.current[p.id]);
                const ps = projRef.current.filter(x => x.id !== p.id); projRef.current = ps; setProjects(ps);
                if (curRef.current === p.id) setCurId(null);
                sb3Del(p.id).catch(e => showToast('Gagal menghapus: ' + e.message, 'error'));
            };

            // --- aksi proses ---
            const genIdeas = () => run('concept', 'Merancang 3 konsep video klip', async (signal) => {
                const pj = getPj();
                log('info', `Membaca seluruh lirik: ${pj.parts.length} scene, ${sb3Blocks(pj).length} bagian lagu, gaya ${sb3Style(pj).label}`);
                const r = await sbRunAI({ prompt: sb3PromptConcept(pj), check: o => sb3CheckConcepts(o, pj), retryIf: errs => errs.some(e => /expected 3|characters is empty|locations is empty/.test(e)), signal, onStatus: s => log('live', s), role: 'story' });
                const cs = sbArr(r.data && r.data.concepts).filter(Boolean).slice(0, 3);
                if (!cs.length) throw r.error || new Error('AI tidak memberi konsep. ' + (r.errors || []).slice(0, 2).join('; '));
                if (!r.ok) log('warn', 'Sebagian isian konsep kurang: ' + (r.errors || []).slice(0, 3).join('; '));
                const ideas = cs.map(c => sb3FixConcept(c, pj));
                updPj(n => { n.ideas = ideas; n.ideasKey = sb3SetupKey(n); });
                log('ok', `${ideas.length} konsep siap: ${ideas.map(i => i.title).join(' · ')}`);
            });
            const choose = (i) => {
                const pj = getPj(); if (!pj || !pj.ideas || !pj.ideas[i]) return;
                if (pj.concept && sb3Status(pj).mapped && !window.confirm('Ganti konsep? Hasil pemetaan scene dan centang gambar referensi akan dihapus.')) return;
                updPj(n => { n.concept = sbClone(n.ideas[i]); n.conceptIdx = i; n.conceptKey = n.ideasKey; n.scenes = {}; });
                log('ok', `Konsep dipilih: ${pj.ideas[i].title}`);
            };
            const runMap = (only) => run(only ? 'scene:' + only[0] : 'map', only ? `Mengulang scene ${only[0]}` : 'Memetakan scene', async (signal, prog) => {

            const setTab = (t) => updPj(n => { n.tab = t; });
            const setStep = (t) => updPj(n => { n.step = t; });
            const genIdeasGo = async () => { await genIdeas(); const p = getPj(); if (p && p.ideas && p.ideas.length && p.ideasKey === sb3SetupKey(p)) updPj(n => { n.step = 'concept'; }); };
            const chooseGo = (i) => { const before = getPj(); choose(i); const p = getPj(); if (p && p !== before && p.concept) updPj(n => { n.step = 'assets'; }); };
            useEffect(() => {
                const onOpen = (e) => { const id = e && e.detail; if (id && projRef.current.some(p => p.id === id)) setCurId(id); else if (id === null) setCurId(null); };
                window.addEventListener('raven-sb-open', onOpen);
                return () => window.removeEventListener('raven-sb-open', onOpen);
            }, []);

            const pj = projects.find(p => p.id === curId) || null;
            if (!ready) return <div className="flex-1 flex items-center justify-center text-zinc-400 text-sm"><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat Storyboard…</div>;

            return (
                <div className="flex-1 min-h-0 flex flex-col">
                    {pj && (
                        <div className="shrink-0 glass-panel border-b border-white/5 px-3 sm:px-6 pt-3 pb-3.5 z-10">
                            <div className="max-w-3xl mx-auto space-y-3.5">
                                <div className="flex items-center gap-2.5">
                                    <button onClick={() => setCurId(null)} title="Daftar proyek" className="w-9 h-9 shrink-0 rounded-full glass-btn text-zinc-300 flex items-center justify-center"><i className="fa-solid fa-arrow-left text-xs"></i></button>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-[13px] font-bold text-white truncate">{pj.song.title}</p>
                                        <p className="text-[10px] text-zinc-500 font-mono truncate">{pj.parts.length} scene · {sb3T(pj.song.durationMs)}{pj.setup.style ? ' · ' + sb3Style(pj).label : ''}</p>
                                    </div>
                                    <button title="Log aktivitas" onClick={() => setShowLog(true)} className={sbCx('h-9 w-9 rounded-xl glass-btn text-[12px] shrink-0', busy ? 'text-white' : 'text-zinc-400')}><i className={sbCx('fa-solid text-xs', busy ? 'fa-circle-notch fa-spin' : 'fa-terminal')}></i></button>
                                    <Sb3ExportMenu pj={pj} />
                                    <button title="Hapus proyek" onClick={() => onDelete(pj)} className="h-9 w-9 rounded-xl glass-btn text-zinc-400 hover:!text-red-400 shrink-0"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                                <Sb3Stepper info={info} onPick={setStep} />
                            </div>
                        </div>
                    )}
                    <div className="flex-1 min-h-0 overflow-y-auto hide-scroll"><div className="max-w-3xl mx-auto p-4 sm:p-6 pb-24">
                        {dbErr && <p className="mb-3 text-[12px] text-zinc-300 rounded-xl border border-white/10 bg-white/[0.04] p-3">{dbErr}</p>}
                        {!pj ? <Sb3Home projects={projects} songs={songs} tsCache={tsCache} onCreate={(s) => createFrom(s, tsCache[s.id].words, 'lirik')} onImportFile={importFile} onOpen={setCurId} onDelete={onDelete} />

        const SB3_STEPS = [['style', 'Gaya'], ['concept', 'Konsep'], ['assets', 'Aset'], ['video', 'Video']];
        function sb3StepInfo(pj) {
            const g = sb3Status(pj), stale = g.ideas && pj.ideasKey !== sb3SetupKey(pj);
            const can = { style: true, concept: g.ideas, assets: g.concept, video: g.concept };
            const done = { style: g.ideas && !stale, concept: g.concept, assets: g.refsAll > 0 && g.refsDone >= g.refsAll, video: g.total > 0 && g.vids >= g.total };
            let cur = pj.step || (pj.tab === 'video' && g.mapped ? 'video' : g.mapped ? 'video' : g.concept ? 'assets' : g.ideas ? 'concept' : 'style');
            if (!can[cur]) cur = 'style';
            return { g, stale, can, done, cur };
        }
        function Sb3Stepper({ info, onPick }) {
            const idx = SB3_STEPS.findIndex(([id]) => id === info.cur);
            return (
                <div className="flex items-center w-full">
                    {SB3_STEPS.map(([id, label], i) => {
                        const on = id === info.cur, ok = info.done[id] && !on, can = info.can[id];
                        return (

        function Sb3SceneCard({ pj, p, idx, onDone, onRedo, busy, logs }) {

                <div className="glass-card rounded-2xl p-6 text-center animate-fade-in">
