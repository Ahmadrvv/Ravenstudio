                const l = { ...r, sig, clipId: clip.id, at: Date.now() };
                setLoop(l); lpPut('loop', l);
                return l;
            };
            const onMakeLoop = async () => {
                if (!plan || plan.pending || !caps || !caps.ok || busy) return;
                const ctl = new AbortController(); ctlRef.current = ctl;
                setBusy({ kind: 'loop', label: 'Membuat satu putaran loop…', p: 0 });
                try { await buildLoop(ctl.signal); showToast('Loop berhasil dibuat. Putar pratinjau untuk memeriksa sambungan.', 'success'); }
                catch (e) { if (!e.cancelled) showToast('Gagal membuat loop: ' + e.message, 'error'); }
                finally { setBusy(null); ctlRef.current = null; }
            };

            // --- ekspor ---
            const onExport = async () => {
                if (busy || !plan || plan.pending || !caps || !caps.ok) return;
                if (!songs.length) { showToast('Tambahkan minimal satu lagu terlebih dahulu.', 'error'); return; }
                if (songs.some(s => s.st !== 'ok')) { showToast('Masih ada lagu yang belum siap (sedang diunduh atau gagal). Tunggu hingga selesai, atau hapus lagu tersebut.', 'error'); return; }
                if (set.audio && !caps.audio) { showToast('Browser ini tidak mendukung encoding audio. Nonaktifkan opsi "Sertakan audio lagu" atau gunakan Chrome/Edge versi terbaru.', 'error'); return; }
                const base = lpSafeName(songs.length === 1 ? songs[0].title : `${songs[0].title} + ${songs.length - 1} lagu`);
                const name = `${base} - Visual Loop.${ext}`;
                let handle = null;
                if (disk) {
                    try { handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Video', accept: { [ext === 'webm' ? 'video/webm' : 'video/mp4']: ['.' + ext] } }] }); }
                    catch (e) { if (e && e.name === 'AbortError') return; showToast('Lokasi penyimpanan tidak dapat dipilih (' + e.message + '). File akan diunduh ke folder unduhan standar.', 'info'); handle = null; }
                }
                const ctl = new AbortController(); ctlRef.current = ctl;
                const lock = await lpWakeLock();
                const t0 = Date.now();
                setResult(null);
                try {
                    let l = loopOk ? loop : null;
                    if (!l) { setBusy({ kind: 'export', label: 'Tahap 1/2 · Membuat satu putaran loop…', p: 0 }); l = await buildLoop(ctl.signal); }
                    setBusy({ kind: 'export', label: 'Tahap 2/2 · Menyambung loop sepanjang lagu…', p: 0 });
                    const rd = await lpReadLoop(l);
                    const writable = handle ? await handle.createWritable() : null;
                    const res = await lpMux({ rd, totalSec, songs, gap: set.gap || 0, audioCodec: set.audio ? caps.audio : '', getBlob: songBlob, target: writable, signal: ctl.signal, onProg: (p, sub) => setBusy(b => b ? { ...b, p, sub, eta: null } : b) });
                    const took = (Date.now() - t0) / 1000;
                    if (res.blob) { lpDownload(res.blob, name); setResult({ name, size: res.blob.size, dur: res.dur, reps: res.reps, blob: res.blob, took }); }
                    else { let sz = 0; try { sz = (await handle.getFile()).size; } catch (e) {} setResult({ name: handle.name || name, size: sz, dur: res.dur, reps: res.reps, saved: true, took }); }
                    showToast('Video selesai dibuat.', 'success');
                } catch (e) {
                    if (e && e.cancelled) showToast('Ekspor dibatalkan.', 'info');
                    else showToast('Ekspor gagal: ' + (e && e.message ? e.message : String(e)), 'error');
                } finally { setBusy(null); ctlRef.current = null; try { if (lock) lock.release(); } catch (e) {} }
            };
            const cancel = () => { if (ctlRef.current) ctlRef.current.abort(); };

            if (!ready) return <div className="flex-1 flex items-center justify-center text-zinc-400 text-sm"><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat Visual…</div>;
            const isBusy = !!busy;
            const aspect = clip ? clip.w / clip.h : 16 / 9;
            const libShown = libSongs.filter(s => !q || String(s.title || '').toLowerCase().includes(q.toLowerCase()));
            const pickN = Object.values(pick).filter(Boolean).length;
            const dur = clip ? clip.dur : 0;
            return (
                <div ref={rootRef} className="flex-1 min-h-0 overflow-y-auto hide-scroll">
                    <div className="max-w-3xl mx-auto p-4 sm:p-6 pb-24 space-y-4">
                        <div>
                            <h2 className="text-lg font-bold text-white">Visual · Loop Video</h2>
                        </div>
                        {dbErr && <LpNote warn>{dbErr}</LpNote>}

                        {/* 1 · Video sumber */}
                        <LpCard n="1" title="Video sumber" right={clip ? <div className="flex gap-2"><LpBtn icon="fa-arrows-rotate" disabled={isBusy} onClick={() => clipInRef.current && clipInRef.current.click()}>Ganti</LpBtn><LpBtn icon="fa-trash-can" danger disabled={isBusy} onClick={removeClip}></LpBtn></div> : null}>
                            <input ref={clipInRef} type="file" accept="video/*,.mp4,.mov,.webm,.m4v,.mkv" className="hidden" onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; onClip(f); }} />
                            {!clip ? (
                                <button type="button" disabled={isBusy} onClick={() => clipInRef.current && clipInRef.current.click()}
                                    onDragOver={e => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)}
                                    onDrop={e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files && e.dataTransfer.files[0]; onClip(f); }}
                                    className={lpCx('w-full rounded-xl border-2 border-dashed p-8 flex flex-col items-center gap-2 transition-colors', drag ? 'border-white/60 bg-white/[0.06]' : 'border-white/15 hover:border-white/35 bg-white/[0.02]')}>
                                    <i className="fa-solid fa-film text-2xl text-zinc-400"></i>
                                    <span className="text-[13px] font-semibold text-white">Unggah video {LP_REC_SEC} detik</span>
                                    <span className="text-[11px] text-zinc-500">MP4 · MOV · WebM · {LP_MIN_SEC}–{LP_MAX_SEC} detik</span>
                                </button>
                            ) : (
                                <div className="space-y-3">
                                    <video src={clipUrl || undefined} controls muted playsInline className="w-full rounded-xl bg-black border border-white/10" style={{ aspectRatio: String(aspect), maxHeight: '50vh' }}></video>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        <LpStat k="Durasi" v={lpSec(clip.dur)} />
                                        <LpStat k="Ukuran" v={`${clip.w}×${clip.h}`} />
                                        <LpStat k="Frame rate" v={`${String(clip.fps).replace('.', ',')} fps`} />
                                        <LpStat k="File" v={clip.name} />
                                    </div>
                                    {Math.abs(clip.dur - LP_REC_SEC) > 2.5 && <LpNote>Durasi yang disarankan: {LP_REC_SEC} detik.</LpNote>}
                                </div>
                            )}
                            {busy && busy.kind === 'probe' && <div className="mt-3"><LpSpin label={busy.label} /></div>}
                        </LpCard>

                        {/* 2 · Lagu */}
                        <LpCard n="2" title={`Lagu (${songs.length}/${LP_MAX_SONGS})`} right={songs.length > 1 ? <button type="button" disabled={isBusy} onClick={clearSongs} className="text-[11px] text-zinc-500 hover:text-red-400 disabled:opacity-40">Hapus semua</button> : null}>
                            <input ref={songInRef} type="file" multiple accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus" className="hidden" onChange={e => { const fs = e.target.files; onSongFiles(fs); e.target.value = ''; }} />
                            <div className="flex flex-wrap gap-2 mb-3">
                                <LpBtn icon="fa-list" disabled={isBusy || room <= 0} onClick={() => setPicker(v => !v)}>Pilih dari Library</LpBtn>
                                <LpBtn icon="fa-upload" disabled={isBusy || room <= 0} onClick={() => songInRef.current && songInRef.current.click()}>Unggah audio</LpBtn>
                            </div>
                            {picker && (
                                <div className="mb-3 rounded-xl border border-white/10 bg-black/30 p-3">
                                    <div className="flex items-center gap-2 mb-2">
                                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Cari judul…" className="flex-1 h-8 px-3 rounded-lg bg-white/[0.05] border border-white/10 text-[12px] text-white placeholder-zinc-500 outline-none focus:border-white/30" />
                                        <LpBtn primary disabled={!pickN} onClick={addLib} className="!h-8">Tambahkan {pickN || ''}</LpBtn>
                                    </div>
                                    {!libSongs.length ? <p className="text-[12px] text-zinc-500">Library masih kosong. Buat lagu di tab Musiclabs, atau gunakan "Unggah audio".</p> : (
                                        <div className="max-h-64 overflow-y-auto divide-y divide-white/5">
                                            {libShown.map(s => {
                                                const on = !!pick[s.id], used = songs.some(x => x.libId === s.id);
                                                return (
                                                    <label key={s.id} className="flex items-center gap-3 py-2 cursor-pointer">
                                                        <input type="checkbox" checked={on} onChange={e => setPick(p => ({ ...p, [s.id]: e.target.checked }))} className="accent-white" />
                                                        <SongArt src={s.image} title={s.title} size={32} radius={7} />
                                                        <div className="flex-1 min-w-0">
                                                            <p className="text-[12px] text-white truncate">{s.title || 'Tanpa judul'}</p>
                                                            <p className="text-[10px] text-zinc-500">{tsIsNum(s.duration) ? lpT(Number(s.duration)) : ''}{used ? ' · sudah ada di daftar' : ''}</p>
                                                        </div>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}
                            {!songs.length ? <p className="text-[12px] text-zinc-500">Belum ada lagu.</p> : (
                                <div className="divide-y divide-white/5">
                                    {songs.map((s, i) => (
                                        <div key={s.id} className="flex items-center gap-2.5 py-2">
                                            <span className="w-5 text-[11px] font-mono text-zinc-500 text-right shrink-0">{i + 1}</span>
                                            <SongArt src={s.image} title={s.title} size={32} radius={7} />
                                            <div className="flex-1 min-w-0">
                                                <p className="text-[12px] text-white truncate">{s.title}</p>
                                                <p className={lpCx('text-[10px] truncate', s.st === 'err' ? 'text-red-400' : 'text-zinc-500')}>
                                                    {s.st === 'ok' ? lpT(s.dur) + (s.src === 'up' ? ' · unggahan' : ' · Library') : s.st === 'err' ? s.err : s.st === 'load' ? 'Menyiapkan audio…' : 'Menunggu…'}
                                                </p>
                                            </div>
                                            {s.st === 'err' && <button type="button" title="Coba lagi" onClick={() => updSong(s.id, { st: 'pending', err: '' })} className="w-7 h-7 rounded-lg glass-btn text-zinc-300"><i className="fa-solid fa-rotate-right text-[10px]"></i></button>}
                                            {s.st === 'load' && <i className="fa-solid fa-circle-notch fa-spin text-zinc-500 text-[11px]"></i>}
                                            <button type="button" title="Naik" disabled={isBusy || i === 0} onClick={() => moveSong(i, -1)} className="w-7 h-7 rounded-lg glass-btn text-zinc-400 disabled:opacity-30"><i className="fa-solid fa-chevron-up text-[10px]"></i></button>
                                            <button type="button" title="Turun" disabled={isBusy || i === songs.length - 1} onClick={() => moveSong(i, 1)} className="w-7 h-7 rounded-lg glass-btn text-zinc-400 disabled:opacity-30"><i className="fa-solid fa-chevron-down text-[10px]"></i></button>
                                            <button type="button" title="Hapus" disabled={isBusy} onClick={() => removeSong(s.id)} className="w-7 h-7 rounded-lg glass-btn text-zinc-500 hover:!text-red-400 disabled:opacity-30"><i className="fa-solid fa-xmark text-[11px]"></i></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {songs.length > 0 && (
                                <div className="mt-3 pt-3 border-t border-white/10 space-y-3">
                                    <div className="flex items-baseline justify-between gap-2">
                                        <span className="text-[12px] text-zinc-400">Total durasi video</span>
                                        <span className="text-[15px] font-semibold text-white font-mono">{lpT(totalSec)}{okSongs.length < songs.length ? ' +' : ''}</span>
                                    </div>
                                </div>
                            )}
                        </LpCard>

                        {/* 3 · Sambungan loop */}
                        <LpCard n="3" title="Sambungan loop">
                            {!clip ? <p className="text-[12px] text-zinc-500">Unggah video sumber terlebih dahulu.</p> : (
                                <div className="space-y-4">
                                    {busy && busy.kind === 'ana' && <LpSpin label={busy.label} p={busy.p} onCancel={cancel} />}
                                    {anaErr && <LpNote warn>Analisis gagal: {anaErr} <button type="button" className="underline ml-1" onClick={() => setAnaErr('')}>Coba lagi</button></LpNote>}
                                    {ana && plan && !plan.pending && (
                                        <div className="grid sm:grid-cols-[1fr_160px] gap-3 items-start">
                                            <div className="space-y-2">
                                                {seam && <div className={lpCx('rounded-xl border px-3 py-2', seam.c)}><p className="text-[12px] font-semibold">Kecocokan sambungan: {seam.t}</p>{seam.t === 'Berisiko terlihat' && <p className="text-[11px] opacity-80 mt-0.5">{seam.d}</p>}</div>}
                                                <div className="grid grid-cols-3 gap-2">
                                                    <LpStat k="Mulai" v={lpSec(plan.S)} />
                                                    <LpStat k="Akhir" v={lpSec(plan.E)} />
                                                    <LpStat k="1 putaran" v={lpSec(plan.period)} />
                                                </div>
                                            </div>
                                            <div>
                                                <LpMotionMap ana={ana} aspect={aspect} />
                                                <p className="text-[10px] text-zinc-500 mt-1">Peta gerak · {Math.round(ana.motion * 100)}% area bergerak</p>
                                            </div>
                                        </div>
                                    )}
                                    <div>
                                        <div className="flex items-center gap-2 mb-1.5">
                                            <p className="text-[12px] font-semibold text-zinc-300">Preset kehalusan</p>
                                            {set.preAuto && !set.preUser && <span className="text-[10px] text-zinc-500">Otomatis</span>}
                                        </div>
                                        <LpSeg value={set.pre || 'default'} disabled={isBusy} onChange={v => upd({ pre: v, xf: LP_PRESETS[v].xf, preUser: true, preAuto: false })} options={Object.keys(LP_PRESETS).map(k => [k, LP_PRESETS[k].label])} />
                                    </div>
                                    {caps && !caps.ok && <LpNote warn>{caps.err}</LpNote>}
                                    {busy && busy.kind === 'loop' && <LpSpin label={busy.label} p={busy.p} eta={busy.eta} onCancel={cancel} />}
                                    <div className="flex flex-wrap items-center gap-2">
                                        <LpBtn primary icon="fa-infinity" disabled={isBusy || !plan || plan.pending || !caps || !caps.ok} onClick={onMakeLoop}>{loopOk ? 'Buat ulang loop' : 'Buat & pratinjau loop'}</LpBtn>
                                        {loop && !loopOk && !isBusy && <span className="text-[11px] text-amber-200">Pengaturan telah berubah sejak loop terakhir dibuat.</span>}
                                    </div>
                                    {loopOk && (
                                        <div className="space-y-2">
                                            {prevUrl ? (
                                                <video ref={prevRef} src={prevUrl} controls playsInline className="w-full rounded-xl bg-black border border-white/10" style={{ aspectRatio: String(aspect), maxHeight: '55vh' }}></video>
                                            ) : <LpSpin label="Menyiapkan pratinjau…" />}
                                            <div className="relative h-1.5 rounded-full bg-white/10">
                                                {[1, 2].map(k => <span key={k} className="absolute -top-1 w-0.5 h-3.5 bg-white rounded" style={{ left: `${(k / 3) * 100}%` }}></span>)}
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                <LpBtn icon="fa-magnifying-glass" disabled={!prevUrl} onClick={() => jump(1)}>Periksa sambungan 1</LpBtn>
                                                <LpBtn icon="fa-magnifying-glass" disabled={!prevUrl} onClick={() => jump(2)}>Periksa sambungan 2</LpBtn>
                                            </div>
                                            <p className="text-[10px] text-zinc-500">Penanda putih = titik sambung · Satu putaran {lpSec(loop.frames / loop.fps)} · {loop.w}×{loop.h} · {loop.fps} fps</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </LpCard>

                        {/* 4 · Format & ekspor */}
                        <LpCard n="4" title="Format & ekspor">
                            {!clip ? <p className="text-[12px] text-zinc-500">Unggah video sumber dan tambahkan lagu terlebih dahulu.</p> : (
                                <div className="space-y-4">
                                    <div className="grid sm:grid-cols-2 gap-4">
                                        <div><p className="text-[12px] font-semibold text-zinc-300 mb-1.5">Resolusi</p><LpSeg value={set.res} disabled={isBusy} onChange={v => upd({ res: v })} options={[['720', '720p'], ['1080', '1080p']]} /></div>
                                        <div><p className="text-[12px] font-semibold text-zinc-300 mb-1.5">Frame rate</p><LpSeg value={set.fps || 0} disabled={isBusy} onChange={v => upd({ fps: v, fpsUser: true })} options={[[0, `Asli · ${lpNearFps(clip.fps)}`], [30, '30'], [60, '60']]} />{fps !== lpNearFps(clip.fps) && <p className="mt-1.5 text-[11px] text-amber-200/90">Berbeda dari klip ({String(clip.fps).replace('.', ',')} fps). Pilih <b>Asli</b> agar gerakan paling mulus.</p>}</div>
                                        <div className="space-y-2 pt-1">
                                            <label className="flex items-center gap-2 text-[12px] text-zinc-300 cursor-pointer"><input type="checkbox" className="accent-white" checked={!!set.audio} disabled={isBusy} onChange={e => upd({ audio: e.target.checked })} />Sertakan audio lagu</label>
                                        </div>
                                    </div>
                                    {size && <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        <LpStat k="Durasi akhir" v={songs.length ? lpT(totalSec) : '—'} />
                                        <LpStat k="Video" v={`${size.w}×${size.h} · ${fps} fps`} />
                                        <LpStat k="Format" v={caps ? (caps.ok ? `${ext.toUpperCase()} · ${caps.video === 'avc' ? 'H.264' : 'VP9'}${set.audio && caps.audio ? ' + ' + caps.audio.toUpperCase() : ''}` : '—') : 'Memeriksa…'} />
                                        <LpStat k="Perkiraan ukuran" v={songs.length ? '≤ ' + lpBytes(estBytes) : '—'} />
                                    </div>}
                                    {caps && caps.ok && set.audio && !caps.audio && <LpNote warn>Browser ini tidak mendukung encoding audio. Nonaktifkan opsi "Sertakan audio lagu" untuk membuat video tanpa suara, atau gunakan Chrome/Edge versi terbaru.</LpNote>}
                                    {caps && caps.ok && set.audio && caps.audio === 'opus' && caps.container === 'mp4' && <LpNote>Audio menggunakan codec Opus (browser ini belum mendukung AAC). Kompatibel dengan YouTube; sebagian pemutar lama mungkin tidak dapat memutar suaranya.</LpNote>}
                                    {!disk && estBytes > 1.5e9 && <LpNote warn>Perkiraan ukuran file {lpBytes(estBytes)} akan disimpan di memori browser sehingga berisiko gagal. Gunakan Chrome/Edge desktop agar file dapat disimpan langsung ke folder, atau turunkan resolusi atau frame rate.</LpNote>}
                                    {busy && busy.kind === 'export' && <LpSpin label={busy.label} sub={busy.sub} p={busy.p} eta={busy.eta} onCancel={cancel} />}
                                    <LpBtn primary icon="fa-file-export" className="w-full !h-11" disabled={isBusy || !songs.length || !plan || plan.pending || !caps || !caps.ok} onClick={onExport}>Ekspor video{songs.length ? ` (${lpT(totalSec)})` : ''}</LpBtn>
                                    {!songs.length && <p className="text-[11px] text-zinc-500 text-center">Tambahkan lagu terlebih dahulu.</p>}
                                    {result && (
                                        <div className="rounded-xl border border-emerald-400/30 bg-emerald-400/[0.06] p-3 flex items-center gap-3">
                                            <i className="fa-solid fa-circle-check text-emerald-300"></i>
                                            <div className="flex-1 min-w-0">
                                                <p className="text-[12px] text-white font-semibold truncate">{result.name}</p>
                                                <p className="text-[10px] text-zinc-400">{lpT(result.dur)} · {result.size ? lpBytes(result.size) : ''} · {Math.round(result.reps)}× putaran · selesai dalam {lpT(result.took)}{result.saved ? ' · tersimpan di folder yang dipilih' : ''}</p>
                                            </div>
                                            {result.blob && <LpBtn icon="fa-download" onClick={() => lpDownload(result.blob, result.name)}>Unduh lagi</LpBtn>}
                                        </div>
                                    )}
                                </div>
                            )}
                        </LpCard>
                    </div>
                </div>
            );
        }

        const RAVEN_TABS = [
            { id: 'music', label: 'Musiclabs', icon: 'fa-music' },
            { id: 'durasi', label: 'Lirik', icon: 'fa-file-lines' },
            { id: 'visual', label: 'Visual', icon: 'fa-film' }
        ];

        function App() {
            const [step, setStep] = useState(1);
            const [audioFile, setAudioFile] = useState(null);
            
            const [apiKeys, setApiKeys] = useState(readCentralKeys);
            const [ravenTab, setRavenTabState] = useState(() => { try { const v = localStorage.getItem('raven_tab'); return ['music', 'durasi', 'visual'].includes(v) ? v : 'music'; } catch (e) { return 'music'; } });
            const setRavenTab = (id) => {
                if (id !== 'music' && engine.isPlaying) { engine.stop(); }
                document.querySelectorAll('audio').forEach(el => { try { el.pause(); } catch (e) {} });
                setRavenTabState(id);
                try { localStorage.setItem('raven_tab', id); } catch (e) {}
            };
            const [sunoModel, setSunoModel] = useState(loadSunoModel);
            const [showModelPicker, setShowModelPicker] = useState(false);
            const curModel = SUNO_MODELS.find(m => m.id === sunoModel) || SUNO_MODELS[0];
            useEffect(() => { try { localStorage.setItem(SUNO_MODEL_KEY, sunoModel); } catch (e) {} }, [sunoModel]);
            useEffect(() => {
                if (!showModelPicker) return;
                const onKey = (e) => { if (e.key === 'Escape') setShowModelPicker(false); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [showModelPicker]);

            const [lyricsText, setLyricsText] = useState('');
            const [lyricsHistory, setLyricsHistory] = useState([]);
            const [audioDuration, setAudioDuration] = useState(0);
            const [libId, setLibId] = useState('');
            const [libMode, setLibMode] = useState(false);
            const acdBlobRef = useRef(null);
            const lyricsRef = useRef(null);
            const [optimizing, setOptimizing] = useState(false);
            const [prevStyle, setPrevStyle] = useState(null);
            const [optimizingLy, setOptimizingLy] = useState(false);
            
            const [isProcessing, setIsProcessing] = useState(false);
            const [processMsg, setProcessMsg] = useState('');
            const [elapsed, setElapsed] = useState(0);
            const [errorDetail, setErrorDetail] = useState('');
            const [coverResults, setCoverResults] = useState([]);
            const [sunoErr, setSunoErr] = useState(null);
            const [stage, setStage] = useState(0);
            const [uploadedUrl, setUploadedUrl] = useState('');
            const [style, setStyle] = useState('Acoustic pop, clear vocals');
            const [vocal, setVocal] = useState({ genders: [], age: '', range: '', traits: [] });

            const abortRef = useRef(null);

                    const data = await res.json().catch(() => ({}));

                    if (code === 401 || res.status === 401) setStatus('kie', { state: 'error', msg: 'API key tidak valid', credits: null });
                    else if (code === 402) setStatus('kie', { state: 'empty', msg: 'Kredit habis', credits: 0 });

                }

            const checkKieLater = () => { checkKie(); [4000, 15000, 45000, 90000].forEach(ms => setTimeout(checkKie, ms)); };

            useEffect(() => {
                const id = setTimeout(checkKie, 800);
                return () => clearTimeout(id);
            }, [apiKeys.kie]);

            const apiAct = useRavenApi();
            const apiInd = ravenIndState(!!cleanKey(apiKeys.kie), apiAct, apiStatus.kie.state);
            const statusView = (id) => {
                const st = apiStatus[id];
                const dot = `raven-ind raven-ind-${apiInd}`;

                let short = st.msg || 'Belum diisi';
                let long = st.msg || 'Belum diisi';
                if (id === 'kie' && st.state === 'ok' && st.credits != null) {
                    short = `${fmtNum(st.credits)} cr`;
                    long = `Terhubung · ${fmtNum(st.credits)} kredit`;
                }
                return { dot, textColor, short, long };
            };

            useEffect(() => {
                if (!isProcessing) { setElapsed(0); return; }
                const t0 = Date.now();
                const id = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 1000);
                return () => clearInterval(id);
            }, [isProcessing]);

            const cancelProcessing = () => {
                if (abortRef.current) { cancelledRef.current = true; abortRef.current.abort(); }
            };

            useEffect(() => {
                let req;
                const update = () => {
                    const t = engine.getCurrentTime();
                    const playing = engine.isPlaying;
                    setCurrentTime(prev => prev === t ? prev : t);
                    setIsPlaying(prev => prev === playing ? prev : playing);
                    req = requestAnimationFrame(update);
                };
                req = requestAnimationFrame(update);
                return () => cancelAnimationFrame(req);
            }, []);

            const handleFileSelect = (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                e.target.value = ''; 
                if (coverGenRef.current && genStageRef.current < 4) return showToast("Mohon tunggu, audio cover sebelumnya masih diunggah.", "info");
                engine.stop();
                setIsPlaying(false); setCurrentTime(0);
                setCoverResults([]); setSunoErr(null); setUploadedUrl(''); setErrorDetail('');
                setLibMode(false); setLibId(''); acdBlobRef.current = null;
                if (!audioFile || AudioEngine.fileKey(f) !== AudioEngine.fileKey(audioFile)) {
                    setLyricsText(''); setLyricsHistory([]);
                }
                setAudioFile(f);
                goToAcd(f);
            };

            const prepareACD = async (fileArg) => {
                const af = fileArg instanceof File ? fileArg : audioFile;
                if (!af) { showToast("File audio belum dipilih.", "error"); return false; }
                setIsProcessing(true);
                setProcessMsg('Memuat ACD...');
                try {
                    await engine.loadAudio(af, (pct, txt) => setProcessMsg(`Memuat ACD: ${txt} (${pct}%)`));
                    setTrimState({ start: engine.trimStart, end: engine.trimEnd });
                    setVocalState({ intensity: engine.tracks.vocal.intensity }); setEchoLevel(engine.echoLevel); setRobotLevel(engine.robotLevel);
                    return true;
                } catch (err) {
                    console.error(err);
                    showToast("Gagal memuat audio: " + (err.message || "format tidak didukung"), "error");
                    return false;
                } finally {
                    setIsProcessing(false);
                }
            };

            const goToAcd = async (f) => { if (await prepareACD(f)) { setUploadedUrl(''); setSunoErr(null); acdBlobRef.current = null; setAudioDuration(0); setLibMode(false); setLibId(''); setStep(2); } };

            const leaveAcd = (n) => {
                engine.stop(); setIsPlaying(false);
                setStep(n);
            };

            const goStep = (n) => {
                if (n === 2) return goToAcd();
                engine.stop(); setIsPlaying(false);
                setStep(n);
            };

            const callKie = async (prompt, opts = {}) => {
                const ctrl = new AbortController();
                if (!opts.silent) { abortRef.current = ctrl; cancelledRef.current = false; }
                try {
                    return await kieChat(prompt, cleanKey(apiKeys.kie), { timeout: opts.timeout, signal: ctrl.signal, onDelta: opts.onDelta, onTry: (n) => { if (!opts.silent) setProcessMsg(n > 1 ? 'Server sibuk, mencoba lagi...' : 'Menghubungi AI...'); } });
                } catch (e) {
                    if (e.cancelled || (!opts.silent && cancelledRef.current)) throw new Error('Dibatalkan');
                    setErrorDetail(e.detail || e.raw || e.message);
                    throw e;
                } finally {
                    if (!opts.silent) abortRef.current = null;
                }
            };

            const optimizeStyle = async () => {
                if (optimizing) return;
                if (!cleanKey(apiKeys.kie)) return showToast("API key belum diisi. Masukkan melalui menu Kunci API.", "error");
                const cur = style.trim();
                if (!cur) return showToast("Style belum diisi.", "error");
                setOptimizing(true); setErrorDetail(''); ravenApi.start('style'); let apiOk = false;
                try {
                    const raw = await callKie(buildStylePrompt(cur, { tags: vocalTags, lyrics: lyricsText }), { silent: true, timeout: 120000 });
                    const out = parseStyleResponse(raw);
                    if (!out) throw new Error("Hasil kosong. Silakan coba lagi.");
                    setPrevStyle(cur); setStyle(out.slice(0, STYLE_MAX));
                    apiOk = true;
                } catch (err) {
                    console.error(err);
                    showToast(err.message || "Gagal mengoptimalkan style", "error");
                } finally {
                    setOptimizing(false); ravenApi.end('style', apiOk);
                    setTimeout(checkKie, 3000); 
                }
            };

            const optimizeLyrics = async () => {
                if (optimizingLy) return;
                if (!cleanKey(apiKeys.kie)) return showToast("API key belum diisi. Masukkan melalui menu Kunci API.", "error");
                const cur = lyricsText.trim();
                if (!cur) return showToast("Lirik belum diisi.", "error");
                setOptimizingLy(true); setErrorDetail(''); ravenApi.start('lyrics'); let apiOk = false;

                try {
                    const raw = await callKie(buildFormatPrompt(cur), { silent: true, timeout: 180000, onDelta: upd.push });
                    upd.cancel();
                    const out = parseLyricsResponse(raw);
                    if (!out) throw new Error("Hasil kosong. Silakan coba lagi.");
                    const a = lyWords(cur), b = lyWords(out);
                    if (a.length && b.length < a.length * 0.9) throw new Error("Hasil optimasi terpotong dan tidak diterapkan. Silakan coba lagi.");
                    setLyricsHistory(h => [...h.slice(-19), orig]);
                    setLyricsText(out.slice(0, LYRICS_MAX).trimEnd());
                    if (out.length > LYRICS_MAX) showToast(`Hasil optimasi melebihi ${LYRICS_MAX} karakter dan dipotong secara otomatis.`, "info");
                    apiOk = true;
                } catch (err) {
                    upd.cancel(); setLyricsText(orig);
                    console.error(err);
                    showToast(err.message || "Gagal mengoptimalkan lirik", "error");
                } finally {
                    setOptimizingLy(false); ravenApi.end('lyrics', apiOk);
                    setTimeout(checkKie, 3000);
                }
            };

            const insertTag = (tag) => {
                if (optimizingLy) return;
                const el = lyricsRef.current; const pos = el ? el.selectionStart : lyricsText.length;
                const before = lyricsText.slice(0, pos), after = lyricsText.slice(pos);
                const ins = `${before && !before.endsWith('\n') ? '\n' : ''}${tag}\n`;
                if (lyricsText.length + ins.length > LYRICS_MAX) return showToast(`Batas ${LYRICS_MAX} karakter tercapai.`, "error");
                setLyricsHistory(h => [...h.slice(-19), lyricsText]);
                setLyricsText(before + ins + after);
                setTimeout(() => { if (el) { el.focus(); const c = (before + ins).length; el.setSelectionRange(c, c); } }, 0);

            const undoLyrics = () => {
                if (optimizingLy || lyricsHistory.length === 0) return;
                setLyricsText(lyricsHistory[lyricsHistory.length - 1]);
                setLyricsHistory(h => h.slice(0, -1));
            };

            const generateKieCover = async (config, mode = 'final') => {
                const kieKey = cleanKey(apiKeys.kie);
                if (!kieKey) return showToast("API key belum diisi. Masukkan melalui menu Kunci API.", "error");
                if (!audioFile) return showToast("File audio belum dipilih.", "error");
                if (coverGenRef.current) return showToast("Cover sebelumnya masih diproses.", "info");
                if (mode === 'final' && !lyricsText.trim()) return showToast("Lirik belum diisi.", "error");
                if (mode === 'final' && lyricsText.trim().length > LYRICS_MAX) return showToast(`Lirik melebihi batas ${LYRICS_MAX} karakter. Kurangi panjang lirik terlebih dahulu.`, "error");
                
                const sig = mode === 'final' ? genSig(config.style) : '';
                if (mode === 'final') {
                    const dup = lib.covers.find(c => c.sig === sig);
                    if (dup && !window.confirm('Audio, lirik, style, dan vokal ini identik dengan cover yang sudah ada di Library. Lanjutkan proses?')) { setLibTab('covers'); goHome(); return; }
                }
                if (mode === 'final' && libId) setLib(l => ({ ...l, uploads: l.uploads.map(x => x.id === libId ? { ...x, lyrics: lyricsText } : x) }));

                const ctrl = new AbortController();
                abortRef.current = ctrl; cancelledRef.current = false;
                const chk = () => { if (cancelledRef.current) throw new Error("Dibatalkan"); };
                const auth = { 'Authorization': `Bearer ${kieKey}` };
                let taskId = '';
                ravenApi.start('cover'); let apiOk = false;
                const jobId = 'cover-' + Date.now();
                const jobLabel = (audioFile.name || 'Cover').replace(/\.[^.]+$/, '') + ' (Cover)';
                const say = (m) => { const t = String(m || '').replace(/\s*·.*$/s, ''); setCoverGen(g => g ? { ...g, msg: t } : g); ravenJobs.update(jobId, { msg: t }); };
                const setGenStage = (n) => { genStageRef.current = n; };
                setCoverGen({ start: Date.now(), msg: 'Menyiapkan audio' }); ravenJobs.add({ id: jobId, label: jobLabel, msg: 'Menyiapkan audio' });
                setErrorDetail(''); setCoverResults([]); setSunoErr(null); setGenStage(uploadedUrl ? 4 : (acdBlobRef.current ? 3 : 1));
                engine.stop(); setIsPlaying(false);

                try {
                    const lyricsOut = mode === 'final' ? lyricsText.trim() : '';
                    setGenStage(uploadedUrl ? 4 : (acdBlobRef.current ? 3 : 1));
                    
                    let dur = audioDuration;
                    let uploadUrl = uploadedUrl;

                                say('Memuat ACD...');
                                await engine.loadAudio(audioFile, () => {});
                            }
                            if (engine.trimEnd - engine.trimStart > 480) throw new Error("Durasi audio melebihi batas.");
                            say('Merender audio hasil ACD...');
                            await new Promise(r => setTimeout(r, 60));
                            const rendered = await renderAcdBuffer(engine); chk();
                            setGenStage(2); say('Mengompres audio...');
                            mp3 = await encodeMp3(rendered, 192, (p) => say(`Mengompres audio (${p}%)...`)); chk();
                            acdBlobRef.current = mp3; dur = rendered.duration; setAudioDuration(dur);
                        }

                        setGenStage(3); say(`Mengunggah audio ke server (${(mp3.size / 1048576).toFixed(1)} MB)...`);
                        uploadUrl = await kieUploadAudio(mp3, `acd-${Date.now()}.mp3`, kieKey, ctrl.signal); chk();
                        setUploadedUrl(uploadUrl);
                    }

                    
                    setGenStage(4); say(mode === 'check' ? 'Mengirim sampel untuk cek awal...' : 'Mengirim tugas pemrosesan ke AI...');
                    const base = (audioFile.name || 'Cover').replace(/\.[^.]+$/, '');
                    const body = {
                        uploadUrl, instrumental: false, model: sunoModel,
                        callBackUrl: cleanKey(apiKeys.callback) || KIE_DEFAULT_CALLBACK,
                        title: `${base} (Cover)`.slice(0, 80),
                        ...(mode === 'check' ? { duration: 10 } : { lyrics: lyricsOut, ...(apiGender ? { vocalGender: apiGender } : {}) })
                    };
                    const style = composeStyle(config.style, vocalTags);
                    if (style) body.style = style;
                    const submit = async (b) => {
                        const res = await fetchT(KIE_SUNO_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify(b) }, 90000);
                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    let { res, j } = await submit(body);
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId) && /customMode/i.test(j.msg || '')) ({ res, j } = await submit({ ...body, customMode: true }));
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId)) {
                        throw new Error(`Server menolak tugas: ${j.msg || j.message || 'HTTP ' + res.status}`);
                    }
                    taskId = j.data.taskId; pendAdd(taskId, `${base} (cover)`, { kind: 'cover', title: `${base} (Cover)`, source: audioFile.name, style: config.style || '', sig });

                    const t0 = Date.now(); let fails = 0, polls = 0, tracks = []; setGenStage(5);
                    const FAILED = ['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Proses melebihi batas waktu (>10 menit).`);
                        await new Promise(r => setTimeout(r, 5000)); chk();
                        let info;
                        try {
                            const r = await fetchT(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal }, 30000);
                            const d = await r.json().catch(() => ({}));
                            if (!r.ok || Number(d.code) !== 200) {
                                if ([401, 402, 403].includes(r.status) || [401, 402, 403].includes(Number(d.code))) throw Object.assign(new Error(d.msg || 'Akses ditolak'), { fatal: true });
                                throw new Error(d.msg || `HTTP ${r.status}`);
                            }
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || e.fatal || ++fails > 5) throw e;
                            continue; 
                        }
                        const status = info.status || '';
                        const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                        const labels = { PENDING: 'Menunggu antrean server', TEXT_SUCCESS: 'AI menyusun lirik', FIRST_SUCCESS: 'Versi pertama selesai, menunggu versi lainnya' };
                        polls++; say(`${labels[status] || 'AI sedang memproses'}${Date.now() - t0 > 150000 ? ' (antrean padat)' : ''}`);
                        if (mode === 'check' && ['TEXT_SUCCESS', 'FIRST_SUCCESS', 'SUCCESS'].includes(status)) { pendDel(taskId); break; }
                        if (status === 'SUCCESS') { pendDel(taskId); tracks = list; break; }
                        if (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url)) { pendDel(taskId); tracks = list; break; }
                        if (FAILED.includes(status) || status === 'CALLBACK_EXCEPTION') {
                            pendDel(taskId);
                            throw Object.assign(new Error(`AI gagal: ${info.errorMessage || status}`), { raw: `status: ${status}\n${info.errorMessage || ''}` });
                        }
                    }

                    if (mode === 'check') {
                        const blob = acdBlobRef.current;
                        const id = 'u' + Date.now();
                        let saved = false;
                        try { if (blob) { await idbPut(id, blob); saved = true; } } catch (e) {}
                        if (saved) {
                            const name = audioFile.name;
                            lib.uploads.filter(x => x.name === name).forEach(x => idbDel(x.id).catch(() => {}));
                            setLib(l => ({ ...l, uploads: [{ id, name, size: blob.size, duration: dur || engine.duration, lyrics: lyricsText, sig: audioSig(), date: Date.now() }, ...l.uploads.filter(x => x.name !== name)] }));
                            setLibId(id);
                            showToast("Pemeriksaan selesai. File tersimpan, lanjutkan ke lirik dan style.", "success");
                        }
                        apiOk = true;
                        setStep(4);
                        return;
                    }
                    
                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `Cover ${i + 1}`,
                        taskId, audioId: x.id || '', variant: i + 1,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Proses selesai, tetapi tidak ada audio yang dihasilkan.`);
                    setCoverResults(results);
                    setLib(l => ({ ...l, covers: [...results.map(r => ({ ...r, id: 'c' + Date.now() + '-' + r.id, source: audioFile.name, style: config.style || '', sig, date: Date.now() })), ...l.covers] }));
                    setLibTab('covers');
                    if (viewRef.current.tab === 'music' && viewRef.current.mode === 'cover' && viewRef.current.step === 5) goHome();
                    apiOk = true; showToast(`Proses selesai. ${results.length} versi audio dihasilkan.`, "success");
                } catch (e) {
                    console.error(e);
                    if (cancelledRef.current || e.name === 'AbortError') { apiOk = null; showToast("Dibatalkan", "info"); }
                    else {
                        const cr = /copyright|existing work|matches|sensitive|lyric|hak cipta/i.test(`${e.message} ${e.raw || ''}`);
                        setSunoErr(cr ? {
                            kind: 'copyright', title: 'Proses ditolak',
                            msg: 'Audio atau lirik ditolak karena kemungkinan mengandung materi berhak cipta atau kata sensitif. Sesuaikan pengaturan ACD atau ubah lirik, lalu coba lagi.',
                            raw: '', back: 2, backLabel: 'Ke Pengaturan ACD'
                        } : { kind: 'error', title: 'Proses gagal', msg: e.message || 'Gagal memproses permintaan', raw: e.detail || '' });
                        showToast(e.message || "Gagal memproses audio", "error");
                    }
                } finally {
                    abortRef.current = null;
                    setGenStage(0);
                    setCoverGen(null); ravenJobs.remove(jobId); ravenApi.end('cover', apiOk);
                    checkKieLater(); 
                }
            };

            const sunoErrPanel = sunoErr && (
                <div className={`rounded-xl border p-5 text-sm shadow-xl ${sunoErr.kind === 'copyright' ? 'border-orange-500/50 bg-[#1a1a1a] text-white' : 'border-red-500/50 glass-inner text-white'}`}>
                    <div className="font-bold mb-2 text-base flex items-center gap-3"><i className="fa-solid fa-triangle-exclamation"></i> {sunoErr.title}</div>
                    <div className="leading-relaxed opacity-90">{sunoErr.msg}</div>

                setAudioFile(f); setAudioDuration(it.duration || 0);
                setLyricsText(String(it.lyrics || '').slice(0, LYRICS_MAX)); setLyricsHistory([]);

            const libBulkDownload = async () => {
                if (libBulk || !libSelIds.size) return;
                setLibBulk(true);

            const libBulkDelete = () => {

                exitLibSel();

            const downloadResult = async (it) => {

                setDlBusy(it.id);

            const delLib = (kind, it) => {

            const togglePlay = () => {
                if (engine.isPlaying) { engine.stop(); setIsPlaying(false); setCurrentTime(engine.getCurrentTime()); } 
                else {
                    const ok = engine.play(engine.getCurrentTime());
                    setIsPlaying(!!ok);
                    if (!ok) showToast("Audio belum siap.", "error");
                }
            };

            const handleSeek = (e) => {
                engine.seek(parseFloat(e.target.value));
                setCurrentTime(engine.getCurrentTime());
            };

            const handleRestart = () => {
                engine.seekTime(engine.trimStart);
                setCurrentTime(engine.getCurrentTime());
            };

            const setIntensity = (value) => {
                engine.setIntensity(value);
                setVocalState(prev => ({ ...prev, intensity: value }));
            };

            const setEcho = (value) => { engine.setEcho(value); setEchoLevel(value); };
            const setRobot = (value) => { engine.setRobot(value); setRobotLevel(value); };

            const handleTrim = (start, end) => {
                engine.setTrim(start, end);
                setTrimState({ start: engine.trimStart, end: engine.trimEnd });
            };

            const handleTimelineSeek = (time) => {
                engine.seekTime(time);
                setCurrentTime(engine.getCurrentTime());
            };

                    {libTab === 'covers' && lib.covers.filter(x => libFilter === 'all' || (x.kind || 'cover') === libFilter).length === 0 && <div className="absolute inset-0 pointer-events-none flex items-center justify-center text-sm text-zinc-500 uppercase tracking-widest font-mono">Belum ada hasil render.</div>}

                                        <i className={`fa-solid ${tb.icon} text-[11px]`}></i>{tb.label}
                                    </button>

                            </nav>

                        <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                            {ravenTab === 'music' && (
                            <button onClick={() => setShowModelPicker(true)} aria-haspopup="dialog" title="Pilih model Suno" className="h-9 flex items-center gap-2 px-3 rounded-full glass-inner hover:border-white/30 transition-colors cursor-pointer shadow-sm whitespace-nowrap">
                                <span className="text-xs font-semibold text-white">{curModel.short}</span>
                                <i className="fa-solid fa-chevron-down text-[8px] text-zinc-500"></i>
                            </button>

                            {(() => { const v = statusView('kie'); return (
                                <button onClick={openRavenApi} title="Kunci API" className="h-9 flex items-center gap-2 px-3 rounded-full glass-inner hover:border-white/30 transition-colors cursor-pointer shadow-sm whitespace-nowrap">
                                    <i className="fa-solid fa-key text-[11px] text-zinc-400"></i>
                                    <span className={`w-1.5 h-1.5 rounded-full ${v.dot}`}></span>
                                    <span className={`text-xs font-semibold ${v.textColor}`}>{v.short}</span>
                                </button>
                            ); })()}

                    <div className={ravenTab === 'music' ? 'contents' : 'hidden'}>
                    {/* App Header (Steps) for Cover Mode */}
                    <div className={`${appMode === 'cover' ? 'flex' : 'hidden'} px-3 py-3 sm:px-6 sm:py-4 shrink-0 glass-panel border-b border-white/5 overflow-x-auto hide-scroll justify-center shadow-md z-10`}>
                        <div className="flex items-center max-w-3xl w-full justify-between">

                        </div>

                                        <button key={c.m} onClick={() => setAppMode(c.m)} className="glass-card p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-4 md:hover:-translate-y-1 hover:border-white/30 active:scale-[0.98] transition-all text-left group md:min-w-[260px]">
                                            <div className="w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-xl sm:rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-base sm:text-xl text-zinc-200 group-hover:bg-white group-hover:text-black transition-all"><i className={`fa-solid ${c.icon}`}></i></div>

                                    <h2 className="text-base font-bold text-white flex items-center gap-3">

        // =====================================================================================

        const KIE_GEN_URL = 'https://api.kie.ai/api/v1/generate';

        const SONG_TAGS = ['[Intro]', '[Verse 1]', '[Pre-Chorus]', '[Chorus]', '[Verse 2]', '[Bridge]', '[Outro]'];
        const SONG_KIND_LABEL = { cover: 'Cover', song: 'Lagu Baru', instrumental: 'Instrumental' };

        async function kieAsk(prompt, key, signal, ms, onDelta) { return kieChat(prompt, key, { timeout: ms, signal, onDelta }); }

        function buildSongStylePrompt(style, o) {
            const tags = o.tags || [];
            const vocalRule = o.instrumental
                ? 'VOCAL: this is an INSTRUMENTAL track. Do NOT write any vocal descriptor.'
                : tags.length
                    ? `VOCAL: the app puts vocal tags: "${tags.join(', ')}". Do NOT write vocal descriptors in output.`
                    : 'VOCAL: Add exactly ONE clear vocal descriptor right after the genre.';
            return [
                'You are a prompt specialist. Convert the user description into a STYLE prompt.',
                `USER DESCRIPTION: ${style}`,
                vocalRule,
                STYLE_RULES,
                'OUTPUT: valid JSON {"style": "..."} only, no other text.'
            ].join('\n');
        }

        function buildSongWritePrompt(style, o) {
            const tags = o.tags || [];
            return [
                'You are an award-winning songwriter.',
                `SONG BRIEF: ${style}`,
                tags.length ? `VOICE: ${tags.join(', ')}` : null,
                'LANGUAGE: Indonesian if not specified.',
                'STRUCTURE: Use [Verse 1], [Chorus] labels on own lines. Plain text only.',
                'LENGTH: at most 3000 characters in total, section labels included.',
                'OUTPUT: only the lyrics. No title, no notes, no markdown, no code fences.'
            ].filter(x => x !== null).join('\n');
        }

        function buildSongPolishPrompt(lyrics, style) {
            return [
                'You are a senior lyric editor.',
                style ? `SONG BRIEF: ${style}` : null,
                'TASK: polish lyrics to professional quality. Keep structure and tags.',
                'RULES: do not add or remove sections, keep the length within +10% of the original, no commentary, no code fences.',
                'OUTPUT: only the polished lyrics as plain text.',
                'LYRICS:',
                lyrics
            ].filter(x => x !== null).join('\n');
        }

        function deriveSongTitle(kind, lyrics, style) {
            const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
            if (kind === 'vocal') {
                const line = String(lyrics || '').split('\n').map(l => l.replace(/\[[^\]]*\]/g, ' ').replace(/([A-Za-zÀ-ÿ])-(?=[A-Za-zÀ-ÿ])/g, '$1').replace(/[^\p{L}\p{N}\s'’]/gu, ' ').replace(/\s+/g, ' ').trim()).find(l => /[A-Za-zÀ-ɏ]/.test(l));
                if (line) return cap(line.split(' ').slice(0, 6).join(' ')).slice(0, 80);
                return 'Lagu Baru';
            }
            const first = String(style || '').split(',')[0].replace(/[^\p{L}\p{N}\s'’-]/gu, ' ').replace(/\s+/g, ' ').trim();
            const words = first.split(' ').filter(Boolean).slice(0, 4).map(cap).join(' ');
            return (words ? `${words} Instrumental` : 'Instrumental').slice(0, 80);
        }

        function NewSong({ apiKeys, sunoModel, lib, setLib, refreshCredits, refreshCreditsLater, onSongDone, onLeave }) {
            const [kind, setKind] = useState('vocal'); 
            const [style, setStyle] = useState('');
            const [prevStyle, setPrevStyle] = useState(null);
            const [lyrics, setLyrics] = useState('');
            const [lyricsHistory, setLyricsHistory] = useState([]);
            const [vocal, setVocal] = useState({ genders: [], age: '', range: '', traits: [] });
            const [duration, setDuration] = useState(0);
            const [ai, setAi] = useState('');   
            const [gen, setGen] = useState(false);
            const [msg, setMsg] = useState('');
            const [elapsed, setElapsed] = useState(0);
            const [err, setErr] = useState(null);
            const aiAbort = useRef(null);
            const genAbort = useRef(null);
            const cancelGen = useRef(false);
            const lyricsRef = useRef(null);

            const instrumental = kind === 'instrumental';
            const vocalTags = instrumental ? [] : vocalTagList(vocal);
            const apiGender = vocalTags.length && vocal.genders.length === 1 ? vocal.genders[0] : '';
            const finalStyle = composeStyle(style, vocalTags);
            const busy = !!ai || gen;
            const title = deriveSongTitle(kind, lyrics, style);

            useEffect(() => {
                if (!busy) { setElapsed(0); return; }
                const t0 = Date.now();
                const id = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 1000);
                return () => clearInterval(id);
            }, [busy]);

            const toggleGender = (id) => setVocal(v => {
                const g = v.genders.includes(id) ? v.genders.filter(x => x !== id) : [...v.genders, id];
                return g.length ? { ...v, genders: g, range: '', traits: v.traits.filter(t => !(t === 'falsetto' && g.length === 1 && g[0] === 'f')) } : { genders: [], age: '', range: '', traits: [] };
            });
            const pickAge = (id) => setVocal(v => { const age = v.age === id ? '' : id; const young = ['child', 'teen'].includes(age); return { ...v, age, range: age === 'child' ? '' : v.range, traits: v.traits.filter(t => !(young && V_YOUNG_BLOCK.includes(t))) }; });
            const pickRange = (r) => setVocal(v => ({ ...v, range: v.range === r ? '' : r }));

                const auth = { 'Authorization': `Bearer ${key}` };

                setGen(t00); setErr(null); setMsg('Mengirim tugas ke AI'); ravenJobs.add({ id: jobId, label: title || 'Lagu baru', msg: 'Mengirim tugas ke AI' }); ravenApi.start('song'); let apiOk = false;

                                        <h3 className="text-base md:text-lg font-bold uppercase tracking-wider flex items-center gap-3 text-white"><div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-align-left text-zinc-300 text-sm"></i></div> Editor Lirik</h3>
                                    </div>

                                        </div>

                                    <textarea ref={lyricsRef} value={lyrics} onChange={e => setLyrics(e.target.value)} maxLength={LYRICS_MAX} readOnly={ai === 'write' || ai === 'polish'} spellCheck={false} placeholder="Masukkan lirik lagu. Gunakan tag bagian seperti [Verse 1] atau [Chorus]." className="w-full glass-inner border border-white/5 rounded-xl p-5 text-sm md:text-base leading-relaxed text-zinc-200 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 font-mono whitespace-pre-wrap resize-y min-h-[300px] transition-all placeholder:text-zinc-600" />
                                    
                                    <div className="flex flex-col sm:flex-row items-center gap-3 pt-2">

                                        {aiBtn('polish', 'fa-wand-magic', 'Format Lirik', 'Memformat...', 'glass-btn hover:bg-white text-zinc-200 hover:text-black hover:border-transparent flex-1 w-full')}
                                    </div>

                            <div className="pt-6">
                                {gen ? <GenStatus title={instrumental ? 'Sedang membuat instrumental' : 'Sedang membuat lagu'} msg={msg} start={gen} onLeave={onLeave} /> : (                                <button onClick={generate} disabled={!style.trim() || (!instrumental && !lyrics.trim())} className="w-full disabled:opacity-50 disabled:cursor-not-allowed bg-white text-black py-5 rounded-2xl text-base font-bold uppercase tracking-widest hover:bg-zinc-200 hover:scale-[1.01] transition-all text-center flex items-center justify-center gap-3">
                                    <i className="fa-solid fa-bolt text-lg"></i> Buat Lagu
                                </button>)}
                            </div>

        }

        function Chip({ on, disabled, onClick, children }) {
            return <button type="button" disabled={disabled} onClick={onClick} className={`px-4 py-2 rounded-full border text-xs font-bold uppercase tracking-wider transition-all shadow-sm ${on ? 'bg-white border-white text-black' : 'glass-btn border-white/10 text-zinc-400 hover:text-white hover:border-white/30'} ${disabled ? 'opacity-30 cursor-not-allowed' : ''}`}>{children}</button>;
        }

        function formatPrecise(secs) {
            const t = Math.round(Math.max(0, secs) * 10);
            const m = Math.floor(t / 600);
            const s = (t % 600) / 10;
            return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`;
        }

        function Studio({ fileName, duration, currentTime, isPlaying, togglePlay, handleRestart, handleSeek, formatTime, vocalState, setIntensity, echoLevel, setEcho, robotLevel, setRobot, engine, trim, onTrim, onSeekTime }) {

                        </div>

                            <SpectrumVisualizer engine={engine} isPlaying={isPlaying} />
                        </div>
                    </div>
                    
                    <TimelineWaveformCard engine={engine} duration={duration} currentTime={currentTime} isPlaying={isPlaying} togglePlay={togglePlay} handleRestart={handleRestart} handleSeek={handleSeek} trim={trim} onTrim={onTrim} onSeekTime={onSeekTime} formatTime={formatTime} />

                        <CutAudioCard duration={duration} currentTime={currentTime} trim={trim} onTrim={onTrim} />
                        <FilterCard state={vocalState} onIntensity={setIntensity} applyPreset={applyPreset} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

            );

        function SpectrumVisualizer({ engine, isPlaying }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const vAnalyser = engine.vocalAnalyser;
                const bufferLength = vAnalyser.frequencyBinCount;
                const vData = new Uint8Array(bufferLength);
                let req;
                const drawCurve = (dataArray, color, fillStyle) => {
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height);
                    const sliceWidth = canvas.width * 1.0 / (bufferLength / 1.5); 
                    let x = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 255.0;
                        const y = canvas.height - (v * canvas.height * 0.9);
                        if(i === 0) ctx.lineTo(x, y);
                        else {
                            const prevV = dataArray[i-1] / 255.0;
                            const prevY = canvas.height - (prevV * canvas.height * 0.9);
                            const xc = (x - sliceWidth + x) / 2;
                            const yc = (prevY + y) / 2;
                            ctx.quadraticCurveTo(x - sliceWidth, prevY, xc, yc);
                        }
                        x += sliceWidth;
                    }
                    ctx.lineTo(canvas.width, canvas.height);
                    ctx.lineTo(0, canvas.height);
                    ctx.fillStyle = fillStyle;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                };
                const render = () => {
                    req = requestAnimationFrame(render);
                    vAnalyser.getByteFrequencyData(vData);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const vGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    vGrad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
                    vGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    drawCurve(vData, '#ffffff', vGrad);
                };
                render();
                return () => cancelAnimationFrame(req);
            }, [engine]);
            return <canvas ref={canvasRef} width="600" height="150" className="w-full h-full absolute inset-0"></canvas>;
        }

        function TimelineWaveformCard({ engine, duration, currentTime, isPlaying, togglePlay, handleRestart, handleSeek, trim, onTrim, onSeekTime, formatTime }) {
            const d = duration || 0;
            const minGap = Math.min(MIN_CUT, d);
            const trackRef = useRef(null);
            const canvasRef = useRef(null);
            const dragRef = useRef(null);
            const [peaks, setPeaks] = useState(null);

            useEffect(() => { setPeaks(engine.getPeaks(600)); }, [engine, duration]);

            useEffect(() => {
                const c = canvasRef.current;
                if (!c || !peaks) return;
                const g = c.getContext('2d');
                const W = c.width, H = c.height;
                g.clearRect(0, 0, W, H);
                g.fillStyle = 'rgba(255,255,255,0.9)';
                const bw = W / peaks.length;
                for (let b = 0; b < peaks.length; b++) {
                    const h = Math.max(1, Math.pow(peaks[b], 0.7) * H * 0.85);
                    g.fillRect(b * bw, (H - h) / 2, Math.max(1, bw - 0.5), h);
                }
            }, [peaks]);

            const startPct = d > 0 ? (trim.start / d) * 100 : 0;
            const endPct = d > 0 ? (trim.end / d) * 100 : 100;
            const playPct = d > 0 ? Math.min(100, Math.max(0, (currentTime / d) * 100)) : 0;

            const timeFromX = (clientX) => {
                const r = trackRef.current.getBoundingClientRect();
                return Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * d;
            };
            const handleDown = (which) => (e) => {
                e.preventDefault();
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                dragRef.current = which;
            };
            const handleMove = (which) => (e) => {
                if (dragRef.current !== which) return;
                const t = timeFromX(e.clientX);
                if (which === 'start') onTrim(Math.min(t, trim.end - minGap), trim.end);
                else onTrim(trim.start, Math.max(t, trim.start + minGap));
            };
            const handleUp = (e) => { dragRef.current = null; try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {} };
            const handleTap = (e) => { onSeekTime(Math.min(Math.max(timeFromX(e.clientX), trim.start), Math.max(trim.start, trim.end - 0.05))); };

            return (
                <div className="glass-card rounded-2xl p-5 md:p-6 flex flex-col gap-4 shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-timeline text-zinc-300 text-sm"></i></div> Ruang Kerja Audio
                        </div>
                    </div>
                    <div>
                        <div ref={trackRef} className="relative h-24 select-none glass-inner rounded-xl overflow-hidden border border-white/10">
                            <div className="absolute inset-0 cursor-pointer" onClick={handleTap}>
                                <canvas ref={canvasRef} width="800" height="96" className="absolute inset-0 w-full h-full pointer-events-none opacity-70"></canvas>
                                <div className="absolute inset-y-0 left-0 bg-black/80 pointer-events-none border-r border-red-500/50" style={{ width: `${startPct}%` }}></div>
                                <div className="absolute inset-y-0 right-0 bg-black/80 pointer-events-none border-l border-red-500/50" style={{ width: `${100 - endPct}%` }}></div>
                                <div className="absolute inset-y-0 w-[2px] bg-white pointer-events-none z-20" style={{ left: `${playPct}%`, transform: 'translateX(-50%)' }}></div>
                            </div>
                            <div className="absolute inset-y-0 border-y border-white/20 pointer-events-none" style={{ left: `${startPct}%`, width: `${Math.max(0, endPct - startPct)}%` }}></div>
                            
                            <div className="absolute inset-y-0 w-6 flex justify-end cursor-ew-resize z-10" style={{ left: `${startPct}%`, transform: 'translateX(-100%)', touchAction: 'none' }} onPointerDown={handleDown('start')} onPointerMove={handleMove('start')} onPointerUp={handleUp} onPointerCancel={handleUp}>
                                <div className="w-1.5 h-full bg-zinc-400 hover:bg-white hover:scale-x-150 transition-all rounded-l"></div>
                            </div>
                            <div className="absolute inset-y-0 w-6 flex justify-start cursor-ew-resize z-10" style={{ left: `${endPct}%`, touchAction: 'none' }} onPointerDown={handleDown('end')} onPointerMove={handleMove('end')} onPointerUp={handleUp} onPointerCancel={handleUp}>
                                <div className="w-1.5 h-full bg-zinc-400 hover:bg-white hover:scale-x-150 transition-all rounded-r"></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CutAudioCard({ duration, currentTime, trim, onTrim }) {
            const d = duration || 0;
            const len = trim.end - trim.start;
            const isCut = trim.start > 0.001 || trim.end < d - 0.001;

            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                    <div className="flex items-center justify-between border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-scissors text-zinc-300 text-sm"></i></div> Potong Audio
                        </div>
                        <span className="text-xs font-mono text-zinc-400 bg-black/40 px-2 py-1 rounded">Durasi: <span className="text-white">{formatPrecise(len)}</span></span>
                    </div>

                    <div className="grid grid-cols-3 gap-2 text-center h-full">
                        <button onClick={() => onTrim(Math.min(currentTime, trim.end - MIN_CUT), trim.end)} className="py-3 glass-btn rounded-xl text-xs font-bold uppercase tracking-widest text-zinc-300 hover:text-white hover:border-white/30 flex flex-col items-center justify-center transition-all font-mono shadow-sm">
                            Awal <span className="text-[10px] opacity-70 mt-1">{formatPrecise(trim.start)}</span>
                        </button>
                        <button onClick={() => onTrim(trim.start, Math.max(currentTime, trim.start + MIN_CUT))} className="py-3 glass-btn rounded-xl text-xs font-bold uppercase tracking-widest text-zinc-300 hover:text-white hover:border-white/30 flex flex-col items-center justify-center transition-all font-mono shadow-sm">
                            Akhir <span className="text-[10px] opacity-70 mt-1">{formatPrecise(trim.end)}</span>
                        </button>
                        <button onClick={() => onTrim(0, d)} disabled={!isCut} className={`py-3 rounded-xl text-xs font-bold uppercase tracking-widest flex flex-col items-center justify-center transition-all font-mono shadow-sm ${isCut ? 'glass-btn border-red-500/30 text-red-400 hover:text-white hover:bg-red-500/50 hover:border-red-500' : 'opacity-30 text-zinc-500 border border-white/5 bg-transparent'}`}>
                            Reset <span className="text-[10px] opacity-70 mt-1">Penuh</span>
                        </button>
                    </div>
                </div>
            );
        }

        function FilterCard({ state, onIntensity, applyPreset }) {
            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-4 shadow-xl justify-between">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-microphone text-zinc-300 text-sm"></i></div> Vocal Clarity
                        </div>
                        <span className="text-xs font-mono font-bold text-white bg-black/40 px-2 py-1 rounded">{Math.round(state.intensity * 100)}%</span>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                        <button onClick={() => applyPreset('midhigh')} className="glass-btn py-2 px-2 rounded-xl text-[10px] font-bold uppercase tracking-wider text-zinc-300 hover:text-white hover:border-white/30 text-center transition-all">
                            Rendah
                        </button>
                        <button onClick={() => applyPreset('aggressive')} className="glass-btn py-2 px-2 rounded-xl text-[10px] font-bold uppercase tracking-wider text-zinc-300 hover:text-white hover:border-white/30 text-center transition-all">
                            Sedang
                        </button>
                        <button onClick={() => applyPreset('extreme')} className="glass-btn py-2 px-2 rounded-xl text-[10px] font-bold uppercase tracking-wider text-zinc-300 hover:text-white hover:border-white/30 text-center transition-all">
                            Tinggi
                        </button>
                    </div>

                    <div className="flex items-center gap-4 glass-inner p-3 rounded-xl border border-white/5 mt-1">
                        <i className="fa-solid fa-sliders text-sm text-zinc-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value={state.intensity} onChange={(e) => onIntensity(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                    </div>
                </div>
            );
        }

        function RobotCard({ level, onLevel }) {
            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-5 justify-center shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-fire text-zinc-300 text-sm"></i></div> Music
                        </div>
                        <span className="text-xs font-mono font-bold text-white bg-black/40 px-2 py-1 rounded">{Math.round(level * 100)}%</span>
                    </div>
                    <div className="flex items-center gap-4 glass-inner p-3 rounded-xl border border-white/5">
                        <i className="fa-solid fa-wave-square text-sm text-zinc-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value={level} onChange={(e) => onLevel(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                    </div>
                </div>
            );
        }

        function EchoCard({ level, onLevel }) {
            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-5 justify-center shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-volume-high text-zinc-300 text-sm"></i></div> Echo
                        </div>
                        <span className="text-xs font-mono font-bold text-white bg-black/40 px-2 py-1 rounded">{Math.round(level * 100)}%</span>
                    </div>
                    <div className="flex items-center gap-4 glass-inner p-3 rounded-xl border border-white/5">
                        <i className="fa-solid fa-podcast text-sm text-zinc-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value={level} onChange={(e) => onLevel(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
